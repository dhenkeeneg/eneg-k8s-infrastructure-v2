# =============================================================================
# Playbook: K3s HA-Cluster Installation & Upgrade
# =============================================================================
# Installiert K3s im HA-Modus mit embedded etcd auf 3 Server-Nodes.
# Unterstützt sowohl Erstinstallation als auch Rolling Upgrades.
#
# Voraussetzungen:
#   - SSH-Keys müssen bereits verteilt sein (01-setup-ssh-keys.yml)
#   - secrets.yml muss erstellt sein mit k3s_token (optional)
#
# Ausführung:
#   ansible-playbook playbooks/02-install-k3s.yml
#
# Mit Vault:
#   ansible-playbook playbooks/02-install-k3s.yml --ask-vault-pass
#
# Upgrade-Verhalten:
#   - Erkennt ob K3s bereits installiert ist
#   - Bei Erstinstallation: Volle Installation mit cluster-init/server-join
#   - Bei Upgrade: Rolling Update (Binary ersetzen, Service neu starten)
#   - Upgrade erfolgt sequentiell (serial: 1) um Cluster-Verfügbarkeit
#     zu gewährleisten
# =============================================================================

---
- name: K3s Cluster vorbereiten
  hosts: k3s_cluster
  become: true
  vars_files:
    - "{{ inventory_dir }}/group_vars/secrets.yml"
  
  tasks:
    - name: System-Pakete aktualisieren
      ansible.builtin.apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Notwendige Pakete installieren
      ansible.builtin.apt:
        name:
          - curl
          - apt-transport-https
          - ca-certificates
          - gnupg
          - lsb-release
        state: present

    - name: Swap deaktivieren (für Kubernetes)
      ansible.builtin.command: swapoff -a
      changed_when: false

    - name: Swap dauerhaft deaktivieren
      ansible.builtin.lineinfile:
        path: /etc/fstab
        regexp: '.*swap.*'
        state: absent

    - name: Prüfen ob K3s bereits installiert ist
      ansible.builtin.stat:
        path: /usr/local/bin/k3s
      register: k3s_binary

    - name: Installierte K3s Version prüfen
      ansible.builtin.shell: |
        if [ -f /usr/local/bin/k3s ]; then
          /usr/local/bin/k3s --version | head -n1 | awk '{print $3}'
        else
          echo "not_installed"
        fi
      register: k3s_current_version
      changed_when: false

    - name: Installations-Modus bestimmen
      ansible.builtin.set_fact:
        k3s_needs_install: "{{ k3s_current_version.stdout == 'not_installed' }}"
        k3s_needs_upgrade: "{{ k3s_current_version.stdout != 'not_installed' and k3s_current_version.stdout != k3s_version }}"
      
    - name: Aktuellen Status anzeigen
      ansible.builtin.debug:
        msg: >-
          Node {{ inventory_hostname }}:
          Aktuell={{ k3s_current_version.stdout }},
          Ziel={{ k3s_version }},
          Install={{ k3s_needs_install }},
          Upgrade={{ k3s_needs_upgrade }}

# =============================================================================
# K3s auf erstem Server installieren (nur bei Erstinstallation)
# =============================================================================

- name: K3s Initial Server - Erstinstallation
  hosts: k3s_initial_server
  become: true
  vars_files:
    - "{{ inventory_dir }}/group_vars/secrets.yml"
  
  tasks:
    - name: K3s Token generieren wenn nicht gesetzt
      ansible.builtin.set_fact:
        generated_k3s_token: "{{ lookup('password', '/dev/null chars=ascii_letters,digits length=64') }}"
      when: (k3s_token is not defined or k3s_token == "") and k3s_needs_install
      run_once: true

    - name: K3s Token setzen
      ansible.builtin.set_fact:
        final_k3s_token: "{{ k3s_token if (k3s_token is defined and k3s_token != '') else (generated_k3s_token | default('')) }}"
      run_once: true

    - name: K3s Konfigurationsverzeichnis erstellen
      ansible.builtin.file:
        path: /etc/rancher/k3s
        state: directory
        mode: '0755'

    - name: K3s Config-Datei erstellen
      ansible.builtin.template:
        src: ../templates/k3s-config.yaml.j2
        dest: /etc/rancher/k3s/config.yaml
        mode: '0644'

    - name: K3s Initial Server installieren (Cluster initialisieren)
      ansible.builtin.shell: |
        curl -sfL https://get.k3s.io | \
        INSTALL_K3S_VERSION={{ k3s_version }} \
        K3S_TOKEN={{ final_k3s_token }} \
        sh -s - server \
        --cluster-init
      when: k3s_needs_install
      environment:
        INSTALL_K3S_SKIP_START: "false"

    - name: Warten bis K3s API erreichbar ist
      ansible.builtin.wait_for:
        port: 6443
        host: "{{ ansible_host }}"
        delay: 10
        timeout: 300
      when: k3s_needs_install

    - name: Warten bis Node Ready ist
      ansible.builtin.shell: |
        /usr/local/bin/k3s kubectl get node {{ inventory_hostname }} \
        -o jsonpath='{.status.conditions[?(@.type=="Ready")].status}'
      register: node_ready
      until: node_ready.stdout == "True"
      retries: 30
      delay: 10
      changed_when: false
      when: k3s_needs_install

    - name: Node-Token für weitere Server holen
      ansible.builtin.slurp:
        src: /var/lib/rancher/k3s/server/node-token
      register: k3s_node_token

    - name: Node-Token als Fakt setzen
      ansible.builtin.set_fact:
        k3s_cluster_token: "{{ k3s_node_token.content | b64decode | trim }}"
      delegate_facts: true

# =============================================================================
# K3s auf weiteren Servern installieren (nur bei Erstinstallation)
# =============================================================================

- name: K3s Additional Servers - Erstinstallation
  hosts: k3s_additional_servers
  become: true
  serial: 1
  vars_files:
    - "{{ inventory_dir }}/group_vars/secrets.yml"
  
  tasks:
    - name: K3s Konfigurationsverzeichnis erstellen
      ansible.builtin.file:
        path: /etc/rancher/k3s
        state: directory
        mode: '0755'
      when: k3s_needs_install

    - name: K3s Config-Datei erstellen
      ansible.builtin.template:
        src: ../templates/k3s-config.yaml.j2
        dest: /etc/rancher/k3s/config.yaml
        mode: '0644'
      when: k3s_needs_install

    - name: K3s Additional Server installieren (Cluster beitreten)
      ansible.builtin.shell: |
        curl -sfL https://get.k3s.io | \
        INSTALL_K3S_VERSION={{ k3s_version }} \
        K3S_TOKEN={{ hostvars[groups['k3s_initial_server'][0]]['k3s_cluster_token'] }} \
        sh -s - server \
        --server {{ k3s_server_url }}
      when: k3s_needs_install
      environment:
        INSTALL_K3S_SKIP_START: "false"

    - name: Warten bis K3s API erreichbar ist
      ansible.builtin.wait_for:
        port: 6443
        host: "{{ ansible_host }}"
        delay: 10
        timeout: 300
      when: k3s_needs_install

    - name: Warten bis Node Ready ist
      ansible.builtin.shell: |
        /usr/local/bin/k3s kubectl get node {{ inventory_hostname }} \
        -o jsonpath='{.status.conditions[?(@.type=="Ready")].status}'
      register: node_ready
      until: node_ready.stdout == "True"
      retries: 30
      delay: 10
      changed_when: false
      when: k3s_needs_install

# =============================================================================
# Rolling Upgrade (wenn K3s bereits installiert ist)
# =============================================================================

- name: K3s Rolling Upgrade
  hosts: k3s_cluster
  become: true
  serial: 1
  order: sorted
  vars_files:
    - "{{ inventory_dir }}/group_vars/secrets.yml"
  
  tasks:
    - name: "Upgrade {{ inventory_hostname }} von {{ k3s_current_version.stdout }} auf {{ k3s_version }}"
      ansible.builtin.debug:
        msg: "Starte Rolling Upgrade auf {{ inventory_hostname }}"
      when: k3s_needs_upgrade

    - name: K3s Binary aktualisieren (ohne Service-Neustart)
      ansible.builtin.shell: |
        curl -sfL https://get.k3s.io | \
        INSTALL_K3S_VERSION={{ k3s_version }} \
        INSTALL_K3S_SKIP_START=true \
        sh -s -
      when: k3s_needs_upgrade

    - name: K3s Service neu starten
      ansible.builtin.systemd:
        name: k3s
        state: restarted
        daemon_reload: true
      when: k3s_needs_upgrade

    - name: Warten bis K3s API erreichbar ist
      ansible.builtin.wait_for:
        port: 6443
        host: "{{ ansible_host }}"
        delay: 5
        timeout: 120
      when: k3s_needs_upgrade

    - name: Warten bis Node Ready ist
      ansible.builtin.shell: |
        /usr/local/bin/k3s kubectl get node {{ inventory_hostname }} \
        -o jsonpath='{.status.conditions[?(@.type=="Ready")].status}'
      register: node_ready
      until: node_ready.stdout == "True"
      retries: 30
      delay: 10
      changed_when: false
      when: k3s_needs_upgrade

    - name: Neue Version bestätigen
      ansible.builtin.shell: /usr/local/bin/k3s --version | head -n1
      register: k3s_new_version
      changed_when: false
      when: k3s_needs_upgrade

    - name: "Upgrade-Status {{ inventory_hostname }}"
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }} erfolgreich aktualisiert auf: {{ k3s_new_version.stdout }}"
      when: k3s_needs_upgrade

# =============================================================================
# Cluster-Status prüfen und kubeconfig holen
# =============================================================================

- name: Cluster finalisieren
  hosts: k3s_initial_server
  become: true
  
  tasks:
    - name: Cluster-Status prüfen
      ansible.builtin.shell: /usr/local/bin/k3s kubectl get nodes -o wide
      register: cluster_nodes
      changed_when: false

    - name: Cluster-Nodes anzeigen
      ansible.builtin.debug:
        msg: "{{ cluster_nodes.stdout_lines }}"

    - name: etcd-Status prüfen
      ansible.builtin.shell: /usr/local/bin/k3s etcd-snapshot list 2>/dev/null || echo "etcd OK"
      register: etcd_status
      changed_when: false
      failed_when: false

    - name: kubeconfig Datei lesen
      ansible.builtin.slurp:
        src: /etc/rancher/k3s/k3s.yaml
      register: kubeconfig_content

    - name: Environment-Name aus Inventory-Pfad ableiten
      ansible.builtin.set_fact:
        k3s_env_name: "{{ inventory_dir | basename }}"

    - name: kubeconfig lokal speichern
      ansible.builtin.copy:
        content: "{{ kubeconfig_content.content | b64decode | replace('127.0.0.1', ansible_host) }}"
        dest: "{{ playbook_dir }}/../../kubeconfig-{{ k3s_env_name }}.yaml"
        mode: '0600'
      delegate_to: localhost
      become: false

    - name: Hinweis zur kubeconfig
      ansible.builtin.debug:
        msg: |
          ============================================================
          K3s Cluster ({{ k3s_env_name | upper }}) erfolgreich installiert/aktualisiert!
          
          kubeconfig wurde gespeichert unter:
            {{ playbook_dir }}/../../kubeconfig-{{ k3s_env_name }}.yaml
          
          Verwendung:
            export KUBECONFIG={{ playbook_dir }}/../../kubeconfig-{{ k3s_env_name }}.yaml
            kubectl get nodes
          
          Oder kopieren nach ~/.kube/config
          ============================================================
