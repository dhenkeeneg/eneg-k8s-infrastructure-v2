---
# =============================================================================
# Playbook: K3s CoreDNS-Migration (Phase 12)
# =============================================================================
# Sequenzieller K3s-Restart auf allen Mastern, damit nicht alle gleichzeitig
# offline sind (etcd-Quorum bleibt erhalten).
#
# Voraussetzung: k3s_disable enthaelt jetzt 'coredns' in
#                inventory/<env>/group_vars/all.yml
#
# Effekt: Nach diesem Playbook syncht K3s die /var/lib/rancher/k3s/server/
#         manifests/coredns.yaml NICHT mehr. Bestehende CoreDNS-Pods und
#         der kube-dns Service bleiben aktiv (K3s entfernt sie nicht), bis
#         sie im Cutover-Schritt manuell geloescht und durch die
#         ArgoCD-managed CoreDNS HA ersetzt werden.
#
# Ausfuehrung:
#   ansible-playbook -i ansible/inventory/dev ansible/playbooks/09-k3s-coredns-disable.yml
# =============================================================================

- name: K3s Config Update fuer CoreDNS-Migration
  hosts: k3s_cluster
  serial: 1            # WICHTIG: Sequenziell, nicht parallel — etcd-Quorum schuetzen
  become: true
  any_errors_fatal: true  # Bei Fehler: stop, nicht weiter zum naechsten Master

  tasks:
    - name: K3s Config-Datei deployen (mit coredns disabled)
      ansible.builtin.template:
        src: ../templates/k3s-config.yaml.j2
        dest: /etc/rancher/k3s/config.yaml
        mode: '0644'
      register: k3s_config

    - name: K3s neu starten falls Config geaendert
      ansible.builtin.systemd:
        name: k3s
        state: restarted
        daemon_reload: true
      when: k3s_config.changed

    - name: Warten bis K3s API wieder erreichbar ist
      # Statt anonyme uri /healthz (wirft 401 in modernen K3s — Auth required)
      # nutzen wir k3s kubectl, das das interne kubeconfig verwendet.
      ansible.builtin.command: k3s kubectl get --raw=/healthz
      register: k3s_health
      until: k3s_health.rc == 0 and 'ok' in (k3s_health.stdout | default(''))
      retries: 30
      delay: 10
      changed_when: false
      when: k3s_config.changed

    - name: 30s Stabilisierungs-Pause
      ansible.builtin.pause:
        seconds: 30
      when: k3s_config.changed

    - name: Status-Output
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }}: K3s
          {{ 'restarted (config changed)' if k3s_config.changed else 'unchanged (config already up-to-date)' }}
