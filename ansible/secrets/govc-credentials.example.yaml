# =============================================================================
# vSphere/govc Credentials (TEMPLATE) - PRO ENVIRONMENT
# =============================================================================
# Seit der vCenter-Aufteilung gibt es eine Datei PRO Environment:
#   - govc-credentials-dev.yaml   -> vcenter-b.eneg.de,  DC: TESTUMGEBUNG
#   - govc-credentials-test.yaml  -> vcenter-b.eneg.de,  DC: TESTUMGEBUNG
#   - govc-credentials-prod.yaml  -> vcenter-a.eneg.de,  DC: eNeG-Datacenter
#
# Das Playbook 08-rolling-os-update.yml laedt automatisch die zum
# target_env passende Datei: govc-credentials-{{ target_env }}.yaml
#
# WORKFLOW (auf k8s-mgmt-10), je Environment:
#   1. cp govc-credentials.example.yaml govc-credentials-<env>.yaml
#   2. Werte in govc-credentials-<env>.yaml eintragen
#   3. Verschluesseln: sops -e -i govc-credentials-<env>.yaml
#   4. Verify:         head govc-credentials-<env>.yaml   # muss "sops:"-Block zeigen
#   5. Erst dann commit + push
#
# Diese .example-Datei NICHT mit echten Werten fuellen.
# =============================================================================

---
# vCenter Hostname (ohne https://-Schema)
govc_url: "vcenter-x.eneg.de"

# vCenter Datacenter-Name (Pflicht - govc vm.info braucht den DC-Kontext)
govc_datacenter: "REPLACE_ME"

# vCenter Login (z.B. user@vsphere.local oder DOMAIN\user)
govc_username: "REPLACE_ME"

# vCenter Passwort
govc_password: "REPLACE_ME"

# TLS-Verifikation ueberspringen (true bei self-signed cert)
govc_insecure: "true"
