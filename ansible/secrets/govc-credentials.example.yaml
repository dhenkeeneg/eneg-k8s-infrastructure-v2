# =============================================================================
# vSphere/govc Credentials (TEMPLATE)
# =============================================================================
# WORKFLOW (auf k8s-mgmt-10):
#   1. cp govc-credentials.example.yaml govc-credentials.yaml
#   2. Werte in govc-credentials.yaml eintragen
#   3. Verschluesseln: sops -e -i govc-credentials.yaml
#   4. Verify:         head govc-credentials.yaml   # muss "sops:"-Block zeigen
#   5. Erst dann commit + push
#
# Diese .example-Datei NICHT mit echten Werten fuellen.
# =============================================================================

---
# vCenter Hostname (ohne https://-Schema)
govc_url: "vcenter-a.eneg.de"

# vCenter Login (z.B. user@vsphere.local oder DOMAIN\user)
govc_username: "REPLACE_ME"

# vCenter Passwort
govc_password: "REPLACE_ME"

# TLS-Verifikation ueberspringen (true bei self-signed cert)
govc_insecure: "true"
