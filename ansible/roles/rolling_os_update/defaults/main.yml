---
# =============================================================================
# Rolling OS Update Role - Default Variables
# =============================================================================
# Diese Defaults koennen via -e oder Inventory ueberschrieben werden.
# =============================================================================

# Pflicht-Variable (vom Aufrufer setzen): dev | test | prod
target_env: ""

# Wird automatisch aus target_env abgeleitet
kubectl_context: "k8s-{{ target_env }}"

# Pfad zur kubeconfig auf dem Ansible-Controller (k8s-mgmt-10).
# Wird in Play 2/3 als KUBECONFIG-Environment-Variable gesetzt, damit
# `delegate_to: localhost` Tasks auf die zentrale Multi-Context-Config
# zugreifen koennen (sonst wird nicht die Shell-Env von admin-ubuntu geerbt).
kubeconfig_path: "/home/admin-ubuntu/.kube/config"

# Pause zwischen Nodes (Sekunden) - gibt dem Cluster Zeit zur Stabilisierung
cooldown_seconds: 60

# =============================================================================
# Pre-Drain Health-Gate (Hebel 3, eingefuehrt 2026-07-23 nach DEV-Incident)
# =============================================================================
# Prueft UNMITTELBAR VOR dem Drain jedes einzelnen Nodes, ob der Cluster
# wirklich gesund ist (CNPG 3/3, Galera 3/3, keine laufenden Longhorn-Rebuilds).
# Grund: Die einmaligen Pre-Flight-Checks (run_once) sehen nur den Startzustand.
# Beim Incident war cnpg-erp nach dem ersten Node-Zyklus angeschlagen (nur 1-2
# gesunde Instanzen), als der Drain des zweiten Nodes startete -> PDB-Blockade
# -> Drain-Timeout -> Abbruch -> Rebuild-Sturm. Das Gate wartet aktiv bis der
# Cluster wieder voll gesund ist und bricht erst nach Timeout ab.
enable_pre_drain_health_gate: true
# Maximale Wartezeit auf Cluster-Gesundheit vor dem Drain (Sekunden)
health_gate_timeout_seconds: 900
# Poll-Intervall waehrend des Wartens (Sekunden)
health_gate_poll_interval_seconds: 15
# Longhorn-Rebuilds ins Gate einbeziehen (warten bis keine aktiven Rebuilds)
health_gate_check_longhorn_rebuilds: true

# kubectl drain Timeout (erhoeht wegen Volume-Detach + Maintenance-Operations)
drain_timeout_seconds: 900

# Reboot-Timeout (Ansible reboot module wartet auf SSH zurueck)
reboot_timeout_seconds: 600

# Pakete, die waehrend Update geschuetzt sind (apt-mark hold)
apt_hold_packages:
  - k3s
  - k3s-selinux

# vSphere-Snapshot vor jedem Node-Update
enable_vsphere_snapshot: true

# Snapshot bei erfolgreichem Update wieder loeschen (false = behalten)
snapshot_delete_on_success: true

# Reboot immer wenn Pakete installiert wurden (auch ohne /var/run/reboot-required)
# Entspricht der "Immer"-Reboot-Strategie
force_reboot_on_changes: true

# Namespaces, in denen nach CNPG-Clustern gesucht wird (--all-namespaces ist default)
# Diese Liste ist nur informativ fuer Pre-Checks-Output
cnpg_namespaces:
  - databases

# Velero - Mindestalter des letzten Backups (Pre-Check Warning if older)
velero_max_backup_age_hours: 26

# ArgoCD Namespace fuer Sync-Status-Check
argocd_namespace: "argocd"

# =============================================================================
# Maintenance-Mode Variablen (fuer pre_drain_prep / post_drain_cleanup)
# =============================================================================
# Diese steuern die "lehrbuchkonforme" Drain-Strategie:
# - CNPG nodeMaintenanceWindow waehrend Drain aktivieren (Vendor-Empfehlung)
# - Longhorn node-drain-policy temporaer auf allow-if-replica-is-stopped
# - MariaDB Galera PDB anpassen wenn 2+ Pods auf der Ziel-Node liegen
# =============================================================================

# CNPG: Aktiviere nodeMaintenanceWindow.inProgress=true vor dem Drain
# fuer alle Cluster, die Pods auf der Ziel-Node haben.
# reusePVC=true bedeutet: Pod-Recreation wartet bis Node zurueck ist.
# Quelle: https://cloudnative-pg.io/docs/1.28/kubernetes_upgrade/
enable_cnpg_maintenance_mode: true

# Longhorn: Temporaere Aenderung der node-drain-policy waehrend des Drains.
# Ermoeglicht Eviction der instance-manager Pods auch bei strict-local Volumes,
# da Replica nach Reboot wieder verfuegbar sein wird.
#
# WICHTIG (2026-07-23, nach DEV-Incident geprueft): Diese Policy MUSS aktiv
#   bleiben. Alle DB-Volumes (CNPG, Galera) sind Single-Replica (strict-local,
#   P2-Architektur). Bei 'block-if-contains-last-replica' wuerde der Drain an
#   der instance-manager-PDB blockieren, weil der Node die letzte (einzige)
#   Replica dieser Volumes haelt. 'allow-if-replica-is-stopped' erlaubt den
#   Drain, sobald die Volumes detached sind (Replica gestoppt) - was durch die
#   CNPG-/Galera-Maintenance-Modes vor dem Drain passiert. Der Rebuild-Sturm
#   aus dem Incident wurde NICHT durch diese Policy verursacht, sondern durch
#   den abgebrochenen Drain (dev-22 kam nie zurueck -> Wait-Interval lief ab).
#   Gegenmassnahme ist daher replicaReplenishmentWaitInterval=1200 (base),
#   NICHT das Abschalten dieser Policy.
#   Longhorn-Doc: "allow-if-replica-is-stopped so that the drain is not blocked
#   by the last healthy replica of a detached volume."
# Quelle: https://longhorn.io/docs/1.9.2/maintenance/maintenance/
enable_longhorn_drain_policy_override: true
longhorn_namespace: "longhorn-system"
longhorn_drain_policy_during_update: "allow-if-replica-is-stopped"

# MariaDB Galera: PDB-Anpassung wenn mehrere Galera-Pods auf der Ziel-Node sind.
# Aktuell hat das Galera-Setup KEIN Anti-Affinity, daher kann es vorkommen
# dass 2/3 Pods auf einer Node liegen (-> regulaerer Drain blockiert).
enable_mariadb_galera_pdb_override: true
mariadb_galera_namespace: "databases"
mariadb_galera_pdb_name: "mariadb-galera"
# Pod-Selector zum Zaehlen der Galera-Pods auf der Ziel-Node:
mariadb_galera_pod_selector: "app.kubernetes.io/instance=mariadb-galera"

# =============================================================================
# Image Pre-Warming Variablen (fuer image_prewarm.yml)
# =============================================================================
# Vor jedem Rolling-Update werden alle aktuell genutzten Images aus dem
# Cluster ermittelt und auf jeder Node sequenziell pre-gewarmed. Verhindert
# ImagePullBackOff bei Pod-Reschedule waehrend Drain (Erfahrung aus
# Phase 11 DEV/TEST OS-Updates).
# =============================================================================

# Pre-Warming aktivieren/deaktivieren
# Default: true (immer pre-warmen)
# Override: -e enable_prewarm=false (z.B. fuer Smoke-Tests)
enable_prewarm: true

# Audit-Trail-Pfad auf k8s-mgmt-10 (Image-Liste pro Lauf)
prewarm_audit_dir: "/tmp"

# Namespace + Secret-Name fuer GHCR-Pull-Secret
# Wird zur Auth bei privaten ghcr.io/dhenkeeneg/* Images verwendet.
# Falls Secret nicht vorhanden: private GHCR-Pulls schlagen fehl
# (werden im Statistik-Output als FAIL gezaehlt, aber kein Show-Stopper).
ghcr_pull_secret_namespace: "it-info-versand"
ghcr_pull_secret_name: "ghcr-pull-secret"

# Regex-Muster fuer Images, die Auth brauchen (private GHCR-Repos)
# Aktuell: alle Images unter ghcr.io/dhenkeeneg/*
ghcr_private_image_pattern: "^ghcr\\.io/dhenkeeneg/"
