---
# =============================================================================
# Cordon und Drain der Ziel-Node
# =============================================================================
# Wird auf localhost (mgmt-10) ausgefuehrt.
# =============================================================================

- name: Cordon {{ inventory_hostname }}
  ansible.builtin.command:
    cmd: kubectl --context {{ kubectl_context }} cordon {{ inventory_hostname }}
  delegate_to: localhost
  changed_when: true

- name: Drain {{ inventory_hostname }}
  ansible.builtin.command:
    cmd: >-
      kubectl --context {{ kubectl_context }} drain {{ inventory_hostname }}
      --ignore-daemonsets
      --delete-emptydir-data
      --timeout={{ drain_timeout_seconds }}s
      --grace-period=60
      --force=false
  delegate_to: localhost
  changed_when: true
  register: drain_result

- name: Drain-Ergebnis
  ansible.builtin.debug:
    msg: |
      Drain {{ inventory_hostname }} abgeschlossen.
      stdout (gekuerzt): {{ drain_result.stdout_lines | default([]) | last(5) }}
