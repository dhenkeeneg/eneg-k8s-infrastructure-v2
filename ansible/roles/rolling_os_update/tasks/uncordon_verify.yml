---
# =============================================================================
# Uncordon, Pod-Verify und CNPG-Verify
# =============================================================================
# Wird auf localhost (mgmt-10) ausgefuehrt.
# Task-Namen statisch (siehe Hinweis in drain.yml).
# =============================================================================

- name: "==== Uncordon-Phase fuer aktuellen Node ===="
  ansible.builtin.debug:
    msg: "==== Uncordon und Verify: {{ inventory_hostname }} ===="

- name: Uncordon Node
  ansible.builtin.command:
    cmd: kubectl --context {{ kubectl_context }} uncordon {{ inventory_hostname }}
  delegate_to: localhost
  changed_when: true

- name: 30 Sekunden warten damit Pods auf Node scheduled werden koennen
  ansible.builtin.pause:
    seconds: 30

- name: Pods auf Node pruefen
  ansible.builtin.command:
    argv:
      - kubectl
      - --context
      - "{{ kubectl_context }}"
      - get
      - pods
      - --all-namespaces
      - --field-selector
      - "spec.nodeName={{ inventory_hostname }}"
      - -o
      - 'jsonpath={range .items[*]}{.metadata.namespace}/{.metadata.name}|{.status.phase}{"\n"}{end}'
  delegate_to: localhost
  register: pods_on_node
  changed_when: false

- name: Pod-Status anzeigen
  ansible.builtin.debug:
    msg: |
      Pods auf {{ inventory_hostname }} nach Uncordon:
      {{ pods_on_node.stdout | default('(keine Pods)') }}

- name: Auf nicht-laufende Pods (CrashLoopBackOff, Error, Pending) hinweisen
  ansible.builtin.debug:
    msg: |
      WARNUNG: Pods auf {{ inventory_hostname }} sind nicht in Running/Succeeded.
      Bitte manuell pruefen.
  when: >-
    pods_on_node.stdout_lines
    | reject('search', '\\|Running$')
    | reject('search', '\\|Succeeded$')
    | list | length > 0

- name: Warten bis alle CNPG Cluster wieder healthy sind
  ansible.builtin.command:
    argv:
      - kubectl
      - --context
      - "{{ kubectl_context }}"
      - get
      - clusters.postgresql.cnpg.io
      - --all-namespaces
      - -o
      - 'jsonpath={range .items[*]}{.status.phase}{"\n"}{end}'
  delegate_to: localhost
  changed_when: false
  register: cnpg_phase_after_uncordon
  until: >-
    cnpg_phase_after_uncordon.stdout_lines | length == 0 or
    cnpg_phase_after_uncordon.stdout_lines
    | reject('eq', 'Cluster in healthy state')
    | list | length == 0
  retries: 30
  delay: 10
  when: hostvars['localhost'].cnpg_clusters_inventory | length > 0

- name: Verifikation erfolgreich
  ansible.builtin.debug:
    msg: "Node {{ inventory_hostname }} uncordoned, Pods OK, CNPG-Cluster healthy."
