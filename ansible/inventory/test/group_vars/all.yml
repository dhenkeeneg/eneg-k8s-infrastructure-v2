# =============================================================================
# Ansible Group Variables - TEST Environment
# =============================================================================

# -----------------------------------------------------------------------------
# K3s Konfiguration
# -----------------------------------------------------------------------------

# K3s Version (fest gepinnt fuer Reproduzierbarkeit)
k3s_version: "v1.35.1+k3s1"

# Cluster Token - wird aus secrets.yml geladen
# k3s_token: "{{ vault_k3s_token }}"

# API Server Endpoint (erster Node fuer initiales Setup)
k3s_server_url: "https://192.168.179.21:6443"

# TLS SANs - zusaetzliche Namen/IPs fuer das API-Zertifikat
k3s_tls_san:
  - "192.168.179.21"
  - "192.168.179.22"
  - "192.168.179.23"
  - "k8s-test-21.eneg.de"
  - "k8s-test-22.eneg.de"
  - "k8s-test-23.eneg.de"
  # kube-vip API-Server VIP (Control-Plane HA)
  - "192.168.179.20"
  - "k8s-test-api.eneg.de"

# kube-vip - API-Server VIP (Control-Plane HA)
# Siehe: ansible/files/kube-vip/kube-vip-test.yaml
# VIP muss AUSSERHALB des MetalLB-Pools liegen (.100 + .151-.199) -> .20 OK
kube_vip_address: "192.168.179.20"
kube_vip_interface: "ens160"
kube_vip_version: "v1.2.0"
kube_vip_manifest_src: "files/kube-vip/kube-vip-test.yaml"

# Komponenten die NICHT installiert werden sollen
# (wir installieren diese spaeter via GitOps)
k3s_disable:
  - traefik
  - servicelb
  - local-storage
  - coredns  # Phase 12: replaced durch ArgoCD-managed CoreDNS HA

# Zusaetzliche Server-Argumente
k3s_server_extra_args: >-
  --write-kubeconfig-mode 0644
  --etcd-expose-metrics

# -----------------------------------------------------------------------------
# SSH Keys fuer Zugriff auf die Nodes
# -----------------------------------------------------------------------------

ssh_authorized_keys:
  # Management-VM (k8s-mgmt-10)
  - comment: "k8s-mgmt-10.eneg.de"
    key: "{{ lookup('file', '~/.ssh/id_ed25519.pub') }}"
  
  # Windows Laptop
  - comment: "d.henke@eneg.de (Windows Laptop)"
    key: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIFN1xvxvSr48/g+SxUK9cHcwsqcmz4AlyZPrxJ6uEYjh d.henke@eneg.de"
  
  # MacMini
  - comment: "danielhenke@Mac.localdomain (MacMini)"
    key: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAILrOLG2pCnAguM5hzD6HaHXpigKLXjsSSpJ79xvLhgSi danielhenke@Mac.localdomain"
  
  # MacBook
  - comment: "danielhenke@MacBook-Pro (MacBook)"
    key: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIDm7pFaLd2LZGLfySx4G4/fax5KPgRy/HgXjHBwCM4LZ danielhenke@MacBook-Pro-von-Daniel.local"

# -----------------------------------------------------------------------------
# Systemkonfiguration
# -----------------------------------------------------------------------------

# Timezone
system_timezone: "Europe/Berlin"

# Lokale
system_locale: "de_DE.UTF-8"
