# =============================================================================
# Ansible Inventory - PROD Environment
# =============================================================================
# K3s HA-Cluster mit 3 Server-Nodes (embedded etcd)
# Alle Hosts in vcenter-a.eneg.de (ESXi 8.0.3)
#
# VM-Verteilung:
#   k8s-prod-21 -> s2842.eneg.de (S2842_SSD_01_VMS)
#   k8s-prod-22 -> s2843.eneg.de (S2843_SSD_01_VMS)
#   k8s-prod-23 -> s3168.eneg.de (S3168_SSD_01_VMS)
# =============================================================================

[k3s_cluster:children]
k3s_servers

[k3s_servers]
k8s-prod-21 ansible_host=192.168.178.21
k8s-prod-22 ansible_host=192.168.178.22
k8s-prod-23 ansible_host=192.168.178.23

# Der erste Server initialisiert den Cluster
[k3s_initial_server]
k8s-prod-21 ansible_host=192.168.178.21

# Weitere Server treten dem Cluster bei
[k3s_additional_servers]
k8s-prod-22 ansible_host=192.168.178.22
k8s-prod-23 ansible_host=192.168.178.23

# Alle Nodes fuer allgemeine Tasks
[all:vars]
ansible_user=admin-ubuntu
ansible_ssh_private_key_file=~/.ssh/id_ed25519
ansible_python_interpreter=/usr/bin/python3
