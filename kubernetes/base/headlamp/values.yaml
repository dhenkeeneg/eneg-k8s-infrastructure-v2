---
# Headlamp Base Values
# Kubernetes Dashboard - https://headlamp.dev
# Helm Chart: https://kubernetes-sigs.github.io/headlamp/

replicaCount: 1

config:
  inCluster: true

serviceAccount:
  create: true
  name: headlamp

clusterRoleBinding:
  create: true
  annotations: {}

service:
  type: ClusterIP
  port: 80

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 256Mi

# Ingress wird per Traefik IngressRoute im Overlay gemacht
ingress:
  enabled: false
