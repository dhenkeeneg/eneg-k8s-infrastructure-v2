---
# ArgoCD ConfigMap - KSOPS Integration für SOPS-Entschlüsselung
# Ermöglicht ArgoCD, SOPS-verschlüsselte Secrets automatisch zu entschlüsseln
apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cm
  namespace: argocd
  labels:
    app.kubernetes.io/name: argocd-cm
    app.kubernetes.io/part-of: argocd
data:
  # Enable KSOPS Kustomize plugin for SOPS decryption
  kustomize.buildOptions: "--enable-alpha-plugins --enable-exec"

  # Bekanntes ArgoCD-Normalisierungsproblem: Bei App-of-Apps fuegt Kubernetes
  # den Default "directory: recurse: false" zu Application-Ressourcen hinzu,
  # der im Git-Manifest nicht steht. Ohne diese Einstellung zeigt die
  # Infrastructure-App permanentes OutOfSync.
  # Ref: https://github.com/argoproj/argo-cd/issues/4501
  resource.customizations.ignoreDifferences.argoproj.io_Application: |
    jqPathExpressions:
      - .spec.source.directory

  # Kyverno v1.17: Der Admission Controller fuegt Default-Werte in ClusterPolicies
  # ein (admission, emitWarning, failurePolicy auf top-level; skipBackgroundRequests
  # und allowExistingViolations in rules). Diese Felder existieren nicht im
  # Helm-Template und erzeugen permanentes OutOfSync ohne ignoreDifferences.
  resource.customizations.ignoreDifferences.kyverno.io_ClusterPolicy: |
    managedFieldsManagers:
      - kyverno
    jsonPointers:
      - /spec/admission
      - /spec/emitWarning
      - /spec/failurePolicy
    jqPathExpressions:
      - .spec.rules[]?.skipBackgroundRequests
      - .spec.rules[]?.validate?.allowExistingViolations

  # Kyverno CRDs (policies.kyverno.io): Helm generiert leere metadata.annotations
  # und metadata.labels ({}) die Kubernetes beim Erstellen wegstreicht.
  # ArgoCD sieht den Diff zwischen "leere Map" vs "Feld nicht vorhanden".
  resource.customizations.ignoreDifferences.apiextensions.k8s.io_CustomResourceDefinition: |
    jqPathExpressions:
      - .metadata.annotations
      - .metadata.labels
      - .spec.conversion
      - .status

  # Server URL wird per Environment-Overlay gesetzt
