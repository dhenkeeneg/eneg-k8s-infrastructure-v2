---
# ArgoCD ConfigMap - KSOPS Integration für SOPS-Entschlüsselung
# Ermöglicht ArgoCD, SOPS-verschlüsselte Secrets automatisch zu entschlüsseln
apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cm
  namespace: argocd
  labels:
    app.kubernetes.io/name: argocd-cm
    app.kubernetes.io/part-of: argocd
data:
  # Enable KSOPS Kustomize plugin for SOPS decryption
  kustomize.buildOptions: "--enable-alpha-plugins --enable-exec"

  # Server URL (wird in Phase 4.2 mit Traefik/Ingress relevant)
  url: https://argocd-dev.eneg.de
