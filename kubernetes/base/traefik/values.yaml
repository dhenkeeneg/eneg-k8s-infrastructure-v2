# Traefik Helm Chart Values für DEV-Umgebung
# Chart: traefik/traefik v39.0.0
# Traefik: v3.6.7

# --- Deployment ---
deployment:
  replicas: 2

# --- Entrypoints ---
# v39.0.0 Breaking Change: http options require explicit 'http' nesting
ports:
  web:
    port: 80
    exposedPort: 80
    protocol: TCP
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true
  websecure:
    port: 443
    exposedPort: 443
    protocol: TCP
    http:
      tls:
        enabled: true

# --- Service (MetalLB) ---
service:
  type: LoadBalancer
  spec:
    loadBalancerIP: "192.168.180.100"
  annotations:
    metallb.universe.tf/address-pool: dev-pool

# --- IngressClass ---
ingressClass:
  enabled: true
  isDefaultClass: true

# --- Traefik Dashboard ---
api:
  dashboard: true
  insecure: false

ingressRoute:
  dashboard:
    enabled: true
    matchRule: Host(`traefik-dev.eneg.de`)
    entryPoints:
      - websecure
    tls: {}

# --- Logs ---
logs:
  general:
    level: INFO
  access:
    enabled: false

# --- Providers ---
providers:
  kubernetesCRD:
    enabled: true
    allowCrossNamespace: true
  kubernetesIngress:
    enabled: true
    publishedService:
      enabled: true

# --- Ressourcen ---
resources:
  requests:
    cpu: "100m"
    memory: "128Mi"
  limits:
    cpu: "500m"
    memory: "256Mi"

# --- Pod Disruption Budget ---
podDisruptionBudget:
  enabled: true
  minAvailable: 1

# --- Affinity: Pods auf verschiedene Nodes verteilen ---
affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - traefik
          topologyKey: kubernetes.io/hostname
