# Traefik Helm Chart Values - Basis-Konfiguration
# Chart: traefik/traefik v39.0.0
# Traefik: v3.6.7
#
# HINWEIS: Umgebungsspezifische Werte (LoadBalancer-IP, MetalLB-Pool,
# Dashboard-Hostname) werden per values-override.yaml im jeweiligen
# Environment-Overlay definiert.

# --- Deployment ---
deployment:
  replicas: 2

# --- Entrypoints ---
# v39.0.0 Breaking Change: http options require explicit 'http' nesting
ports:
  web:
    port: 80
    exposedPort: 80
    protocol: TCP
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true
  websecure:
    port: 443
    exposedPort: 443
    protocol: TCP
    http:
      tls:
        enabled: true

# --- Service (MetalLB) ---
# loadBalancerIP und annotations werden per Environment-Override gesetzt
service:
  type: LoadBalancer

# --- IngressClass ---
ingressClass:
  enabled: true
  isDefaultClass: true

# --- Traefik Dashboard ---
api:
  dashboard: true
  insecure: false

# Dashboard IngressRoute wird per Environment-Override konfiguriert
# (matchRule mit environment-spezifischem Hostname)

# --- Logs ---
logs:
  general:
    level: INFO
  access:
    enabled: false

# --- Providers ---
providers:
  kubernetesCRD:
    enabled: true
    allowCrossNamespace: true
  kubernetesIngress:
    enabled: true
    publishedService:
      enabled: true

# --- Ressourcen ---
resources:
  requests:
    cpu: "100m"
    memory: "128Mi"
  limits:
    cpu: "500m"
    memory: "256Mi"

# --- Pod Disruption Budget ---
podDisruptionBudget:
  enabled: true
  minAvailable: 1

# --- Affinity: Pods auf verschiedene Nodes verteilen ---
affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - traefik
          topologyKey: kubernetes.io/hostname
