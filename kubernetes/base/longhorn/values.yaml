# Longhorn Helm Chart Values
# Chart: longhorn/longhorn v1.9.2
# Distributed Block Storage für K3s HA-Cluster
# https://charts.longhorn.io

# -----------------------------------------------------------------------
# Default Settings
# -----------------------------------------------------------------------
defaultSettings:
  # Anzahl Replicas pro Volume (2 bei 3 Nodes: optimal für Space/Performance)
  defaultReplicaCount: 2

  # Data Locality: Replica bevorzugt auf dem Node wo der Pod läuft
  defaultDataLocality: best-effort

  # Replica Auto-Balance zwischen Nodes
  # 2026-07-17 (P5 Drift-Angleich): best-effort -> least-effort als
  # cluster-weiter Default fuer ALLE drei Umgebungen.
  # Begruendung: best-effort triggert permanente Rebuild-Operationen fuer
  # 1-Replica-Volumes (CNPG-WAL etc. auf strict-local, siehe P2), was zu
  # staendigen System-Snapshots ('becomes not ready to use') und unnoetiger
  # I/O-Last fuehrt. least-effort balanciert nur bei echt degradierten Volumes
  # und ist damit die konservativere (I/O-aermere) Einstellung. Gilt fuer
  # TEST/PROD identisch, da dort dieselbe strict-local/1-Replica-Architektur
  # existiert. War zuvor DEV-only-Override (seit 2026-05-18), jetzt in base
  # gezogen -> Drift strukturell aufgeloest.
  # Siehe: docs/phases/phase-13-kyverno-longhorn-stabilization-dev.md
  #        docs/migration/dev-to-test-prod-drift-2026-07.md (P5)
  replicaAutoBalance: least-effort

  # Disk-Reservierung: 25% des Disk-Space werden freigehalten
  storageReservedPercentageForDefaultDisk: 25

  # Over-Provisioning: 200% (Thin Provisioning)
  storageOverProvisioningPercentage: 200

  # Standard Datenpfad auf den Nodes
  defaultDataPath: /var/lib/longhorn

  # ArgoCD-Kompatibilität: preUpgradeChecker deaktivieren (PFLICHT für ArgoCD)
  # Verhindert Job-Konflikte bei ArgoCD-Sync
  upgradeChecker: false

  # Node-Drain-Verhalten: Replicas vor Drain auf andere Nodes verschieben
  nodeDrainPolicy: block-if-contains-last-replica

  # Automatisches Aufraeumen von verwaisten Ressourcen
  # 2026-07-17 (P5 Drift-Angleich): Als cluster-weiter Default fuer ALLE drei
  # Umgebungen explizit gesetzt (war zuvor DEV-only-Override seit 2026-07-05;
  # in DEV faktisch ohnehin ~136d Cluster-Default). In Longhorn v1.9 erwartet
  # das Setting eine Typ-Liste (replica-data;instance), NICHT true/false.
  # Nur replica-data gesetzt (verwaiste Replica-Verzeichnisse). Konsistenz-
  # Massnahme (kein Sicherheitsgewinn: verwaiste Replicas auf gestressten/
  # evictedeten Nodes werden ohnehin nicht auto-geloescht, siehe Incident
  # 2026-07-05). GracePeriod bis Auto-Loeschung eines Orphan-CR (Sekunden).
  # Siehe: docs/incidents/2026-07-05-longhorn-orphan-diskpressure-dev.md
  #        docs/migration/dev-to-test-prod-drift-2026-07.md (P5)
  orphanResourceAutoDeletion: "replica-data"
  orphanResourceAutoDeletionGracePeriod: "300"

  # --- Storm-Protection (Lessons Learned aus Incident 10.-12.05.2026) ----
  # Siehe docs/incidents/2026-05-11-mariadb-galera-recovery.md
  #
  # Nur 1-2 Replica-Rebuilds gleichzeitig pro Node statt Default 5.
  # Verhindert SSD-Overload bei vielen degraded Volumes (z.B. nach
  # Cluster-Restart oder transientem Storage-Storm). Mehrere parallele
  # Rebuilds koennen bei kleinen ESXi-Datastores eine I/O-Kaskade
  # ausloesen, die weitere Disks als "ausgefallen" markieren laesst.
  #
  # 2026-05-14: Erhoeht von 1 auf 2 nach erfolgreichem Cluster-Recovery
  # (Node 23 wieder gesund, idle Cluster ohne Workload-Last). Halbiert
  # die Rebuild-Restzeit (1 Rebuild ~ 60s pro Volume). Spaeter ggf.
  # zurueck auf 1 wenn alle Workloads aktiv sind.
  concurrentReplicaRebuildPerNodeLimit: 2

  # Wartezeit (Sekunden) bevor Longhorn fehlende Replicas auf einem
  # anderen Node neu aufbaut. Default Helm: 600 (10 min).
  # Hoher Wert gibt transienten Problemen (Node-Reboot, Netzwerk-Hickup,
  # kurze Storage-Stutzen) Zeit, sich von selbst zu loesen, und vermeidet
  # unnoetige Rebuilds. Hier explizit eingetragen, damit nicht versehentlich
  # per kubectl patch dauerhaft reduziert wird.
  replicaReplenishmentWaitInterval: 600

  # Max 1 paralleler Backup-Restore pro Node (statt Default 5).
  # Schuetzt Storage bei Velero-Mass-Restore (z.B. nach Cluster-Recovery).
  concurrentVolumeBackupRestorePerNodeLimit: 1

  # Timeout (Sekunden), nach dem die Engine eine nicht antwortende Replica
  # als 'error' markiert -> Fault + Rebuild. Default Longhorn: 8 (Minimum).
  # Gueltige Range v1.9.2: 8-30.
  # Erhoeht auf 16, damit kurze Host-/Datastore-Latenzspitzen (mehrere
  # Sekunden I/O-Stall auf einem ESXi-Host) nicht sofort einen Replica-Fault
  # und anschliessenden Rebuild-Sturm ausloesen. Ergaenzt die bestehende
  # Storm-Protection (concurrentReplicaRebuildPerNodeLimit,
  # replicaReplenishmentWaitInterval).
  #
  # 2026-07-13: Eingefuehrt nach host-weitem I/O-Stall auf ESXi s3168
  #   (VM-Disk-Latenz bis ~7s ueber 5-Min-Fenster, ~23 VMs betroffen),
  #   der auf k8s-prod-23 wiederholte Longhorn-Replica-Faults ausloeste.
  #   Nicht disruptiv (keine Pod-Restarts / Volume-Detach).
  #   Siehe: docs/incidents/2026-07-13-s3168-io-stall-longhorn-faults-prod.md
  engineReplicaTimeout: 16

# -----------------------------------------------------------------------
# Ingress (deaktiviert - wir nutzen Traefik IngressRoute)
# -----------------------------------------------------------------------
ingress:
  enabled: false

# -----------------------------------------------------------------------
# ArgoCD-Kompatibilität
# -----------------------------------------------------------------------
preUpgradeChecker:
  jobEnabled: false

# -----------------------------------------------------------------------
# Ressourcen: Manager (läuft auf jedem Node als DaemonSet)
# -----------------------------------------------------------------------
longhornManager:
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

# -----------------------------------------------------------------------
# Ressourcen: Driver
# -----------------------------------------------------------------------
longhornDriver:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi

# -----------------------------------------------------------------------
# Ressourcen: UI
# -----------------------------------------------------------------------
longhornUI:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi
  replicas: 1
