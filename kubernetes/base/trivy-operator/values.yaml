# Trivy Operator Base Values (generisch, alle Environments)
# Helm Chart: aqua/trivy-operator v0.32.1 (App v0.30.1)
# Docs: https://aquasecurity.github.io/trivy-operator/

# -- Operator Deployment
operator:
  # Alle Namespaces scannen (ausser Excludes)
  scanJobsConcurrentLimit: 3
  # Scan-Timeout fuer einzelne Jobs
  scanJobTimeout: 5m
  # -- Built-in Trivy Server im Cluster aktivieren
  # Chart-Konvention: Key liegt unter operator.*, NICHT unter trivy.* (fruehere
  # Position war wirkungslos -> trivy.mode blieb Standalone -> Cache-Lock-Races).
  # Setzt automatisch: trivy.mode=ClientServer und serverURL=http://trivy-operator-trivy:4975
  # Deployed zusaetzlich ein trivy-server-0 StatefulSet mit PVC fuer DB-Cache
  # -> Scan-Pods nutzen gemeinsamen Server, kein lokaler emptyDir-Cache mehr
  builtInTrivyServer: true

# -- Trivy Scanner Konfiguration
trivy:
  severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
  # Nur fixbare Schwachstellen anzeigen (optionale Verschaerfung)
  ignoreUnfixed: false
  # Timeout fuer einzelne Scans
  timeout: 5m0s

  # -- Trivy Server (wird bei operator.builtInTrivyServer=true deployed)
  server:
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        cpu: 1000m
        memory: 1Gi

# -- Scan-Typen aktivieren
vulnerabilityReportsScanner: Trivy
configAuditReportsScanner: Trivy
exposedSecretReportsScanner: Trivy

# -- Operator Ressourcen
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

# -- Prometheus ServiceMonitor
serviceMonitor:
  enabled: true
  interval: 60s

# -- Namespaces die vom Scanning ausgeschlossen werden
excludeNamespaces: ""

# -- Automatische Scans bei neuen Workloads
scanJobsRetryDelay: 30s
