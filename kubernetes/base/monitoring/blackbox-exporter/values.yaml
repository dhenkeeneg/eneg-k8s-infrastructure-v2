# Blackbox Exporter Helm Chart Values - Basis-Konfiguration
# Chart: prometheus-community/prometheus-blackbox-exporter v11.9.1
# Blackbox Exporter v0.28.0
#
# Probes fuer S3 Endpoint Health (NAS10) und weitere Targets.

# --- Blackbox Module-Konfiguration ---
config:
  modules:
    http_2xx:
      prober: http
      timeout: 10s
      http:
        valid_http_versions: ["HTTP/1.1", "HTTP/2.0"]
        follow_redirects: true
        preferred_ip_protocol: ip4
    http_s3_health:
      prober: http
      timeout: 10s
      http:
        valid_http_versions: ["HTTP/1.1"]
        valid_status_codes: [200, 301, 403, 404]
        method: GET
        preferred_ip_protocol: ip4

# --- ServiceMonitor fuer Prometheus ---
serviceMonitor:
  enabled: true
  defaults:
    module: http_2xx
    interval: 60s
    scrapeTimeout: 30s

  targets:
    - name: nas10-s3-endpoint
      url: http://nas10.eneg.de:8010
      module: http_s3_health
      interval: 30s
      scrapeTimeout: 10s

# --- Resources ---
resources:
  requests:
    cpu: 25m
    memory: 32Mi
  limits:
    memory: 64Mi
