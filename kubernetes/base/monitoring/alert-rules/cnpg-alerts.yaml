---
# PrometheusRule: CloudNativePG Database Health Alerts
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: cnpg-alerts
  namespace: monitoring
  labels:
    app: kube-prometheus-stack
    release: kube-prometheus-stack
spec:
  groups:
    - name: cnpg.rules
      rules:
        # CNPG WAL-Volume Fuellstand (Warning >= 70%)
        - alert: CnpgWalVolumeWarning
          expr: |
            (kubelet_volume_stats_used_bytes{namespace="databases", persistentvolumeclaim=~".*-wal"}
            / kubelet_volume_stats_capacity_bytes{namespace="databases", persistentvolumeclaim=~".*-wal"})
            * 100 >= 70
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "CNPG WAL-Volume {{ $labels.persistentvolumeclaim }} bei {{ $value | printf \"%.0f\" }}%"
            description: "WAL-Volume {{ $labels.persistentvolumeclaim }} in Namespace {{ $labels.namespace }} ist zu {{ $value | printf \"%.0f\" }}% voll."

        # CNPG WAL-Volume Fuellstand (Critical >= 85%)
        - alert: CnpgWalVolumeCritical
          expr: |
            (kubelet_volume_stats_used_bytes{namespace="databases", persistentvolumeclaim=~".*-wal"}
            / kubelet_volume_stats_capacity_bytes{namespace="databases", persistentvolumeclaim=~".*-wal"})
            * 100 >= 85
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "CNPG WAL-Volume {{ $labels.persistentvolumeclaim }} KRITISCH bei {{ $value | printf \"%.0f\" }}%"
            description: "WAL-Volume {{ $labels.persistentvolumeclaim }} in Namespace {{ $labels.namespace }} ist zu {{ $value | printf \"%.0f\" }}% voll. Sofortige Aktion erforderlich!"

        # CNPG Cluster Not Ready
        - alert: CnpgClusterNotReady
          expr: |
            cnpg_collector_up{namespace="databases"} == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "CNPG Cluster {{ $labels.cluster }} nicht erreichbar"
            description: "CloudNativePG Cluster {{ $labels.cluster }} in Namespace {{ $labels.namespace }} ist seit 5 Minuten nicht erreichbar."

        # CNPG Cluster ohne Primary (Vorbote des WAL-Deadlocks)
        # Siehe Incident 2026-06-29: Ohne aktiven Primary recycelt PostgreSQL
        # kein WAL -> das WAL-Volume laeuft voll -> "Not enough disk space" ->
        # Pod startet nicht -> kein Primary (Henne-Ei-Deadlock). Frueh warnen,
        # bevor das WAL-Volume zu wachsen beginnt.
        # Logik: pro Cluster hat genau 1 Pod in_recovery=0 (der Primary), die
        # Replicas haben =1. Faellt der Primary weg, gibt es 0 Pods mit =0 ->
        # count < 1 feuert. Ein kompletter Exporter-Ausfall (keine Series) wird
        # hiervon NICHT erfasst, sondern von CnpgClusterNotReady (collector_up).
        # for: 15m ueberlebt jeden normalen Switchover/Restart (Sekunden bis
        # ~1-2 min) sowie laengere Sonderfaelle (pg_basebackup-Join, kurze API-
        # Server-Haenger). Der WAL-Deadlock baut sich erst ueber Stunden auf
        # (Incident: ~3,5 Tage) -> 15 min Vorlauf sind weiterhin sehr frueh.
        - alert: CnpgClusterNoPrimary
          expr: |
            count by (cluster, namespace) (
              cnpg_pg_replication_in_recovery{namespace="databases"} == 0
            ) < 1
          for: 15m
          labels:
            severity: critical
          annotations:
            summary: "CNPG Cluster {{ $labels.cluster }} hat keinen aktiven Primary"
            description: "Cluster {{ $labels.cluster }} (Namespace {{ $labels.namespace }}) hat seit 15 Minuten keinen Pod im Primary-Zustand (alle in Recovery). Ohne Primary staut sich WAL -> Gefahr des WAL-Deadlocks. Pod-Status und CNPG-Cluster-Phase pruefen. Runbook: docs/runbooks/cnpg-frozen-replica-stale-slot.md"

        # CNPG Replication Lag Warning (> 30s)
        - alert: CnpgReplicationLagWarning
          expr: |
            cnpg_pg_replication_lag{namespace="databases"} > 30
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "CNPG Replication Lag {{ $labels.cluster }} bei {{ $value | printf \"%.0f\" }}s"
            description: "Replication Lag fuer Cluster {{ $labels.cluster }} Pod {{ $labels.pod }} ist {{ $value | printf \"%.0f\" }} Sekunden."

        # CNPG Replication Lag Critical (> 120s)
        - alert: CnpgReplicationLagCritical
          expr: |
            cnpg_pg_replication_lag{namespace="databases"} > 120
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "CNPG Replication Lag {{ $labels.cluster }} KRITISCH bei {{ $value | printf \"%.0f\" }}s"
            description: "Replication Lag fuer Cluster {{ $labels.cluster }} Pod {{ $labels.pod }} ist {{ $value | printf \"%.0f\" }} Sekunden. Moeglicher Datenverlust!"

        # CNPG WAL-Archivierung fehlgeschlagen (> 5 min)
        - alert: CnpgWalArchivingFailed
          expr: |
            increase(cnpg_pg_stat_archiver_failed_count{namespace="databases"}[5m]) > 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "CNPG WAL-Archivierung fehlgeschlagen fuer {{ $labels.cluster }}"
            description: "WAL-Archivierung fuer Cluster {{ $labels.cluster }} hat in den letzten 5 Minuten Fehler. S3-Endpoint pruefen!"

        # CNPG Replication Slot inaktiv auf Primary (Frozen-Replica-Pattern)
        # Siehe Incident 2026-05-16: Inaktive Slots halten WALs auf dem Primary
        # zurueck und sind Vorbote eines vollen WAL-Volumes (CnpgWalVolume*).
        # Filter via cnpg_pg_replication_in_recovery == 0 (nur Primary, ignoriert
        # die lokalen Slot-Spiegelungen auf Standby-Pods).
        - alert: CnpgReplicationSlotInactive
          expr: |
            (cnpg_pg_replication_slots_active{namespace="databases", slot_type="physical"} == 0)
            and on (pod, namespace)
            (cnpg_pg_replication_in_recovery == 0)
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "CNPG Replication Slot {{ $labels.slot_name }} inaktiv auf Primary {{ $labels.pod }}"
            description: "Slot {{ $labels.slot_name }} auf Primary {{ $labels.pod }} (Namespace {{ $labels.namespace }}) seit 10 Minuten inaktiv. Replica streamt nicht und WALs koennen sich auf dem Primary stauen. Diagnose: pg_stat_wal_receiver auf der Replica pruefen, Pod-Status, Timeline-Konflikte. Runbook: docs/runbooks/cnpg-frozen-replica-stale-slot.md"
