---
# KSOPS Secret Generator fuer CloudNativePG S3-Credentials
# ArgoCD entschluesselt dieses Secret automatisch via KSOPS + Age
apiVersion: viaduct.ai/v1
kind: ksops
metadata:
  name: cnpg-s3-secret-generator
  annotations:
    config.kubernetes.io/function: |
      exec:
        path: ksops
files:
  - ./s3-credentials.enc.yaml

