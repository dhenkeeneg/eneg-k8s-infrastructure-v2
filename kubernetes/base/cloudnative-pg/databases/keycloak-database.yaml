---
# CloudNativePG Database: keycloak
# Erstellt die keycloak-Datenbank deklarativ auf dem cnpg-shared Cluster
# Owner ist die managed role "keycloak" (definiert in cnpg-shared.yaml)
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: keycloak
  namespace: databases
  labels:
    app.kubernetes.io/part-of: cloudnative-pg
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/component: database
spec:
  name: keycloak
  owner: keycloak
  cluster:
    name: cnpg-shared
