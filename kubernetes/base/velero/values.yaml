# Velero Helm Chart Values (Base)
# Chart: vmware-tanzu/velero v11.3.2 (App v1.17.1)
# Kubernetes Backup & Disaster Recovery
# https://vmware-tanzu.github.io/helm-charts

# -----------------------------------------------------------------------
# Velero Server
# -----------------------------------------------------------------------
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

# -----------------------------------------------------------------------
# Init Containers: AWS S3 Plugin
# -----------------------------------------------------------------------
initContainers:
  - name: velero-plugin-for-aws
    image: velero/velero-plugin-for-aws:v1.13.0
    imagePullPolicy: IfNotPresent
    volumeMounts:
      - mountPath: /target
        name: plugins

# -----------------------------------------------------------------------
# node-agent DaemonSet (fs-backup fuer PV-Daten via kopia)
# -----------------------------------------------------------------------
deployNodeAgent: true

nodeAgent:
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  # CA-Bundle-Mount fuer sauberes TLS gegen NAS20 (QuObjects liefert nur
  # das Leaf-Zert auf 8010). Der node-agent oeffnet die Kopia-Backup-Repos
  # direkt gegen S3 und braucht daher DASSELBE CA-Bundle wie der Server.
  # Ohne diesen Mount schlagen ALLE PodVolumeBackups mit
  # "certificate signed by unknown authority" fehl (BackupRepository NotReady).
  # AWS_CA_BUNDLE=/etc/ca/ca.crt wird vom Chart global gesetzt; hier fehlte
  # bisher nur der Volume-Mount fuer das DaemonSet.
  # Secret velero-s3-ca (NS velero, Sectigo R36+R46), verwaltet von velero-secrets.
  extraVolumes:
    - name: s3-ca
      secret:
        secretName: velero-s3-ca
  extraVolumeMounts:
    - name: s3-ca
      mountPath: /etc/ca
      readOnly: true

# -----------------------------------------------------------------------
# Backup-Konfiguration
# -----------------------------------------------------------------------
configuration:
  # Alle PVs per File System Backup sichern
  defaultVolumesToFsBackup: true

  # Backup Storage Location (S3-kompatibel)
  # Umgebungsspezifische Werte (bucket, s3Url) im Override
  #
  # HINWEIS: Helm merged Listen NICHT element-weise - der Override
  # ersetzt diese ganze Liste. Eintraege hier wirken nur, wenn das
  # Environment-Override `backupStorageLocation` nicht definiert.
  # Daher: `checksumAlgorithm` muss zusaetzlich in jedem Override
  # gesetzt werden, um wirksam zu sein. Hier dokumentiert als Default.
  backupStorageLocation:
    - name: default
      provider: aws
      default: true
      accessMode: ReadWrite
      config:
        region: us-east-1
        s3ForcePathStyle: "true"
        # Workaround fuer S3-Compat-Provider (z.B. QNAP QuObjects),
        # die x-amz-sdk-checksum-algorithm / Trailing-Checksums nicht
        # unterstuetzen. Leer-String unterdrueckt SDK-side Checksum.
        # Ref: velero-io/velero#8265, #8742
        checksumAlgorithm: ""

# -----------------------------------------------------------------------
# Credentials: Verweis auf bestehendes SOPS-Secret
# -----------------------------------------------------------------------
credentials:
  useSecret: true
  existingSecret: velero-s3-credentials

# -----------------------------------------------------------------------
# Volume Snapshot Location: Nicht verwendet (kein Cloud-Provider)
# -----------------------------------------------------------------------
snapshotsEnabled: false

# -----------------------------------------------------------------------
# Prometheus ServiceMonitor (fuer Phase 7 Monitoring)
# -----------------------------------------------------------------------
metrics:
  enabled: true
  serviceMonitor:
    enabled: true
    additionalLabels:
      release: kube-prometheus-stack

# -----------------------------------------------------------------------
# ArgoCD-Kompatibilitaet
# -----------------------------------------------------------------------
upgradeJobResources: {}
upgradeCRDs: false
