---
# MariaDB Databases fuer i-doit Open 37
# i-doit benoetigt zwei Datenbanken: idoit_system + idoit_data
# Erstellt via MariaDB Operator Database CRD
apiVersion: k8s.mariadb.com/v1alpha1
kind: Database
metadata:
  name: idoit-system
  namespace: databases
  labels:
    app.kubernetes.io/name: idoit
    app.kubernetes.io/managed-by: argocd
spec:
  mariaDbRef:
    name: mariadb-galera
  characterSet: utf8mb4
  collate: utf8mb4_unicode_ci
---
apiVersion: k8s.mariadb.com/v1alpha1
kind: Database
metadata:
  name: idoit-data
  namespace: databases
  labels:
    app.kubernetes.io/name: idoit
    app.kubernetes.io/managed-by: argocd
spec:
  mariaDbRef:
    name: mariadb-galera
  characterSet: utf8mb4
  collate: utf8mb4_unicode_ci
