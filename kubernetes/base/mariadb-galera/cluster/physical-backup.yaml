---
# PhysicalBackup: MariaDB Galera auf S3
# Taeglich um 02:30 UTC (versetzt zu CNPG Backups)
# Verwendet mariabackup mit gzip-Kompression
apiVersion: k8s.mariadb.com/v1alpha1
kind: PhysicalBackup
metadata:
  name: mariadb-galera-backup
  namespace: databases
  labels:
    app.kubernetes.io/part-of: mariadb-galera
    app.kubernetes.io/managed-by: argocd
spec:
  mariaDbRef:
    name: mariadb-galera

  # Schedule: Taeglich 02:30 UTC (nach CNPG Backups)
  schedule:
    cron: "30 2 * * *"

  # Backup von Replica nehmen (schont Primary)
  target: PreferReplica

  # Kompression
  compression: gzip

  # Retention: 7 Tage (DEV)
  maxRetention: 168h

  # S3 Storage
  storage:
    s3:
      endpoint: "nas10.eneg.de:8010"
      bucket: k8s-dev-mariadb-backup
      prefix: mariadb-galera/
      accessKeyIdSecretKeyRef:
        name: mariadb-credentials
        key: S3_ACCESS_KEY_ID
      secretAccessKeySecretKeyRef:
        name: mariadb-credentials
        key: S3_SECRET_ACCESS_KEY
      tls:
        enabled: false

  # Backup-Job Limits
  backoffLimit: 3
  successfulJobsHistoryLimit: 3

  # Resources fuer Backup-Job
  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "500m"
