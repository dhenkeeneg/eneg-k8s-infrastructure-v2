---
# TLS Zertifikat fuer Keycloak
# Liegt im traefik Namespace (Standard-Pattern fuer alle Apps)
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: keycloak-tls
  namespace: traefik
spec:
  secretName: keycloak-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
    - keycloak-dev-v2.eneg.de
---
# IngressRoute fuer Keycloak
# Pattern: IngressRoute + Certificate im traefik Namespace,
# Service-Referenz cross-namespace zum Backend (keycloak)
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: keycloak
  namespace: traefik
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`keycloak-dev-v2.eneg.de`)
      kind: Rule
      services:
        - name: keycloak
          namespace: keycloak
          port: 8080
  tls:
    secretName: keycloak-tls
