---
# i-doit Open 37 Deployment
# PHP 8.3 + Apache 2.4 auf eigenem Docker Image (ghcr.io)
# Datenbank: MariaDB Galera 11.8.6 (databases Namespace)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: idoit
  namespace: idoit
  labels:
    app.kubernetes.io/name: idoit
    app.kubernetes.io/version: "37"
    app.kubernetes.io/part-of: pilot-apps
    app.kubernetes.io/managed-by: argocd
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: idoit
  template:
    metadata:
      labels:
        app.kubernetes.io/name: idoit
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      # fsGroup 33 (www-data) fuer PVC-Berechtigungen
      # Apache startet als root und wechselt dann zu www-data
      securityContext:
        fsGroup: 33
      containers:
        - name: idoit
          image: ghcr.io/dhenkeeneg/idoit-open:37
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          env:
            # MariaDB Verbindungsdaten
            # i-doit liest diese NICHT automatisch aus ENV.
            # Die Konfiguration erfolgt ueber den Setup-Wizard
            # oder config.inc.php. ENV-Variablen hier zur Referenz
            # und fuer eventuelle Automatisierung.
            - name: IDOIT_DB_HOST
              value: "mariadb-galera-primary.databases.svc.cluster.local"
            - name: IDOIT_DB_PORT
              value: "3306"
            - name: IDOIT_DB_USER
              value: "idoit"
            - name: IDOIT_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: idoit-secrets
                  key: db-password
            - name: IDOIT_SYSTEM_DB
              value: "idoit_system"
            - name: IDOIT_DATA_DB
              value: "idoit_data"
            - name: IDOIT_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: idoit-secrets
                  key: admin-password
          volumeMounts:
            - name: idoit-data
              mountPath: /var/www/html/i-doit/upload
              subPath: upload
            - name: idoit-data
              mountPath: /var/www/html/i-doit/temp
              subPath: temp
            - name: idoit-data
              mountPath: /var/www/html/i-doit/log
              subPath: log
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          # Startup-Probe grosszuegig (erster Start: PHP-Setup, Apache)
          startupProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
      volumes:
        - name: idoit-data
          persistentVolumeClaim:
            claimName: idoit-data
