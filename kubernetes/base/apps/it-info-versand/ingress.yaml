---
# TLS Zertifikat fuer IT-Info-Versand
# Liegt im traefik Namespace (Standard-Pattern fuer alle Apps)
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: it-info-versand-tls
  namespace: traefik
spec:
  secretName: it-info-versand-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
    - it-info-versand-dev.eneg.de
---
# IngressRoute fuer IT-Info-Versand
# Pattern: IngressRoute + Certificate im traefik Namespace,
# Service-Referenz cross-namespace zum Backend (it-info-versand)
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: it-info-versand
  namespace: traefik
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`it-info-versand-dev.eneg.de`)
      kind: Rule
      services:
        - name: it-info-versand
          namespace: it-info-versand
          port: 8000
  tls:
    secretName: it-info-versand-tls
