---
# TLS Zertifikat fuer n8n
# Liegt im traefik Namespace (Standard-Pattern fuer alle Apps)
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: n8n-tls
  namespace: traefik
spec:
  secretName: n8n-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
    - n8n-dev-v2.eneg.de
---
# IngressRoute fuer n8n
# Pattern: IngressRoute + Certificate im traefik Namespace,
# Service-Referenz cross-namespace zum Backend (n8n)
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: n8n
  namespace: traefik
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`n8n-dev-v2.eneg.de`)
      kind: Rule
      services:
        - name: n8n
          namespace: n8n
          port: 5678
  tls:
    secretName: n8n-tls
