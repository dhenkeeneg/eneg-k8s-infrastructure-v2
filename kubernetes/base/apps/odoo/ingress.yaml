---
# TLS Zertifikat fuer Odoo
# Liegt im traefik Namespace (Standard-Pattern fuer alle Apps)
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: odoo-tls
  namespace: traefik
spec:
  secretName: odoo-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
    - odoo-dev-v2.eneg.de
---
# IngressRoute fuer Odoo
# Pattern: IngressRoute + Certificate im traefik Namespace,
# Service-Referenz cross-namespace zum Backend (odoo)
# Zwei Routen: WebSocket (gevent) und HTTP (Standard)
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: odoo
  namespace: traefik
spec:
  entryPoints:
    - websecure
  routes:
    # WebSocket Route (muss vor der allgemeinen Route stehen)
    - match: Host(`odoo-dev-v2.eneg.de`) && PathPrefix(`/websocket`)
      kind: Rule
      services:
        - name: odoo
          namespace: odoo
          port: 8072
    # Odoo HTTP (Web + API)
    - match: Host(`odoo-dev-v2.eneg.de`)
      kind: Rule
      services:
        - name: odoo
          namespace: odoo
          port: 8069
  tls:
    secretName: odoo-tls
