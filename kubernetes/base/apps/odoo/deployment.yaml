---
# Odoo 18 CE Deployment
# Multi-Process Modus (2 HTTP-Worker + Gevent + Cron)
# Einzelne Replica (Odoo ist nicht horizontal skalierbar)
# Init-Container injiziert Secrets in odoo.conf
apiVersion: apps/v1
kind: Deployment
metadata:
  name: odoo
  namespace: odoo
  labels:
    app.kubernetes.io/name: odoo
    app.kubernetes.io/version: "18"
    app.kubernetes.io/managed-by: argocd
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: odoo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: odoo
    spec:
      # Odoo laeuft als User odoo (UID 101) im offiziellen Image
      securityContext:
        fsGroup: 101
        runAsUser: 101
        runAsGroup: 101
      # Init-Container: Secrets in odoo.conf injizieren
      initContainers:
        - name: init-config
          image: busybox:1.37
          command:
            - /bin/sh
            - -c
            - |
              cp /config-template/odoo.conf /config/odoo.conf
              echo "" >> /config/odoo.conf
              echo "; Injected from Secrets" >> /config/odoo.conf
              echo "db_password = $(cat /secrets/db-password)" >> /config/odoo.conf
              echo "admin_passwd = $(cat /secrets/admin-password)" >> /config/odoo.conf
          volumeMounts:
            - name: config-template
              mountPath: /config-template
              readOnly: true
            - name: config
              mountPath: /config
            - name: secrets
              mountPath: /secrets
              readOnly: true

      containers:
        - name: odoo
          image: odoo:18
          ports:
            - name: http
              containerPort: 8069
              protocol: TCP
            - name: gevent
              containerPort: 8072
              protocol: TCP
          # Odoo liest Config aus -c Parameter
          args:
            - "--config=/config/odoo.conf"
          env:
            # ODOO_RC zeigt das Entrypoint-Script auf unsere Config-Datei.
            # Das Script liest db_host/db_port/db_user/db_password aus dieser
            # Datei und uebergibt sie als CLI-Argumente an Odoo.
            # Ohne ODOO_RC sucht es in /etc/odoo/odoo.conf (Default, leer).
            - name: ODOO_RC
              value: "/config/odoo.conf"
            # HOST/PASSWORD als Fallback falls check_config fehlschlaegt
            - name: HOST
              value: "cnpg-erp-rw.databases.svc.cluster.local"
            - name: PORT
              value: "5432"
            - name: USER
              value: "odoo"
            - name: PASSWORD
              valueFrom:
                secretKeyRef:
                  name: odoo-secrets
                  key: db-password
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            - name: filestore
              mountPath: /var/lib/odoo
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          # Startup: Odoo braucht laenger beim ersten Start (DB-Init)
          startupProbe:
            httpGet:
              path: /web/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 30
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /web/health
              port: http
            periodSeconds: 30
            failureThreshold: 3
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /web/health
              port: http
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 5

      volumes:
        - name: config-template
          configMap:
            name: odoo-config
            items:
              - key: odoo.conf
                path: odoo.conf
        - name: config
          emptyDir: {}
        - name: secrets
          secret:
            secretName: odoo-secrets
        - name: filestore
          persistentVolumeClaim:
            claimName: odoo-filestore
---
# PVC fuer Odoo Filestore (Attachments, Sessions etc.)
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: odoo-filestore
  namespace: odoo
  labels:
    app.kubernetes.io/name: odoo
    app.kubernetes.io/managed-by: argocd
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 10Gi
