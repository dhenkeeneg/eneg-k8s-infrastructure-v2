---
# Garage StatefulSet
# 3 Replicas mit je Meta- und Data-PVC
# Init-Container ersetzt Platzhalter in garage.toml mit Secret-Werten
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: garage
  namespace: garage
  labels:
    app.kubernetes.io/name: garage
    app.kubernetes.io/version: "2.2.0"
    app.kubernetes.io/part-of: infrastructure
    app.kubernetes.io/managed-by: argocd
spec:
  serviceName: garage-headless
  replicas: 3
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app.kubernetes.io/name: garage
  template:
    metadata:
      labels:
        app.kubernetes.io/name: garage
    spec:
      securityContext:
        fsGroup: 1000
      terminationGracePeriodSeconds: 30
      # Init-Container: Ersetzt Platzhalter in garage.toml
      initContainers:
        - name: init-config
          image: busybox:1.37
          command: ['sh', '-c']
          args:
            - |
              cp /etc/garage-template/garage.toml /etc/garage/garage.toml
              sed -i "s|__RPC_SECRET__|$(cat /etc/garage-secrets/rpc-secret)|g" /etc/garage/garage.toml
              sed -i "s|__ADMIN_TOKEN__|$(cat /etc/garage-secrets/admin-token)|g" /etc/garage/garage.toml
              sed -i "s|__METRICS_TOKEN__|$(cat /etc/garage-secrets/metrics-token)|g" /etc/garage/garage.toml
              sed -i "s|__HOSTNAME__|${POD_NAME}|g" /etc/garage/garage.toml
              echo "Config generated for ${POD_NAME}"
              cat /etc/garage/garage.toml | grep -v secret | grep -v token
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          volumeMounts:
            - name: garage-config-template
              mountPath: /etc/garage-template
              readOnly: true
            - name: garage-config
              mountPath: /etc/garage
            - name: garage-secrets-vol
              mountPath: /etc/garage-secrets
              readOnly: true
      # Garage Container
      containers:
        - name: garage
          image: dxflrs/garage:v2.2.0
          env:
            - name: GARAGE_CONFIG_FILE
              value: "/etc/garage/garage.toml"
          ports:
            - name: s3-api
              containerPort: 3900
              protocol: TCP
            - name: rpc
              containerPort: 3901
              protocol: TCP
            - name: admin
              containerPort: 3903
              protocol: TCP
          volumeMounts:
            - name: garage-config
              mountPath: /etc/garage
              readOnly: true
            - name: garage-meta
              mountPath: /var/lib/garage/meta
            - name: garage-data
              mountPath: /var/lib/garage/data
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health
              port: admin
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: admin
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
      # Volumes
      volumes:
        - name: garage-config-template
          configMap:
            name: garage-config
        - name: garage-config
          emptyDir: {}
        - name: garage-secrets-vol
          secret:
            secretName: garage-secrets

  # PVC Templates fuer StatefulSet
  volumeClaimTemplates:
    - metadata:
        name: garage-meta
        labels:
          app.kubernetes.io/name: garage
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: longhorn
        resources:
          requests:
            storage: 1Gi
    - metadata:
        name: garage-data
        labels:
          app.kubernetes.io/name: garage
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: longhorn
        resources:
          requests:
            storage: 20Gi
