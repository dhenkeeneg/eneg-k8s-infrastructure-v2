---
# Garage WebUI Deployment
# Community Web-Interface fuer Garage Administration
# Zugang ueber Traefik Ingress mit Basic Auth
apiVersion: apps/v1
kind: Deployment
metadata:
  name: garage-webui
  namespace: garage
  labels:
    app.kubernetes.io/name: garage-webui
    app.kubernetes.io/version: "1.1.0"
    app.kubernetes.io/part-of: infrastructure
    app.kubernetes.io/managed-by: argocd
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: garage-webui
  template:
    metadata:
      labels:
        app.kubernetes.io/name: garage-webui
    spec:
      containers:
        - name: webui
          image: khairul169/garage-webui:1.1.0
          ports:
            - name: http
              containerPort: 3909
              protocol: TCP
          env:
            - name: API_BASE_URL
              value: "http://garage-admin.garage.svc.cluster.local:3903"
            - name: S3_ENDPOINT_URL
              value: "http://garage-s3.garage.svc.cluster.local:3900"
            - name: S3_REGION
              value: "eu-central-1"
            - name: API_ADMIN_KEY
              valueFrom:
                secretKeyRef:
                  name: garage-secrets
                  key: admin-token
            - name: AUTH_USER_PASS
              valueFrom:
                secretKeyRef:
                  name: garage-secrets
                  key: webui-auth
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
---
# Service fuer Garage WebUI
apiVersion: v1
kind: Service
metadata:
  name: garage-webui
  namespace: garage
  labels:
    app.kubernetes.io/name: garage-webui
    app.kubernetes.io/managed-by: argocd
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: garage-webui
  ports:
    - name: http
      port: 3909
      targetPort: http
      protocol: TCP
