---
# MetalLB IP Address Pool für DEV-Umgebung
# Dedizierte IP für Traefik + Pool für weitere Services
apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: dev-pool
  namespace: metallb-system
spec:
  addresses:
    # Dedizierte Traefik IP
    - 192.168.180.100/32
    # Allgemeiner Pool für weitere LoadBalancer Services
    - 192.168.180.151-192.168.180.199
