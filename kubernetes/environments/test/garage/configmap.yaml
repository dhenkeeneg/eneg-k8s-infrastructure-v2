---
# Garage Konfiguration (garage.toml) — TEST
# Platzhalter werden durch den Init-Container ersetzt
# Bootstrap-Peers mit TEST-spezifischen Node-IDs
apiVersion: v1
kind: ConfigMap
metadata:
  name: garage-config
  namespace: garage
  labels:
    app.kubernetes.io/name: garage
    app.kubernetes.io/part-of: infrastructure
    app.kubernetes.io/managed-by: argocd
data:
  garage.toml: |
    metadata_dir = "/var/lib/garage/meta"
    data_dir = "/var/lib/garage/data"

    db_engine = "lmdb"
    metadata_auto_snapshot_interval = "6h"

    replication_factor = 2
    compression_level = 1

    rpc_bind_addr = "[::]:3901"
    rpc_public_addr = "__POD_IP__:3901"
    rpc_secret = "__RPC_SECRET__"

    bootstrap_peers = [
      "fc1ebc11fa2d81c476fb40c965c8501cd201b1fd24999f638ab723c8c156928a@garage-0.garage-headless.garage.svc.cluster.local:3901",
      "479cedd151418e025e88c90a7d51c35d202d326c449531142a7f5656a719044f@garage-1.garage-headless.garage.svc.cluster.local:3901",
      "3217ac97a6825c635cbb031902f816e23b79a81fdb1e8560facf0dc20f5fefe6@garage-2.garage-headless.garage.svc.cluster.local:3901",
    ]

    [s3_api]
    s3_region = "eu-central-1"
    api_bind_addr = "[::]:3900"

    [admin]
    api_bind_addr = "[::]:3903"
    admin_token = "__ADMIN_TOKEN__"
    metrics_token = "__METRICS_TOKEN__"
