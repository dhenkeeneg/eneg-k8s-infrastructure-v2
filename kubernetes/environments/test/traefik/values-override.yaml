# Traefik Helm Chart Values - TEST-Umgebung Override
# Ergaenzt kubernetes/base/traefik/values.yaml mit TEST-spezifischen Werten

# --- Service (MetalLB) - TEST-spezifisch ---
service:
  spec:
    loadBalancerIP: "192.168.179.100"
  annotations:
    metallb.universe.tf/address-pool: test-pool

# --- Traefik Dashboard - TEST-spezifisch ---
ingressRoute:
  dashboard:
    enabled: true
    matchRule: Host(`traefik-test.eneg.de`)
    entryPoints:
      - websecure
    tls:
      secretName: traefik-dashboard-tls
