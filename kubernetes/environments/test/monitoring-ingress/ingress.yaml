---
# TLS Zertifikat fuer Grafana Dashboard - TEST-Umgebung
# Liegt im traefik Namespace (Standard-Pattern fuer alle Apps)
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: grafana-dashboard-tls
  namespace: traefik
spec:
  secretName: grafana-dashboard-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
    - grafana-test.eneg.de
---
# IngressRoute fuer Grafana Dashboard - TEST-Umgebung
# Pattern: IngressRoute + Certificate im traefik Namespace,
# Service-Referenz cross-namespace zum Backend (monitoring)
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: grafana-dashboard
  namespace: traefik
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`grafana-test.eneg.de`)
      kind: Rule
      services:
        - name: kube-prometheus-stack-grafana
          namespace: monitoring
          port: 80
  tls:
    secretName: grafana-dashboard-tls
