---
# ArgoCD Application: i-doit Backup Secrets (TEST, via KSOPS)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: idoit-backup-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "7"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    repoURL: git@github.com:dhenkeeneg/eneg-k8s-infrastructure-v2.git
    targetRevision: main
    path: kubernetes/environments/test/apps/idoit/backup/secrets

  destination:
    server: https://kubernetes.default.svc
    namespace: idoit

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
