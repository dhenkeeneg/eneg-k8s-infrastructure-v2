---
# ArgoCD Application: MariaDB Secrets (TEST)
# Root-Passwort + S3-Credentials fuer TEST-Umgebung (via KSOPS)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mariadb-secrets
  namespace: argocd
  annotations:
    # Secrets vor den Clustern deployen
    argocd.argoproj.io/sync-wave: "4"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    repoURL: git@github.com:dhenkeeneg/eneg-k8s-infrastructure-v2.git
    targetRevision: main
    path: kubernetes/environments/test/mariadb-secrets
    directory:
      recurse: false

  destination:
    server: https://kubernetes.default.svc
    namespace: databases

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
