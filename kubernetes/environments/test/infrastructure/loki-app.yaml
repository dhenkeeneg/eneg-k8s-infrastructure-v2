---
# ArgoCD Application: Loki (TEST)
# Multi-Source: Helm Chart v6.55.0 + Base Values + TEST Override
# Monolithic Mode mit S3-Backend auf NAS10
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loki
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  sources:
    # Source 1: Helm Chart
    - repoURL: https://grafana.github.io/helm-charts
      chart: loki
      targetRevision: 6.55.0
      helm:
        releaseName: loki
        valueFiles:
          - $values/kubernetes/base/monitoring/loki/values.yaml
          - $values/kubernetes/environments/test/monitoring-loki/values-override.yaml

    # Source 2: Git Repository Referenz fuer Values
    - repoURL: git@github.com:dhenkeeneg/eneg-k8s-infrastructure-v2.git
      targetRevision: main
      ref: values

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
