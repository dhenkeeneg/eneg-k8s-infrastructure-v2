---
# ArgoCD Application: CloudNativePG Databases (TEST)
# Deployed alle CNPG Database CRDs (n8n, keycloak, etc.)
# Generisch — nutzt base/ direkt
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cnpg-databases
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "6"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    repoURL: git@github.com:dhenkeeneg/eneg-k8s-infrastructure-v2.git
    targetRevision: main
    path: kubernetes/base/cloudnative-pg/databases
    directory:
      recurse: false

  destination:
    server: https://kubernetes.default.svc
    namespace: databases

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
