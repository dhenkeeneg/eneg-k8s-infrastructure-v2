---
# ArgoCD Application: kube-prometheus-stack (TEST)
# Multi-Source: Helm Chart v83.0.0 + Base Values + TEST Override
# Prometheus, Grafana, AlertManager, node-exporter, kube-state-metrics
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  sources:
    # Source 1: Helm Chart
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      targetRevision: 83.0.0
      helm:
        releaseName: kube-prometheus-stack
        valueFiles:
          - $values/kubernetes/base/monitoring/kube-prometheus-stack/values.yaml
          - $values/kubernetes/environments/test/monitoring/values-override.yaml

    # Source 2: Git Repository Referenz fuer Values
    - repoURL: git@github.com:dhenkeeneg/eneg-k8s-infrastructure-v2.git
      targetRevision: main
      ref: values

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
