# kube-prometheus-stack TEST Override
# Environment: TEST (VLAN 179)
# PVC-Groessen, AlertManager-Config (SMTP + Teams)

# --- CoreDNS-Monitoring deaktivieren (Phase 12) ---
# TEST betreibt CoreDNS via eigenem Helm-Chart (coredns/coredns) mit
# eigenem Service "coredns-metrics" und ServiceMonitor "coredns".
# Der vom kube-prometheus-stack mitgelieferte Service+SM ist hier
# nicht passend (Selector matcht unsere Pod-Labels nicht).
coreDns:
  enabled: false

# --- Default Rules: TEST-spezifische Anpassungen ---
# KubeJobFailed Default deaktiviert, Custom-Version excludiert Velero
# Kopia-Maintain-Jobs (transient bei NAS10-Mikroausfaellen) und alarmiert
# nur bei persistenten Failures (>=3 fuer 2h) - siehe kube-job-failed-test.yaml
defaultRules:
  disabled:
    KubeJobFailed: true

# --- Prometheus TEST ---
prometheus:
  prometheusSpec:
    # Explizit 1 Replica: schuetzt vor Drift durch manuelles Scaling
    # (z.B. Reconciliation-Pause waehrend Migration). Chart-Default ist 1,
    # aber ohne expliziten Wert heilt ArgoCD ein manuell gesetztes 0 nicht.
    replicas: 1
    # TEST-Retention: 15d (Zeit, env-spezifisch belassen) / max. 14 GB (Groessendeckel).
    # retentionSize ergaenzt den fehlenden groessenbasierten Deckel (P3, Drift-Angleich
    # 15.07.2026): retention 15d allein kann die 20Gi-PVC volllaufen lassen. 14GB ~= 70%
    # der 20Gi-PVC, laesst ~6GB Puffer fuer WAL + chunks_head + Kompaktierungs-Spitzen.
    # Was zuerst greift (Zeit ODER Groesse), begrenzt. Thanos haelt die Langzeit-Historie
    # auf S3, lokal reicht kurze Vorhaltung. Hinweis: retentionSize schuetzt nur
    # persistierte Bloecke, NICHT das WAL - gegen WAL-Deadlock 21.06. wirken die
    # TSDB-Health-Alerts (prometheus-tsdb-health-test.yaml).
    retention: 15d
    retentionSize: 14GB
    # Memory-Limit 3Gi (Angleich an DEV, P3 15.07.2026): Normalverbrauch ~1,8GB, altes
    # 2Gi-Limit war knapp und riskant beim WAL-Replay nach Pod-Neustart. 3Gi/1Gi gibt
    # Puffer fuer Replay/Kompaktierung ohne OOMKill - alle drei Cluster nun einheitlich.
    resources:
      requests:
        cpu: 100m
        memory: 1Gi
      limits:
        memory: 3Gi
    storageSpec:
      volumeClaimTemplate:
        spec:
          resources:
            requests:
              storage: 20Gi

# --- AlertManager Config ---
alertmanager:
  # Explizit 1 Replica: analog zu Prometheus, schuetzt vor Scaling-Drift.
  alertmanagerSpec:
    replicas: 1
  config:
    global:
      resolve_timeout: 5m
      smtp_from: "alertmanager-test@eneg.de"
      smtp_smarthost: "smtpout1.eneg.customers.hosting.zone:587"
      smtp_auth_username: "smtpenge1"
      smtp_auth_password_file: "/etc/alertmanager/secrets/alertmanager-credentials/smtp-password"
      smtp_require_tls: true

    route:
      group_by: ['namespace', 'alertname']
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      receiver: 'email-and-teams'
      routes:
        # InfoInhibitor: Meta-Alert an null-Receiver (kein Alarm)
        - match:
            alertname: InfoInhibitor
          receiver: 'null'
        # Watchdog: Nur 1x taeglich um 07:00 MESZ (DeadMansSwitch)
        - match:
            alertname: Watchdog
          receiver: 'email-and-teams'
          repeat_interval: 24h
          active_time_intervals:
            - morning-report
        # Critical Alerts: kuerzeres Repeat-Intervall
        - match:
            severity: critical
          receiver: 'email-and-teams'
          repeat_interval: 1h

    # Zeitfenster: 07:00-07:10 Uhr deutscher Zeit
    time_intervals:
      - name: morning-report
        time_intervals:
          - times:
              - start_time: '07:00'
                end_time: '07:10'
            location: 'Europe/Berlin'

    receivers:
      - name: 'null'
      - name: 'email-and-teams'
        email_configs:
          - to: 'd.henke@eneg.de'
            send_resolved: true
        webhook_configs:
          - url: "http://prometheus-msteams.monitoring.svc.cluster.local:2000/alertmanager"
            send_resolved: true

    inhibit_rules:
      - source_matchers:
          - severity = critical
        target_matchers:
          - severity = warning
        equal: ['namespace', 'alertname']
      - source_matchers:
          - alertname = InfoInhibitor
        target_matchers:
          - severity = info
        equal: ['namespace']
