---
# CloudNativePG Cluster: cnpg-erp (TEST)
# PostgreSQL 17.9 HA-Cluster fuer schwergewichtige ERP-Apps
# Apps: Odoo, OpenProject
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: cnpg-erp
  namespace: databases
  labels:
    app.kubernetes.io/part-of: cloudnative-pg
    app.kubernetes.io/managed-by: argocd
spec:
  description: "ERP PostgreSQL Cluster fuer Odoo und OpenProject"
  imageName: ghcr.io/cloudnative-pg/postgresql:17.9-standard-bookworm
  instances: 3
  primaryUpdateStrategy: unsupervised

  # Superuser-Zugang fuer pg_dumpall Backups
  enableSuperuserAccess: true

  # Managed Roles (Passwort aus Secret, Login erlaubt)
  managed:
    roles:
      - name: openproject
        ensure: present
        login: true
        createdb: false
        connectionLimit: -1
        inherit: true
        passwordSecret:
          name: openproject-db-credentials
      - name: odoo
        ensure: present
        login: true
        createdb: false
        connectionLimit: -1
        inherit: true
        passwordSecret:
          name: odoo-db-credentials

  # PostgreSQL Konfiguration (TEST - identisch zu DEV)
  postgresql:
    parameters:
      shared_buffers: "512MB"
      effective_cache_size: "1536MB"
      work_mem: "8MB"
      maintenance_work_mem: "128MB"
      max_connections: "100"
      wal_buffers: "16MB"
      min_wal_size: "512MB"
      max_wal_size: "2GB"
      checkpoint_completion_target: "0.9"
      log_statement: "ddl"
      log_min_duration_statement: "1000"
      lc_messages: "C"
      # WAL-Deadlock-Schutz (P2.3, 14.07.2026): begrenzt WAL-Rueckhalt eines
      # (auch inaktiven) Replication-Slots. Deckel < WAL-Volume (8Gi), ~2Gi
      # Puffer. sighup-Reload, kein Restart. Siehe resilienz-haertung-wal-deadlock-dev.md
      max_slot_wal_keep_size: "6GB"
      # Timezone
      timezone: "Europe/Berlin"

  # Storage
  storage:
    size: 20Gi
    storageClass: longhorn-db

  # WAL Storage (separates Volume)
  # 5Gi -> 8Gi (P2.2, 14.07.2026): Angleich an DEV/PROD; Voraussetzung fuer
  # max_slot_wal_keep_size 6GB (Deckel < Volume, ~2Gi Puffer). Online-Resize.
  walStorage:
    size: 8Gi
    storageClass: longhorn-db

  # Resources (TEST - identisch zu DEV)
  resources:
    requests:
      memory: "1Gi"
      cpu: "500m"
    limits:
      memory: "2Gi"
      cpu: "2"

  # Backup via Barman Cloud Plugin (ersetzt in-tree barmanObjectStore)
  plugins:
    - enabled: true
      isWALArchiver: true
      name: barman-cloud.cloudnative-pg.io
      parameters:
        barmanObjectName: cnpg-erp-objectstore

  # Monitoring (vorbereitet fuer Phase 7)
  monitoring:
    enablePodMonitor: false
