---
# ScheduledBackup: cnpg-shared Full Backup (Barman Cloud Plugin)
# Taeglich um 02:00 UTC
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: cnpg-shared-full
  namespace: databases
  labels:
    app.kubernetes.io/part-of: cloudnative-pg
    app.kubernetes.io/managed-by: argocd
spec:
  cluster:
    name: cnpg-shared
  schedule: "30 2 * * *"
  backupOwnerReference: cluster
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
  immediate: true
---
# ScheduledBackup: cnpg-erp Full Backup (Barman Cloud Plugin)
# Taeglich um 02:15 UTC (versetzt zu shared)
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: cnpg-erp-full
  namespace: databases
  labels:
    app.kubernetes.io/part-of: cloudnative-pg
    app.kubernetes.io/managed-by: argocd
spec:
  cluster:
    name: cnpg-erp
  schedule: "35 2 * * *"
  backupOwnerReference: cluster
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
  immediate: true
