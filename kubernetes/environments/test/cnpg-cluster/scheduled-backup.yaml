---
# ScheduledBackup: cnpg-shared Full Backup (Barman Cloud Plugin)
# Taeglich um 02:30 UTC (TEST-Backup-Fenster 02:15-04:15 UTC)
# Hinweis: CNPG verwendet 6-Feld-Cron (Sekunde Minute Stunde Tag Monat Wochentag).
# 5-Feld-Cron wird als 6-Feld interpretiert und triggert dann jede Stunde.
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: cnpg-shared-full
  namespace: databases
  labels:
    app.kubernetes.io/part-of: cloudnative-pg
    app.kubernetes.io/managed-by: argocd
spec:
  cluster:
    name: cnpg-shared
  schedule: "0 30 2 * * *"
  backupOwnerReference: cluster
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
  immediate: true
  suspend: false
---
# ScheduledBackup: cnpg-erp Full Backup (Barman Cloud Plugin)
# Taeglich um 02:35 UTC (versetzt zu shared)
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: cnpg-erp-full
  namespace: databases
  labels:
    app.kubernetes.io/part-of: cloudnative-pg
    app.kubernetes.io/managed-by: argocd
spec:
  cluster:
    name: cnpg-erp
  schedule: "0 35 2 * * *"
  backupOwnerReference: cluster
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
  immediate: true
  suspend: false
