# Loki TEST Override
# Environment: TEST (VLAN 179)
# S3-Bucket-Name ueberschreiben (base enthaelt DEV-Bucket!)
# PVC-Groesse gleich wie DEV.

# S3 Bucket fuer TEST
# DEFENSIV (Phase 14a): base zeigt auf NAS20, TEST bleibt vorerst auf NAS10.
# endpoint+insecure ueberschreiben base zurueck; ca_file (base) bleibt inert,
# da insecure:true. Bucket-Name wie gehabt. Bei TEST-Migration entfernen.
loki:
  storage:
    bucketNames:
      chunks: k8s-test-loki
      ruler: k8s-test-loki
    s3:
      endpoint: http://nas10.eneg.de:8010
      insecure: true

# PVC-Groesse (gleich wie DEV) + Memory-Limit erhoeht
# Memory-Limit auf 2Gi angehoben, da 1Gi nach laengerer Offline-Phase
# zu OOM-Kills fuehrte (Backlog gepufferter Logs + WAL-Recovery + Compactor).
singleBinary:
  persistence:
    size: 10Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 2Gi
