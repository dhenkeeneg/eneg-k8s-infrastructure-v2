# Loki TEST Override
# Environment: TEST (VLAN 179)
# S3-Bucket-Name ueberschreiben (base enthaelt DEV-Bucket!)
# PVC-Groesse gleich wie DEV.

# S3 Bucket fuer TEST
# Phase 14a abgeschlossen: TEST auf NAS20/HTTPS migriert (analog DEV).
# endpoint + insecure kommen jetzt aus base (NAS20/HTTPS, ca_file gesetzt).
# Hier wird nur noch der TEST-Bucket-Name ueberschrieben.
loki:
  storage:
    bucketNames:
      chunks: k8s-test-loki
      ruler: k8s-test-loki
  # TEST-Retention: 120h (5 Tage), ueberschreibt base (2160h / 90 Tage) - analog DEV
  limits_config:
    retention_period: 120h

# PVC-Groesse (gleich wie DEV) + Memory-Limit erhoeht
# Memory-Limit auf 2Gi angehoben, da 1Gi nach laengerer Offline-Phase
# zu OOM-Kills fuehrte (Backlog gepufferter Logs + WAL-Recovery + Compactor).
singleBinary:
  persistence:
    size: 10Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 2Gi
  # CA-Bundle fuer NAS20 TLS (Secret eneg-s3-ca, NS monitoring).
  # Pfad /etc/ca/ca.crt deckt sich mit loki.storage.s3.http_config.ca_file (base).
  extraVolumes:
    - name: s3-ca
      secret:
        secretName: eneg-s3-ca
  extraVolumeMounts:
    - name: s3-ca
      mountPath: /etc/ca
      readOnly: true
