---
# ConfigMap: rclone Konfiguration fuer Odoo Filestore Backup (TEST)
# P4b NAS10->NAS20: endpoint https + CA-Bundle (RCLONE_CA_CERT), analog DEV.
apiVersion: v1
kind: ConfigMap
metadata:
  name: odoo-backup-config
  namespace: odoo
  labels:
    app.kubernetes.io/name: odoo-backup
    app.kubernetes.io/part-of: pilot-apps
    app.kubernetes.io/managed-by: argocd
data:
  rclone.conf: |
    [nas20]
    type = s3
    provider = Other
    env_auth = true
    endpoint = https://nas20.eneg.de:8010
    region = us-east-1
    force_path_style = true
    no_check_bucket = true

  backup.sh: |
    #!/bin/sh
    set -e

    echo "=== Odoo Filestore Backup gestartet: $(date -Iseconds) ==="

    # rclone ENV-Variablen fuer Destination (NAS20)
    export RCLONE_CONFIG_NAS20_ACCESS_KEY_ID="${NAS_ACCESS_KEY_ID}"
    export RCLONE_CONFIG_NAS20_SECRET_ACCESS_KEY="${NAS_SECRET_ACCESS_KEY}"

    BACKUP_DATE=$(date +%Y-%m-%d)

    echo "--- Sichere Odoo Filestore ---"
    rclone sync \
      "/filestore/" \
      "nas20:k8s-test-odoo-backup/filestore" \
      --backup-dir "nas20:k8s-test-odoo-backup/_backups/${BACKUP_DATE}/filestore" \
      --config /config/rclone.conf \
      --checksum \
      --fast-list \
      --transfers 4 \
      --checkers 8 \
      --stats 30s \
      --stats-one-line \
      --log-level INFO
    echo "--- Filestore gesichert ---"

    echo ""
    echo "--- Alte Backups aufraemen (>32 Tage) ---"
    CUTOFF_DATE=$(date -d "@$(($(date +%s) - 32*86400))" +%Y-%m-%d)

    if [ -n "$CUTOFF_DATE" ]; then
      rclone lsd "nas20:k8s-test-odoo-backup/_backups/" --config /config/rclone.conf 2>/dev/null | awk '{print $NF}' | while read DIR; do
        if [ "$DIR" \< "$CUTOFF_DATE" ] || [ "$DIR" = "$CUTOFF_DATE" ]; then
          echo "Loesche altes Backup: _backups/${DIR}"
          rclone purge "nas20:k8s-test-odoo-backup/_backups/${DIR}" \
            --config /config/rclone.conf
        fi
      done
    else
      echo "WARNUNG: Konnte Cutoff-Datum nicht berechnen, ueberspringe Cleanup"
    fi

    echo ""
    echo "=== Odoo Filestore Backup abgeschlossen: $(date -Iseconds) ==="
---
# CronJob: Odoo Filestore Backup auf NAS20 (TEST)
apiVersion: batch/v1
kind: CronJob
metadata:
  name: odoo-backup
  namespace: odoo
  labels:
    app.kubernetes.io/name: odoo-backup
    app.kubernetes.io/part-of: pilot-apps
    app.kubernetes.io/managed-by: argocd
spec:
  schedule: "0 4 * * *"
  timeZone: "Europe/Berlin"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  startingDeadlineSeconds: 3600
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 7200
      ttlSecondsAfterFinished: 3600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: odoo-backup
        spec:
          restartPolicy: OnFailure
          affinity:
            podAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - labelSelector:
                    matchLabels:
                      app.kubernetes.io/name: odoo
                  topologyKey: kubernetes.io/hostname
          containers:
            - name: rclone
              image: rclone/rclone:1.73.1
              command:
                - /bin/sh
                - /scripts/backup.sh
              env:
                - name: NAS_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: odoo-backup-credentials
                      key: NAS_ACCESS_KEY_ID
                - name: NAS_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: odoo-backup-credentials
                      key: NAS_SECRET_ACCESS_KEY
                # P4b NAS10->NAS20: sauberes TLS. QuObjects (8010) sendet nur das
                # Leaf-Zert -> Sectigo-Bundle (R36+R46) clientseitig via
                # RCLONE_CA_CERT (additiv zum System-Trust). Secret odoo-s3-ca
                # (NS odoo), Mount /etc/ca/ca.crt. Analog DEV.
                - name: RCLONE_CA_CERT
                  value: /etc/ca/ca.crt
              volumeMounts:
                - name: config
                  mountPath: /config/rclone.conf
                  subPath: rclone.conf
                  readOnly: true
                - name: scripts
                  mountPath: /scripts/backup.sh
                  subPath: backup.sh
                  readOnly: true
                - name: filestore
                  mountPath: /filestore
                  readOnly: true
                - name: s3-ca
                  mountPath: /etc/ca
                  readOnly: true
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  cpu: 500m
                  memory: 256Mi
          volumes:
            - name: config
              configMap:
                name: odoo-backup-config
                items:
                  - key: rclone.conf
                    path: rclone.conf
            - name: scripts
              configMap:
                name: odoo-backup-config
                defaultMode: 0755
                items:
                  - key: backup.sh
                    path: backup.sh
            - name: filestore
              persistentVolumeClaim:
                claimName: odoo-filestore
            - name: s3-ca
              secret:
                secretName: odoo-s3-ca
