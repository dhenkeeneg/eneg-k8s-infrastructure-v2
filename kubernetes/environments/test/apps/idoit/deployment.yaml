---
# i-doit Open 37 Deployment (TEST)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: idoit
  namespace: idoit
  labels:
    app.kubernetes.io/name: idoit
    app.kubernetes.io/version: "37"
    app.kubernetes.io/part-of: pilot-apps
    app.kubernetes.io/managed-by: argocd
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: idoit
  template:
    metadata:
      labels:
        app.kubernetes.io/name: idoit
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      securityContext:
        fsGroup: 33
      initContainers:
        - name: init-src
          image: ghcr.io/dhenkeeneg/idoit-open:37
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              if [ ! -f /mnt/data/src/config.inc.php ] && [ -z "$(ls -A /mnt/data/src/ 2>/dev/null)" ]; then
                echo "PVC src-Ordner ist leer, kopiere Dateien aus dem Image..."
                cp -a /var/www/html/i-doit/src/. /mnt/data/src/
                chown -R 33:33 /mnt/data/src/
                echo "Fertig."
              else
                echo "PVC src-Ordner hat bereits Inhalt, ueberspringe."
              fi
          volumeMounts:
            - name: idoit-data
              mountPath: /mnt/data/src
              subPath: src
      containers:
        - name: idoit
          image: ghcr.io/dhenkeeneg/idoit-open:37
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          env:
            - name: IDOIT_DB_HOST
              value: "mariadb-galera-primary.databases.svc.cluster.local"
            - name: IDOIT_DB_PORT
              value: "3306"
            - name: IDOIT_DB_USER
              value: "idoit"
            - name: IDOIT_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: idoit-secrets
                  key: db-password
            - name: IDOIT_SYSTEM_DB
              value: "idoit_system"
            - name: IDOIT_DATA_DB
              value: "idoit_data"
            - name: IDOIT_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: idoit-secrets
                  key: admin-password
            - name: TZ
              value: "Europe/Berlin"
          volumeMounts:
            - name: idoit-data
              mountPath: /var/www/html/i-doit/src
              subPath: src
            - name: idoit-data
              mountPath: /var/www/html/i-doit/upload
              subPath: upload
            - name: idoit-data
              mountPath: /var/www/html/i-doit/temp
              subPath: temp
            - name: idoit-data
              mountPath: /var/www/html/i-doit/log
              subPath: log
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          startupProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
      volumes:
        - name: idoit-data
          persistentVolumeClaim:
            claimName: idoit-data
