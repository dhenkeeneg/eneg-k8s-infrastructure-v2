---
# ConfigMap: rclone Konfiguration fuer i-doit Backup (TEST)
# Phase 2: Tarball-basiertes Backup (1 PUT/GET pro Verzeichnis statt N tausend)
# P4b NAS10->NAS20: endpoint https + CA-Bundle (RCLONE_CA_CERT), analog DEV.
apiVersion: v1
kind: ConfigMap
metadata:
  name: idoit-backup-config
  namespace: idoit
  labels:
    app.kubernetes.io/name: idoit-backup
    app.kubernetes.io/part-of: pilot-apps
    app.kubernetes.io/managed-by: argocd
data:
  rclone.conf: |
    [nas20]
    type = s3
    provider = Other
    env_auth = true
    endpoint = https://nas20.eneg.de:8010
    region = us-east-1
    force_path_style = true
    no_check_bucket = true
    list_chunk = 100
    disable_http2 = true

  backup.sh: |
    #!/bin/sh
    set -e

    echo "=== i-doit Backup gestartet: $(date -Iseconds) ==="

    # rclone ENV-Variablen fuer Destination (NAS20)
    export RCLONE_CONFIG_NAS20_ACCESS_KEY_ID="${NAS_ACCESS_KEY_ID}"
    export RCLONE_CONFIG_NAS20_SECRET_ACCESS_KEY="${NAS_SECRET_ACCESS_KEY}"

    BACKUP_DATE=$(date +%Y-%m-%d)
    DAY_OF_WEEK=$(date +%u)
    FORCE_SRC="${BACKUP_FORCE_SRC:-no}"
    echo "Wochentag: ${DAY_OF_WEEK} (1=Mo..7=So), BACKUP_FORCE_SRC=${FORCE_SRC}"

    WORK="/tmp/idoit-backup"
    mkdir -p "${WORK}"

    # Gemeinsame rclone-Parameter
    RCLONE_OPTS="--config /config/rclone.conf --retries 10 --retries-sleep 30s --low-level-retries 20 --s3-upload-concurrency 4 --contimeout 10s --stats 30s --stats-one-line --log-level INFO"

    # === Upload-Verzeichnis: taeglich, skip wenn leer ===
    echo
    echo "--- Upload-Verzeichnis ---"
    UPLOAD_FILES=$(find /data/upload -type f 2>/dev/null | wc -l)
    echo "Files in /data/upload: ${UPLOAD_FILES}"

    if [ "${UPLOAD_FILES}" -gt 0 ]; then
      TARBALL="${WORK}/upload-${BACKUP_DATE}.tar.gz"
      echo "Erstelle Tarball: ${TARBALL}"
      tar -czf "${TARBALL}" -C /data/upload .
      ls -lh "${TARBALL}"

      echo "Verifiziere Tarball-Integrity..."
      tar -tzf "${TARBALL}" >/dev/null

      echo "Upload nach nas20:k8s-test-idoit/upload/upload-${BACKUP_DATE}.tar.gz"
      rclone copyto "${TARBALL}" "nas20:k8s-test-idoit/upload/upload-${BACKUP_DATE}.tar.gz" \
        --timeout 300s ${RCLONE_OPTS}
      rm -f "${TARBALL}"
      echo "Upload-Tarball abgeschlossen"
    else
      echo "Upload-Verzeichnis leer - skip"
    fi

    # === src: woechentlich Sonntag oder bei FORCE_SRC=yes ===
    echo
    if [ "${DAY_OF_WEEK}" = "7" ] || [ "${FORCE_SRC}" = "yes" ]; then
      if [ "${FORCE_SRC}" = "yes" ]; then
        echo "--- src (Force-Override BACKUP_FORCE_SRC=yes) ---"
      else
        echo "--- src (Konfiguration, woechentlich Sonntag) ---"
      fi

      TARBALL="${WORK}/src-${BACKUP_DATE}.tar.gz"
      echo "Erstelle Tarball: ${TARBALL}"
      tar -czf "${TARBALL}" -C /data/src .
      ls -lh "${TARBALL}"

      echo "Verifiziere Tarball-Integrity..."
      tar -tzf "${TARBALL}" >/dev/null

      echo "Upload nach nas20:k8s-test-idoit/src/src-${BACKUP_DATE}.tar.gz"
      rclone copyto "${TARBALL}" "nas20:k8s-test-idoit/src/src-${BACKUP_DATE}.tar.gz" \
        --timeout 600s ${RCLONE_OPTS}
      rm -f "${TARBALL}"
      echo "src-Tarball abgeschlossen"
    else
      echo "--- src-Backup heute uebersprungen (Wochentag ${DAY_OF_WEEK}, laeuft nur So oder bei BACKUP_FORCE_SRC=yes) ---"
    fi

    # === Cleanup: alte Tarballs >7 Tage loeschen ===
    echo
    echo "--- Cleanup alte Tarballs (>7 Tage) ---"
    for PREFIX in upload src; do
      echo "Pruefe nas20:k8s-test-idoit/${PREFIX}/"
      rclone delete "nas20:k8s-test-idoit/${PREFIX}/" --min-age 7d ${RCLONE_OPTS} || \
        echo "WARNUNG: cleanup ${PREFIX} hatte Fehler (nicht fatal)"
    done

    echo
    echo "=== i-doit Backup abgeschlossen: $(date -Iseconds) ==="
---
# CronJob: i-doit Backup auf NAS20 (TEST)
# Phase 2: Tarball-basiertes Backup - 1 PUT/Verzeichnis statt N tausend
# Retention: 7 Tage via rclone delete --min-age 7d
apiVersion: batch/v1
kind: CronJob
metadata:
  name: idoit-backup
  namespace: idoit
  labels:
    app.kubernetes.io/name: idoit-backup
    app.kubernetes.io/part-of: pilot-apps
    app.kubernetes.io/managed-by: argocd
spec:
  schedule: "30 6 * * *"
  timeZone: "Europe/Berlin"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  startingDeadlineSeconds: 3600
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 1800
      ttlSecondsAfterFinished: 3600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: idoit-backup
        spec:
          restartPolicy: OnFailure
          affinity:
            podAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - labelSelector:
                    matchLabels:
                      app.kubernetes.io/name: idoit
                  topologyKey: kubernetes.io/hostname
          containers:
            - name: rclone
              image: rclone/rclone:1.73.1
              command:
                - /bin/sh
                - /scripts/backup.sh
              env:
                - name: NAS_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: idoit-backup-credentials
                      key: NAS_ACCESS_KEY_ID
                - name: NAS_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: idoit-backup-credentials
                      key: NAS_SECRET_ACCESS_KEY
                # P4b NAS10->NAS20: sauberes TLS. QuObjects (8010) sendet nur das
                # Leaf-Zert -> Sectigo-Bundle (R36+R46) clientseitig via
                # RCLONE_CA_CERT (additiv zum System-Trust). Secret idoit-s3-ca
                # (NS idoit), Mount /etc/ca/ca.crt. Analog DEV.
                - name: RCLONE_CA_CERT
                  value: /etc/ca/ca.crt
                # src/ wird nur Sonntags gesichert. Fuer manuellen Force-Run:
                # CronJob temporaer patchen mit BACKUP_FORCE_SRC=yes,
                # einmal triggern (kubectl create job --from=cronjob/idoit-backup),
                # danach wieder auf "no" setzen.
                - name: BACKUP_FORCE_SRC
                  value: "no"
              volumeMounts:
                - name: config
                  mountPath: /config/rclone.conf
                  subPath: rclone.conf
                  readOnly: true
                - name: scripts
                  mountPath: /scripts/backup.sh
                  subPath: backup.sh
                  readOnly: true
                - name: idoit-data
                  mountPath: /data/upload
                  subPath: upload
                  readOnly: true
                - name: idoit-data
                  mountPath: /data/src
                  subPath: src
                  readOnly: true
                - name: work
                  mountPath: /tmp/idoit-backup
                - name: s3-ca
                  mountPath: /etc/ca
                  readOnly: true
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  cpu: 500m
                  memory: 256Mi
          volumes:
            - name: config
              configMap:
                name: idoit-backup-config
                items:
                  - key: rclone.conf
                    path: rclone.conf
            - name: scripts
              configMap:
                name: idoit-backup-config
                defaultMode: 0755
                items:
                  - key: backup.sh
                    path: backup.sh
            - name: idoit-data
              persistentVolumeClaim:
                claimName: idoit-data
                readOnly: true
            - name: work
              emptyDir:
                sizeLimit: 500Mi
            - name: s3-ca
              secret:
                secretName: idoit-s3-ca
