---
# TLS Zertifikat fuer OpenProject (TEST)
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: openproject-tls
  namespace: traefik
spec:
  secretName: openproject-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
    - openproject-test.eneg.de
---
# IngressRoute fuer OpenProject (TEST)
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: openproject
  namespace: traefik
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`openproject-test.eneg.de`) && PathPrefix(`/hocuspocus`)
      kind: Rule
      services:
        - name: openproject-hocuspocus
          namespace: openproject
          port: 1234
    - match: Host(`openproject-test.eneg.de`)
      kind: Rule
      services:
        - name: openproject-web
          namespace: openproject
          port: 8080
  tls:
    secretName: openproject-tls
