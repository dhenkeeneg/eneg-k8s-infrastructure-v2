---
# TLS Zertifikat fuer Zot Container Registry (DEV)
# Pattern: Certificate + IngressRoute im traefik Namespace,
# Service-Referenz cross-namespace zum Backend (registry)
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: registry-tls
  namespace: traefik
spec:
  secretName: registry-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
    - registry-dev.eneg.de
---
# IngressRoute fuer Zot Container Registry (DEV)
# Eigene Middleware fuer groesseren Body-Size (OCI Manifests + Layer-Uploads)
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: registry-headers
  namespace: traefik
spec:
  headers:
    customResponseHeaders:
      Docker-Distribution-API-Version: "registry/2.0"
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: registry
  namespace: traefik
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`registry-dev.eneg.de`)
      kind: Rule
      services:
        - name: registry-zot
          namespace: registry
          port: 5000
      middlewares:
        - name: registry-headers
          namespace: traefik
  tls:
    secretName: registry-tls
