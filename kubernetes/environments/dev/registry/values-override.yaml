# Zot Registry DEV Override Values
# Environment: DEV (VLAN 180)
# Phase 9a - Etappe A
#
# Setzt: S3-Bucket, DNS-Host, Proxy-Cache-Upstreams, accessControl,
#        GHCR-Sync-Extension, Extensions (search, ui, sync, metrics).

# --- HA-Konfiguration ---
# Phase 12: 3 Replicas mit Anti-Affinity + topologySpreadConstraints,
# damit der Mirror waehrend Node-Drains immer erreichbar bleibt.
# Backend ist S3 (NAS10), daher Multi-Replica unproblematisch.
#
# 2026-08-04: search/CVE-Extension war die Ursache des Busy-Loops (jede Replica
# lief am 1-Core-Limit). Nach Deaktivierung (Phase 2, search+ui=false) nur noch ~3m/Pod.
# Daher 2 Replicas fuer HA bei vernachlaessigbarer CPU-Last (S3-Backend, kein Quorum
# noetig). 3. Replica als unnoetig entfallen.
replicaCount: 2

affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: zot
              app.kubernetes.io/instance: registry
          topologyKey: kubernetes.io/hostname

topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: ScheduleAnyway
    labelSelector:
      matchLabels:
        app.kubernetes.io/name: zot
        app.kubernetes.io/instance: registry

# --- S3-Credentials als ENV via env (Chart-Value fuer Container-Umgebungsvariablen) ---
# AWS SDK liest AWS_ACCESS_KEY_ID und AWS_SECRET_ACCESS_KEY automatisch aus ENV.
env:
  - name: AWS_ACCESS_KEY_ID
    valueFrom:
      secretKeyRef:
        name: registry-s3-credentials
        key: accesskey
  - name: AWS_SECRET_ACCESS_KEY
    valueFrom:
      secretKeyRef:
        name: registry-s3-credentials
        key: secretkey
  # CA-Trust fuer NAS20 (Sectigo Leaf-only) UND Sync-Upstreams (docker.io etc.).
  # Zot S3-Driver (Go) hat kein ca_file-Feld -> kombiniertes Bundle via SSL_CERT_FILE.
  # ACHTUNG: SSL_CERT_FILE ERSETZT den System-Trust-Store (Go-Verhalten), daher
  # MUSS das Bundle System-CAs + Sectigo R36/R46 enthalten (ConfigMap registry-ca-bundle,
  # 152 Zerts, beide Verify-Pfade gegen NAS20 + ghcr.io getestet rc=0).
  - name: SSL_CERT_FILE
    value: /etc/ssl-ca/ca-certificates.crt

# --- CA-Bundle-Mount (ConfigMap registry-ca-bundle, via Kustomization deployt) ---
# Kombiniertes Bundle (System-CAs + Sectigo R36/R46) nach /etc/ssl-ca,
# referenziert von SSL_CERT_FILE oben.
extraVolumes:
  - name: ca-bundle
    configMap:
      name: registry-ca-bundle
extraVolumeMounts:
  - name: ca-bundle
    mountPath: /etc/ssl-ca
    readOnly: true

# --- Config-Injection ---
mountConfig: true
configFiles:
  config.json: |-
    {
      "distSpecVersion": "1.1.1",
      "storage": {
        "rootDirectory": "/var/lib/registry",
        "dedupe": false,
        "gc": true,
        "gcDelay": "1h",
        "gcInterval": "24h",
        "storageDriver": {
          "name": "s3",
          "rootdirectory": "/zot",
          "region": "us-east-1",
          "regionendpoint": "nas20.eneg.de:8010",
          "bucket": "k8s-dev-registry",
          "secure": true,
          "skipverify": false,
          "forcepathstyle": true
        }
      },
      "http": {
        "address": "0.0.0.0",
        "port": "5000",
        "realm": "zot",
        "compat": ["docker2s2"],
        "auth": {
          "htpasswd": {
            "path": "/secret/htpasswd"
          }
        },
        "accessControl": {
          "repositories": {
            "**": {
              "policies": [
                {
                  "users": ["eneg"],
                  "actions": ["read", "create", "update", "delete"]
                }
              ],
              "defaultPolicy": ["read"],
              "anonymousPolicy": ["read"]
            }
          }
        }
      },
      "log": {
        "level": "info",
        "output": "/dev/stdout"
      },
      "extensions": {
        "metrics": {
          "enable": true,
          "prometheus": {
            "path": "/metrics"
          }
        },
        "search": {
          "enable": false
        },
        "ui": {
          "enable": false
        },
        "sync": {
          "enable": true,
          "credentialsFile": "/ghcr-credentials/credentials.json",
          "downloadDir": "/var/lib/registry/sync-tmp",
          "registries": [
            {
              "urls": ["https://registry-1.docker.io"],
              "onDemand": true,
              "tlsVerify": true,
              "maxRetries": 3,
              "retryDelay": "5m",
              "preserveDigest": true,
              "content": [
                { "prefix": "**" }
              ]
            },
            {
              "urls": ["https://quay.io"],
              "onDemand": true,
              "tlsVerify": true,
              "maxRetries": 3,
              "retryDelay": "5m",
              "preserveDigest": true,
              "content": [
                { "prefix": "**" }
              ]
            },
            {
              "urls": ["https://ghcr.io"],
              "onDemand": true,
              "tlsVerify": true,
              "maxRetries": 3,
              "retryDelay": "5m",
              "preserveDigest": true,
              "content": [
                { "prefix": "**" }
              ]
            },
            {
              "urls": ["https://registry.k8s.io"],
              "onDemand": true,
              "tlsVerify": true,
              "maxRetries": 3,
              "retryDelay": "5m",
              "preserveDigest": true,
              "content": [
                { "prefix": "**" }
              ]
            },
            {
              "urls": ["https://ghcr.io"],
              "pollInterval": "15m",
              "onDemand": false,
              "tlsVerify": true,
              "maxRetries": 3,
              "retryDelay": "5m",
              "preserveDigest": true,
              "content": [
                {
                  "prefix": "dhenkeeneg/**",
                  "destination": "/eneg",
                  "stripPrefix": true
                }
              ]
            }
          ]
        }
      }
    }
