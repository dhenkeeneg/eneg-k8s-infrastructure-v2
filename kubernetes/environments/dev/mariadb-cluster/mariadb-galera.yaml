---
# MariaDB Galera Cluster (DEV)
# MariaDB 11.8.6 LTS mit 3 Nodes (Multi-Master)
# Apps: i-doit
apiVersion: k8s.mariadb.com/v1alpha1
kind: MariaDB
metadata:
  name: mariadb-galera
  namespace: databases
  labels:
    app.kubernetes.io/part-of: mariadb-galera
    app.kubernetes.io/managed-by: argocd
spec:
  image: mariadb:11.8.6
  replicas: 3
  galera:
    enabled: true
    primary:
      podIndex: 0
      autoFailover: true
    sst: mariabackup
    replicaThreads: 1
    agent:
      gracefulShutdownTimeout: 5s
    recovery:
      enabled: true
      clusterHealthyTimeout: 3m
      clusterBootstrapTimeout: 10m

  rootPasswordSecretKeyRef:
    name: mariadb-credentials
    key: ROOT_PASSWORD
    generate: false

  storage:
    size: 20Gi
    storageClassName: longhorn-db

  # ============================================================
  # TEMPORAER: Recovery aus PhysicalBackup vom 2026-05-09 04:30 UTC
  # Anlass: Storage-I/O-Stoerung am 2026-05-10 14:59 fuehrte zu Galera Split-Brain
  # Doku:   docs/incidents/2026-05-11-mariadb-galera-recovery.md
  # WICHTIG: Nach erfolgreichem Restore + Verifikation diese Sektion entfernen,
  #          sonst initiiert der Operator den Restore bei jedem Reconcile erneut.
  # ============================================================
  bootstrapFrom:
    backupContentType: Physical
    s3:
      endpoint: "nas10.eneg.de:8010"
      bucket: k8s-dev-mariadb-backup
      prefix: mariadb-galera/
      accessKeyIdSecretKeyRef:
        name: mariadb-credentials
        key: S3_ACCESS_KEY_ID
      secretAccessKeySecretKeyRef:
        name: mariadb-credentials
        key: S3_SECRET_ACCESS_KEY
      tls:
        enabled: false
    targetRecoveryTime: "2026-05-09T05:00:00Z"
    restoreJob:
      backoffLimit: 3

  resources:
    requests:
      memory: "1Gi"
      cpu: "250m"
    limits:
      memory: "2Gi"
      cpu: "1000m"

  myCnf: |
    [mariadb]
    bind-address=*
    default_storage_engine=InnoDB
    binlog_format=ROW
    innodb_autoinc_lock_mode=2
    innodb_buffer_pool_size=1024M
    innodb_log_file_size=256M
    innodb_flush_log_at_trx_commit=2
    max_allowed_packet=64M
    max_connections=200
    character_set_server=utf8mb4
    collation_server=utf8mb4_unicode_ci
    sql_mode=
    log_warnings=2
    slow_query_log=ON
    long_query_time=2
    default_time_zone=Europe/Berlin

  updateStrategy:
    type: ReplicasFirstPrimaryLast

  metrics:
    enabled: false
