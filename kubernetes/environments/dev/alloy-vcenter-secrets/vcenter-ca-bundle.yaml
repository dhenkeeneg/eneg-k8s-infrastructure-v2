---
# CA-Bundle: VMCA Root-CAs von vcenter-a und vcenter-b fuer OTel vCenter-Receiver TLS-Verifikation
# OEFFENTLICHE CA-Zertifikate - kein Geheimnis, daher KEIN SOPS.
# Grund: Beide vCenter liefern nur das Leaf-Zert (VMCA self-signed), nicht die Root.
#        Go/OTel benoetigt die Root clientseitig zur Ketten-Validierung -> ca_file.
# Inhalt (2 Root-CAs, self-signed):
#   [1] CN=CA,        DC=vsphere,DC=local, O=vcenter-a.eneg.de  (gueltig bis 12.12.2035)
#   [2] CN=vcenter-b, DC=vsphere,DC=local, O=vcenter-b.eneg.de  (gueltig bis 14.04.2036)
# Quelle: https://vcenter-{a,b}.eneg.de/afd/vecs/ca (anonymer CA-Download, DER->PEM)
# Verifiziert: Leaf-Issuer == Root-Subject fuer beide vCenter, 03.07.2026
# Renewal-Monitoring: Root-Ablauf 2035/2036 (unkritisch); Leafs 2027/2028
apiVersion: v1
kind: Secret
metadata:
  name: vcenter-ca-bundle
  namespace: monitoring
  labels:
    app.kubernetes.io/part-of: monitoring
    app.kubernetes.io/managed-by: argocd
type: Opaque
data:
  ca.crt: 
