# Loki DEV Override
# Environment: DEV (VLAN 180)
# Minimales Override - base values sind bereits DEV-dimensioniert.

# PVC-Groesse (gleich wie base, explizit fuer Konsistenz) + Memory-Limit erhoeht
# Memory-Limit auf 2Gi angehoben, da 1Gi nach laengerer Offline-Phase
# zu OOM-Kills fuehren kann (Backlog gepufferter Logs + WAL-Recovery + Compactor).
singleBinary:
  # TEMP 2026-05-14: replicas=0 fuer Cluster-Recovery (Monitoring komplett aus).
  # Verhindert WAL-Recovery + Compactor beim Boot (sehr I/O-intensiv).
  # Reaktivierung: Zeile loeschen oder replicas=1 setzen.
  replicas: 0
  persistence:
    size: 10Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 2Gi

# --- Loki-Begleitkomponenten ausschalten (TEMP 2026-05-14) ---
# Wenn singleBinary down ist, sind diese Komponenten nutzlos und wuerden
# nur Crashloops oder Idle-Pods erzeugen. Reaktivierung gemeinsam mit
# singleBinary durch Loeschen dieser Blocks.
gateway:
  enabled: false
chunksCache:
  enabled: false
resultsCache:
  enabled: false
lokiCanary:
  enabled: false
