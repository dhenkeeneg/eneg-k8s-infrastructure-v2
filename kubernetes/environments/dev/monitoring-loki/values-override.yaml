# Loki DEV Override
# Environment: DEV (VLAN 180)
# Minimales Override - base values sind bereits DEV-dimensioniert.

# PVC-Groesse (gleich wie base, explizit fuer Konsistenz) + Memory-Limit erhoeht
# Memory-Limit auf 2Gi angehoben, da 1Gi nach laengerer Offline-Phase
# zu OOM-Kills fuehren kann (Backlog gepufferter Logs + WAL-Recovery + Compactor).
singleBinary:
  persistence:
    size: 10Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 2Gi
  # CA-Bundle fuer NAS20 TLS (Secret eneg-s3-ca, NS monitoring).
  # Nur in DEV gemountet - TEST/PROD bleiben auf NAS10/HTTP, brauchen es nicht.
  # Pfad /etc/ca/ca.crt deckt sich mit loki.storage.s3.http_config.ca_file (base).
  extraVolumes:
    - name: s3-ca
      secret:
        secretName: eneg-s3-ca
  extraVolumeMounts:
    - name: s3-ca
      mountPath: /etc/ca
      readOnly: true

# DEV-Retention: 120h (5 Tage), ueberschreibt base (2160h / 90 Tage)
loki:
  limits_config:
    retention_period: 120h
