---
# KSOPS Secret Generator fuer Zot Registry S3-Credentials
# Enthaelt: NAS10 S3 Access/Secret Key fuer Bucket k8s-dev-registry
apiVersion: viaduct.ai/v1
kind: ksops
metadata:
  name: registry-s3-secret-generator
  annotations:
    config.kubernetes.io/function: |
      exec:
        path: ksops
files:
  - ./s3-credentials.enc.yaml

---
# KSOPS Secret Generator fuer Zot Registry htpasswd (User 'eneg')
# Enthaelt: bcrypt-Hash fuer Push-Auth, Pull ist anonym (accessControl in values)
apiVersion: viaduct.ai/v1
kind: ksops
metadata:
  name: registry-htpasswd-secret-generator
  annotations:
    config.kubernetes.io/function: |
      exec:
        path: ksops
files:
  - ./htpasswd.enc.yaml
