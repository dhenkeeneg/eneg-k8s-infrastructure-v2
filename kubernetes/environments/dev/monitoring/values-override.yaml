# kube-prometheus-stack DEV Override
# Environment: DEV (VLAN 180)
# PVC-Groessen, AlertManager-Config (SMTP + Teams)

# --- CoreDNS-Monitoring deaktivieren (Phase 12) ---
# DEV betreibt CoreDNS via eigenem Helm-Chart (coredns/coredns) mit
# eigenem Service "coredns-metrics" und ServiceMonitor "coredns".
# Der vom kube-prometheus-stack mitgelieferte Service+SM ist hier
# nicht passend (Selector matcht unsere Pod-Labels nicht).
coreDns:
  enabled: false

# --- Default Rules: DEV-spezifische Anpassungen ---
# KubeCPUOvercommit Default deaktiviert, Custom-Version mit hoeherem Threshold
# in alert-rules (erlaubt 0.5 CPU Overcommit fuer DEV mit 3x4 vCPU Nodes)
# KubeJobFailed Default deaktiviert, Custom-Version excludiert Velero
# Kopia-Maintain-Jobs (transient bei NAS10-Mikroausfaellen) und alarmiert
# nur bei persistenten Failures (>=3 fuer 2h) - siehe kube-job-failed-dev.yaml
defaultRules:
  disabled:
    KubeCPUOvercommit: true
    KubeJobFailed: true

# --- etcd-Monitoring ---
# k3s exponiert etcd-Metriken bereits (Ansible k3s-config: etcd-expose-metrics: true)
# auf http://<node>:2381/metrics (HTTP, ohne TLS).
# Der Chart-Weg ueber kubeEtcd.endpoints scheitert hier: ArgoCD schliesst die
# Ressource /Endpoints per resource.exclusions aus (ExcludedResourceWarning),
# daher wird das manuelle Endpoints-Objekt nie angewandt und bleibt leer.
# Loesung: direkter Prometheus-Scrape via additionalScrapeConfigs (static_configs
# auf die Control-Plane-Node-IPs, siehe prometheusSpec unten) - unabhaengig von
# Endpoints-Objekten. kubeEtcd-Exporter daher deaktiviert.
kubeEtcd:
  enabled: false

# --- Prometheus DEV ---
prometheus:
  prometheusSpec:
    # Remote-Write-Receiver aktivieren: erlaubt Push von externen Alloy-Instanzen.
    # Genutzt von alloy-vcenter (OTel vcenter-Receiver -> prometheus.remote_write).
    # Endpoint: /api/v1/write auf Port 9090. Nur DEV (vCenter-Monitoring startet in DEV).
    enableRemoteWriteReceiver: true

    # etcd-Scrape (k3s eingebettetes etcd, Metriken auf <node>:2381/metrics, HTTP).
    # Direkter static_configs-Scrape statt kubeEtcd-Exporter, weil ArgoCD /Endpoints
    # ausschliesst (siehe kubeEtcd-Kommentar oben). Liefert etcd_disk_wal_fsync_*,
    # etcd_server_has_leader, etcd_network_* etc. job=kube-etcd passt zu den
    # etcd-Default-Alertregeln.
    additionalScrapeConfigs:
      - job_name: kube-etcd
        metrics_path: /metrics
        scheme: http
        static_configs:
          - targets:
              - 192.168.180.21:2381
              - 192.168.180.22:2381
              - 192.168.180.23:2381

    # DEV-Retention: 7 Tage / max. 12 GB (Sicherheitsmarge zu 25Gi PVC, bevor TSDB Schreibstopp)
    # PVC 2026-06-21 von 20Gi auf 25Gi erweitert (TSDB-WAL-Deadlock aufgeloest, siehe Runbook)
    retention: 7d
    retentionSize: 12GB
    # Memory-Limit 3Gi (Lehre aus TSDB-WAL-Deadlock 21.06.2026): Normalverbrauch
    # ~1,5GB, altes 2Gi-Limit war knapp und riskant beim WAL-Replay. 3Gi gibt
    # Puffer fuer Replay/Kompaktierung ohne OOMKill. (Replay-Recovery lief mit 4Gi.)
    resources:
      requests:
        cpu: 100m
        memory: 1Gi
      limits:
        memory: 3Gi
    storageSpec:
      volumeClaimTemplate:
        spec:
          resources:
            requests:
              storage: 25Gi

    # CA-Bundle fuer NAS20 TLS im Thanos-Sidecar (schreibt Bloecke nach S3).
    # Sidecar nutzt thanos-objstore-config (objstore.yml mit ca_file:/etc/ca/ca.crt).
    # volumes = Pod-Ebene, thanos.volumeMounts = nur Sidecar-Container.
    # Nur DEV (Secret eneg-s3-ca existiert nur hier) - TEST/PROD bleiben NAS10/insecure.
    volumes:
      - name: s3-ca
        secret:
          secretName: eneg-s3-ca
    thanos:
      volumeMounts:
        - name: s3-ca
          mountPath: /etc/ca
          readOnly: true

# --- AlertManager Config ---
alertmanager:
  config:
    global:
      resolve_timeout: 5m
      smtp_from: "alertmanager-dev@eneg.de"
      smtp_smarthost: "smtpout1.eneg.customers.hosting.zone:587"
      smtp_auth_username: "smtpenge1"
      smtp_auth_password_file: "/etc/alertmanager/secrets/alertmanager-credentials/smtp-password"
      smtp_require_tls: true

    route:
      group_by: ['namespace', 'alertname']
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      receiver: 'email-and-teams'
      routes:
        # InfoInhibitor: Meta-Alert an null-Receiver (kein Alarm)
        - match:
            alertname: InfoInhibitor
          receiver: 'null'
        # Watchdog: Nur 1x taeglich um 07:00 MESZ (DeadMansSwitch)
        - match:
            alertname: Watchdog
          receiver: 'email-and-teams'
          repeat_interval: 24h
          active_time_intervals:
            - morning-report
        # Critical Alerts: kuerzeres Repeat-Intervall
        - match:
            severity: critical
          receiver: 'email-and-teams'
          repeat_interval: 1h

    # Zeitfenster: 07:00-07:10 Uhr deutscher Zeit
    time_intervals:
      - name: morning-report
        time_intervals:
          - times:
              - start_time: '07:00'
                end_time: '07:10'
            location: 'Europe/Berlin'

    receivers:
      - name: 'null'
      - name: 'email-and-teams'
        email_configs:
          - to: 'd.henke@eneg.de'
            send_resolved: true
        webhook_configs:
          - url: "http://prometheus-msteams.monitoring.svc.cluster.local:2000/alertmanager"
            send_resolved: true

    inhibit_rules:
      - source_matchers:
          - severity = critical
        target_matchers:
          - severity = warning
        equal: ['namespace', 'alertname']
      - source_matchers:
          - alertname = InfoInhibitor
        target_matchers:
          - severity = info
        equal: ['namespace']
