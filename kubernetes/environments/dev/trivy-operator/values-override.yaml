# Trivy Operator DEV Override Values
# Environment: DEV (VLAN 180)

# -- DEV: Scan-Intervall (alle 24h statt Default 6h, DEV braucht weniger)
operator:
  scanJobsConcurrentLimit: 2
  # -- DEV: Memory-Limits angehoben (Default 500Mi -> OOMKilled bei groesseren Image-Scans)
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 1Gi

# -- DEV: ServiceMonitor Labels fuer Prometheus Discovery
serviceMonitor:
  enabled: true
  labels:
    release: kube-prometheus-stack
