# Trivy Operator DEV Override Values
# Environment: DEV (VLAN 180)

# -- DEV: Scan-Intervall (alle 24h statt Default 6h, DEV braucht weniger)
# Standard-Wert fuer regulaeren Betrieb.
operator:
  scanJobsConcurrentLimit: 2

# -- DEV: Memory-Limits angehoben (Base 256Mi/512Mi -> OOMKilled bei groesseren Image-Scans)
# Key auf Root-Ebene (nicht unter operator.) - matcht Base-Chart-Pfad
resources:
  requests:
    cpu: 100m
    memory: 512Mi
  limits:
    cpu: 500m
    memory: 1Gi

# -- DEV: ServiceMonitor Labels fuer Prometheus Discovery
serviceMonitor:
  enabled: true
  labels:
    release: kube-prometheus-stack

# -- Phase 9a Etappe A Nachbesserung (22.04.2026):
#    Trivy-Operator umgeht den containerd-Mirror und pullt Images direkt via
#    Docker Registry Remote-API. Fuer docker.io/*-Images triggert das
#    TOOMANYREQUESTS (anonymes DockerHub Rate-Limit 60/6h).
#
#    Fix: Trivy-seitiger Mirror-Redirect auf DEV-Zot via trivy.configFile.
#    Die Aqua-Chart-Doku (values.yaml Kommentar bei `configFile`) sagt woertlich:
#      "options available only in the config file (e.g. Mirror registries)"
#    Die Trivy-CLI liest Mirror-Redirects daher NICHT aus env vars, sondern
#    nur aus einer Trivy-eigenen YAML-Config-Datei.
#
#    `trivy.configFile` wird von der Chart als YAML-Object erwartet (nicht
#    Multi-Line-String mit `|` - das fuehrt zu Double-Wrap durch toYaml).
#    Die Chart rendert das Object in die ConfigMap `trivy-operator-trivy-config`
#    unter dem Key `trivy.configFile` und mountet die Datei als
#    `/etc/trivy/trivy-config.yaml` im Scan-Pod. Trivy startet mit `--config`.
#
#    Zot DEV ist als Mirror fuer index.docker.io konfiguriert:
#      - Zot matched bare Pfade wie `library/postgres:16-alpine` ueber seine
#        erste OnDemand-Sync-Registry `registry-1.docker.io` mit `prefix: "**"`
#      - Verifiziert 22.04.2026: velero/velero:v1.17.1 erfolgreich via Zot
#        gescannt, Zot-Logs zeigen OnDemand-Sync von docker.io
#
#    Nur DEV-lokal: TEST/PROD haben (noch) keinen Trivy-Operator.
trivy:
  configFile:
    registry:
      mirrors:
        index.docker.io:
          - registry-dev.eneg.de
