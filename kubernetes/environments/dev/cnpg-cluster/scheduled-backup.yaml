---
# ScheduledBackup: cnpg-shared Full Backup (Barman Cloud Plugin)
# Taeglich um 02:00 UTC
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: cnpg-shared-full
  namespace: databases
  labels:
    app.kubernetes.io/part-of: cloudnative-pg
    app.kubernetes.io/managed-by: argocd
spec:
  # TEMP 2026-05-14: suspend=true fuer Cluster-Recovery (siehe docs/incidents/2026-05-11-...)
  # Reaktivierung: Zeile loeschen oder suspend=false.
  suspend: true
  cluster:
    name: cnpg-shared
  schedule: "45 4 * * *"
  backupOwnerReference: cluster
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
  immediate: true
---
# ScheduledBackup: cnpg-erp Full Backup (Barman Cloud Plugin)
# Taeglich um 02:15 UTC (versetzt zu shared)
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: cnpg-erp-full
  namespace: databases
  labels:
    app.kubernetes.io/part-of: cloudnative-pg
    app.kubernetes.io/managed-by: argocd
spec:
  # TEMP 2026-05-14: suspend=true fuer Cluster-Recovery (siehe docs/incidents/2026-05-11-...)
  # Reaktivierung: Zeile loeschen oder suspend=false.
  suspend: true
  cluster:
    name: cnpg-erp
  schedule: "50 4 * * *"
  backupOwnerReference: cluster
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
  immediate: true
