---
# CloudNativePG Cluster: cnpg-erp (DEV)
# PostgreSQL 17.9 HA-Cluster fuer schwergewichtige ERP-Apps
# Apps: Odoo, OpenProject
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: cnpg-erp
  namespace: databases
  labels:
    app.kubernetes.io/part-of: cloudnative-pg
    app.kubernetes.io/managed-by: argocd
  # Reaktiviert 2026-05-15: NAS10 boto3 InvalidDigest-Fix (siehe
  # objectstore-erp.yaml instanceSidecarConfiguration) erlaubt jetzt
  # erfolgreiches WAL-Archiving. Cluster wieder voll aktiv.
spec:
  description: "ERP PostgreSQL Cluster fuer Odoo und OpenProject"
  imageName: ghcr.io/cloudnative-pg/postgresql:17.9-standard-bookworm
  instances: 3
  primaryUpdateStrategy: unsupervised

  # PriorityClass: schuetzt die DB-Pods im Node-Pressure-Fall vor Verdraengung
  # (2026-06-29 Resilienz-Haertung). Definition: kubernetes/base/priorityclasses/
  # eneg-stateful-critical.yaml (value 900000000, knapp unter longhorn-critical).
  priorityClassName: eneg-stateful-critical

  # Superuser-Zugang fuer pg_dumpall Backups
  enableSuperuserAccess: true

  # Managed Roles (Passwort aus Secret, Login erlaubt)
  managed:
    roles:
      - name: openproject
        ensure: present
        login: true
        createdb: false
        connectionLimit: -1
        inherit: true
        passwordSecret:
          name: openproject-db-credentials
      - name: odoo
        ensure: present
        login: true
        createdb: false
        connectionLimit: -1
        inherit: true
        passwordSecret:
          name: odoo-db-credentials

  # PostgreSQL Konfiguration (DEV - hoeher dimensioniert als shared)
  postgresql:
    parameters:
      # Memory (hoeher als shared fuer ERP-Workloads)
      shared_buffers: "512MB"
      effective_cache_size: "1536MB"
      work_mem: "8MB"
      maintenance_work_mem: "128MB"
      # Connections (weniger, aber intensivere Queries)
      max_connections: "100"
      # WAL
      wal_buffers: "16MB"
      min_wal_size: "512MB"
      max_wal_size: "2GB"
      # WAL-Slot-Deckel (2026-06-29 Resilienz-Haertung): begrenzt, wieviel WAL
      # ein (auch inaktiver) Replication-Slot zurueckhalten darf. Verhindert den
      # WAL-Deadlock an der Wurzel - das 8Gi-WAL-Volume kann nicht mehr durch
      # einen haengenden Slot volllaufen. 6GB lassen ~2Gi Puffer; normale HA-
      # Slots liegen weit darunter. Bei Ueberschreitung faellt die betroffene
      # Replica auf S3-Archive-Restore zurueck (Archiving laeuft durchgehend).
      # sighup-Parameter (Reload, kein Restart noetig).
      max_slot_wal_keep_size: "6GB"
      # Checkpoints
      checkpoint_completion_target: "0.9"
      # Logging
      log_statement: "ddl"
      log_min_duration_statement: "1000"
      # Locale
      lc_messages: "C"
      # Timezone
      timezone: "Europe/Berlin"

  # Storage
  storage:
    size: 20Gi
    storageClass: longhorn-db

  # WAL Storage (separates Volume)
  # 2026-06-29: 5Gi -> 8Gi. WAL-Stau bei Cluster-Stillstand (kein Primary ueber
  # 3+ Tage) liess das 5Gi-Volume volllaufen -> "Not enough disk space" ->
  # Deadlock (Postgres startet nicht -> kein Primary -> kein WAL-Recycling).
  # Mehr Puffer bricht den Deadlock; Verkleinern spaeter nur per Instanz-Recreate.
  walStorage:
    size: 8Gi
    storageClass: longhorn-db

  # Resources (DEV - hoeher als shared)
  resources:
    requests:
      memory: "1Gi"
      cpu: "500m"
    limits:
      memory: "2Gi"
      cpu: "2"

  # Backup via Barman Cloud Plugin (ersetzt in-tree barmanObjectStore)
  plugins:
    - enabled: true
      isWALArchiver: true
      name: barman-cloud.cloudnative-pg.io
      parameters:
        barmanObjectName: cnpg-erp-objectstore

  # Monitoring (Phase 7 - aktiviert)
  monitoring:
    enablePodMonitor: true
