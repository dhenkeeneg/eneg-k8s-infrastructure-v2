# Traefik Helm Chart Values - DEV-Umgebung Override
# Ergaenzt kubernetes/base/traefik/values.yaml mit DEV-spezifischen Werten

# --- Service (MetalLB) - DEV-spezifisch ---
service:
  spec:
    loadBalancerIP: "192.168.180.100"
  annotations:
    metallb.universe.tf/address-pool: dev-pool

# --- Traefik Dashboard - DEV-spezifisch ---
ingressRoute:
  dashboard:
    enabled: true
    matchRule: Host(`traefik-dev.eneg.de`)
    entryPoints:
      - websecure
    tls:
      secretName: traefik-dashboard-tls
