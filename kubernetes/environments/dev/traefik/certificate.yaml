---
# TLS Zertifikat für Traefik Dashboard - DEV-Umgebung
# Wird automatisch von cert-manager via Let's Encrypt ausgestellt
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: traefik-dashboard-tls
  namespace: traefik
spec:
  secretName: traefik-dashboard-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
    - traefik-dev.eneg.de
