---
# TLS Zertifikat fuer OpenProject (DEV)
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: openproject-tls
  namespace: traefik
spec:
  secretName: openproject-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  # 19.08.2026, Uebergangsstand fuer den Umzug aus k8s-dev-microk8s:
  # Beide Namen in einem Zertifikat (SAN), damit der Wechsel ohne
  # Erreichbarkeitsluecke laeuft. cert-manager nutzt DNS-01 ueber IONOS, das
  # Zertifikat entsteht also unabhaengig davon, wohin der A-/CNAME-Eintrag
  # gerade zeigt - es gibt keinen HTTP-Challenge-Konflikt mit der noch
  # eingetragenen nginx-Instanz.
  # openproject-dev-v2.eneg.de wird in Schritt 6.4 wieder entfernt.
  dnsNames:
    - openproject-dev-v2.eneg.de
    - openproject-dev.eneg.de
---
# IngressRoute fuer OpenProject (DEV)
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: openproject
  namespace: traefik
spec:
  entryPoints:
    - websecure
  routes:
    # 19.08.2026: beide Namen parallel, damit der Umzug ohne
    # Erreichbarkeitsluecke laeuft. openproject-dev.eneg.de wird erst wirksam,
    # wenn der DNS-CNAME von 192.168.180.50 (nginx, MicroK8s) auf
    # traefik-dev.eneg.de (192.168.180.100) umgestellt ist.
    # openproject-dev-v2.eneg.de wird in Schritt 6.4 wieder entfernt.
    #
    # ACHTUNG Traefik-v3-Syntax: Host() nimmt genau EINEN Parameter. Die aus
    # Traefik v2 bekannte Form Host(`a`, `b`) wird von v3 verworfen -
    # "unexpected number of parameters; got 2, expected one of [1]". Der Router
    # wird dann komplett fallen gelassen und Traefik antwortet mit 404, ohne
    # dass die IngressRoute selbst ungueltig aussieht. Mehrere Namen also
    # immer mit || verknuepfen und die Klammerung beachten, weil && staerker
    # bindet als ||.
    #
    # priority explizit gesetzt: ohne Angabe leitet Traefik sie aus der
    # Regellaenge ab. Das funktioniert hier zufaellig richtig, ist aber bei
    # zwei Regeln, die sich nur um den PathPrefix unterscheiden, unnoetig
    # fragil - /hocuspocus muss zuverlaessig vor der allgemeinen Regel greifen.
    - match: (Host(`openproject-dev-v2.eneg.de`) || Host(`openproject-dev.eneg.de`)) && PathPrefix(`/hocuspocus`)
      kind: Rule
      priority: 100
      services:
        - name: openproject-hocuspocus
          namespace: openproject
          port: 1234
    - match: Host(`openproject-dev-v2.eneg.de`) || Host(`openproject-dev.eneg.de`)
      kind: Rule
      priority: 10
      services:
        - name: openproject-web
          namespace: openproject
          port: 8080
  tls:
    secretName: openproject-tls
