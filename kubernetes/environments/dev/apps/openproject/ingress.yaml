---
# TLS Zertifikat fuer OpenProject (DEV)
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: openproject-tls
  namespace: traefik
spec:
  secretName: openproject-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  # 19.08.2026: Umzug aus k8s-dev-microk8s abgeschlossen. Waehrend des
  # Wechsels stand hier zusaetzlich openproject-dev-v2.eneg.de, damit es keine
  # Erreichbarkeitsluecke gab; der Name ist jetzt entfallen.
  # cert-manager arbeitet mit DNS-01 ueber IONOS, das Zertifikat entsteht also
  # unabhaengig davon, wohin der CNAME zeigt - es gab keinen
  # HTTP-Challenge-Konflikt mit der parallel laufenden nginx-Instanz.
  dnsNames:
    - openproject-dev.eneg.de
---
# IngressRoute fuer OpenProject (DEV)
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: openproject
  namespace: traefik
spec:
  entryPoints:
    - websecure
  routes:
    # 19.08.2026: Umzug abgeschlossen, nur noch openproject-dev.eneg.de.
    # Waehrend des Wechsels stand hier zusaetzlich openproject-dev-v2.eneg.de.
    #
    # ACHTUNG fuer den naechsten, der hier mehrere Namen eintraegt -
    # Traefik-v3-Syntax: Host() nimmt genau EINEN Parameter. Die aus Traefik v2
    # bekannte Form Host(`a`, `b`) wird von v3 verworfen mit
    # "unexpected number of parameters; got 2, expected one of [1]". Der Router
    # wird dann komplett fallen gelassen und Traefik antwortet mit 404, ohne
    # dass die IngressRoute ungueltig aussieht: der API-Server validiert den
    # Regelausdruck nicht, kubectl apply --dry-run=server meldet sie als
    # gueltig. Sichtbar ist der Fehler ausschliesslich im Traefik-Log.
    # Mehrere Namen also mit || verknuepfen und dabei klammern, weil &&
    # staerker bindet als ||:
    #   (Host(`a`) || Host(`b`)) && PathPrefix(`/pfad`)
    #
    # priority explizit gesetzt statt auf Traefiks Laengenheuristik zu
    # vertrauen - /hocuspocus muss zuverlaessig vor der allgemeinen Regel
    # greifen.
    - match: Host(`openproject-dev.eneg.de`) && PathPrefix(`/hocuspocus`)
      kind: Rule
      priority: 100
      services:
        - name: openproject-hocuspocus
          namespace: openproject
          port: 1234
    - match: Host(`openproject-dev.eneg.de`)
      kind: Rule
      priority: 10
      services:
        - name: openproject-web
          namespace: openproject
          port: 8080
  tls:
    secretName: openproject-tls
