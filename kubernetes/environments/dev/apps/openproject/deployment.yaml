---
# PersistentVolumeClaim fuer OpenProject tmp-Daten (DEV)
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: openproject-tmp
  namespace: openproject
  labels:
    app.kubernetes.io/name: openproject
    app.kubernetes.io/managed-by: argocd
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 5Gi
---
# Memcached Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openproject-memcached
  namespace: openproject
  labels:
    app.kubernetes.io/name: openproject-memcached
    app.kubernetes.io/part-of: openproject
    app.kubernetes.io/managed-by: argocd
spec:
  # Reaktiviert 2026-05-15: nach Cluster-Recovery wieder aktiv.
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: openproject-memcached
  template:
    metadata:
      labels:
        app.kubernetes.io/name: openproject-memcached
    spec:
      containers:
        - name: memcached
          image: memcached:1.6.40-alpine
          args:
            - --memory-limit=128
            - --conn-limit=1024
            - --threads=2
          ports:
            - name: memcached
              containerPort: 11211
              protocol: TCP
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 192Mi
          livenessProbe:
            tcpSocket:
              port: memcached
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            tcpSocket:
              port: memcached
            initialDelaySeconds: 5
            periodSeconds: 10
---
# Memcached Service
apiVersion: v1
kind: Service
metadata:
  name: openproject-memcached
  namespace: openproject
  labels:
    app.kubernetes.io/name: openproject-memcached
    app.kubernetes.io/part-of: openproject
    app.kubernetes.io/managed-by: argocd
spec:
  type: ClusterIP
  ports:
    - port: 11211
      targetPort: memcached
      protocol: TCP
      name: memcached
  selector:
    app.kubernetes.io/name: openproject-memcached
---
# Hocuspocus Deployment (Collaborative Editing)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openproject-hocuspocus
  namespace: openproject
  labels:
    app.kubernetes.io/name: openproject-hocuspocus
    app.kubernetes.io/part-of: openproject
    app.kubernetes.io/managed-by: argocd
spec:
  # Reaktiviert 2026-05-15: nach Cluster-Recovery wieder aktiv.
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: openproject-hocuspocus
  template:
    metadata:
      labels:
        app.kubernetes.io/name: openproject-hocuspocus
    spec:
      containers:
        - name: hocuspocus
          # Gepinnt auf die Core-Version (frueher: latest).
          # latest wird laufend neu gebaut -> ein Pod-Restart zog einen
          # unbekannten Build, ohne Rollback-Punkt und potenziell
          # inkompatibel zum Core. Ab 17.08.2026 immer identisch zum
          # openproject/openproject-Tag mitziehen.
          image: openproject/hocuspocus:17.4.1
          env:
            - name: SECRET
              valueFrom:
                secretKeyRef:
                  name: openproject-secrets
                  key: hocuspocus-secret
            - name: OPENPROJECT_URL
              value: "http://openproject-web.openproject.svc.cluster.local:8080"
            - name: OPENPROJECT_HTTPS
              value: "true"
          ports:
            - name: hocuspocus
              containerPort: 1234
              protocol: TCP
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            tcpSocket:
              port: hocuspocus
            initialDelaySeconds: 15
            periodSeconds: 15
          readinessProbe:
            tcpSocket:
              port: hocuspocus
            initialDelaySeconds: 10
            periodSeconds: 10
---
# Hocuspocus Service
apiVersion: v1
kind: Service
metadata:
  name: openproject-hocuspocus
  namespace: openproject
  labels:
    app.kubernetes.io/name: openproject-hocuspocus
    app.kubernetes.io/part-of: openproject
    app.kubernetes.io/managed-by: argocd
spec:
  type: ClusterIP
  ports:
    - port: 1234
      targetPort: hocuspocus
      protocol: TCP
      name: hocuspocus
  selector:
    app.kubernetes.io/name: openproject-hocuspocus
---
# OpenProject Web Deployment (DEV)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openproject-web
  namespace: openproject
  labels:
    app.kubernetes.io/name: openproject
    app.kubernetes.io/version: "17.4.1"
    app.kubernetes.io/part-of: pilot-apps
    app.kubernetes.io/managed-by: argocd
spec:
  # Reaktiviert 2026-05-15: nach Cluster-Recovery wieder aktiv.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: openproject
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: openproject
        app.kubernetes.io/component: web
    spec:
      securityContext:
        fsGroup: 1000
        runAsUser: 1000
        runAsGroup: 1000
      initContainers:
        - name: init-tmp
          image: busybox:1.37
          command:
            - sh
            - -c
            - mkdir -p /tmp/openproject && chown 1000:1000 /tmp/openproject
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      containers:
        - name: openproject
          image: openproject/openproject:17.4.1-slim
          command:
            - bash
            - /app/docker/prod/web
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: openproject-secrets
                  key: database-url
            - name: SECRET_KEY_BASE
              valueFrom:
                secretKeyRef:
                  name: openproject-secrets
                  key: secret-key-base
            - name: RAILS_CACHE_STORE
              value: "memcache"
            - name: OPENPROJECT_CACHE__MEMCACHE__SERVER
              value: "openproject-memcached.openproject.svc.cluster.local:11211"
            - name: RAILS_MIN_THREADS
              value: "4"
            - name: RAILS_MAX_THREADS
              value: "16"
            - name: OPENPROJECT_HOST__NAME
              value: "openproject-dev-v2.eneg.de"
            - name: OPENPROJECT_HTTPS
              value: "true"
            - name: OPENPROJECT_HSTS
              value: "true"
            - name: OPENPROJECT_COLLABORATIVE__EDITING__HOCUSPOCUS__URL
              value: "wss://openproject-dev-v2.eneg.de/hocuspocus"
            - name: OPENPROJECT_COLLABORATIVE__EDITING__HOCUSPOCUS__SECRET
              valueFrom:
                secretKeyRef:
                  name: openproject-secrets
                  key: hocuspocus-secret
            - name: OPENPROJECT_ADDITIONAL__HOST__NAMES
              value: "openproject-web.openproject.svc.cluster.local"
            - name: OPENPROJECT_ATTACHMENTS__STORAGE
              value: "fog"
            - name: OPENPROJECT_FOG_DIRECTORY
              value: "openproject-assets"
            - name: OPENPROJECT_FOG_CREDENTIALS_PROVIDER
              value: "aws"
            - name: OPENPROJECT_FOG_CREDENTIALS_ENDPOINT
              value: "http://garage-s3.garage.svc.cluster.local:3900"
            - name: OPENPROJECT_FOG_CREDENTIALS_AWS__ACCESS__KEY__ID
              valueFrom:
                secretKeyRef:
                  name: openproject-secrets
                  key: s3-access-key-id
            - name: OPENPROJECT_FOG_CREDENTIALS_AWS__SECRET__ACCESS__KEY
              valueFrom:
                secretKeyRef:
                  name: openproject-secrets
                  key: s3-secret-access-key
            - name: OPENPROJECT_FOG_CREDENTIALS_REGION
              value: "eu-central-1"
            - name: OPENPROJECT_FOG_CREDENTIALS_PATH__STYLE
              value: "true"
            - name: TMPDIR
              value: "/tmp/openproject"
            - name: OPENPROJECT_OPENID__CONNECT_KEYCLOAK_DISPLAY__NAME
              value: "Keycloak"
            - name: OPENPROJECT_OPENID__CONNECT_KEYCLOAK_HOST
              value: "keycloak-dev-v2.eneg.de"
            - name: OPENPROJECT_OPENID__CONNECT_KEYCLOAK_IDENTIFIER
              value: "openproject"
            - name: OPENPROJECT_OPENID__CONNECT_KEYCLOAK_SECRET
              valueFrom:
                secretKeyRef:
                  name: openproject-secrets
                  key: oidc-client-secret
            - name: OPENPROJECT_OPENID__CONNECT_KEYCLOAK_ISSUER
              value: "https://keycloak-dev-v2.eneg.de/realms/eNeG"
            - name: OPENPROJECT_OPENID__CONNECT_KEYCLOAK_AUTHORIZATION__ENDPOINT
              value: "https://keycloak-dev-v2.eneg.de/realms/eNeG/protocol/openid-connect/auth"
            - name: OPENPROJECT_OPENID__CONNECT_KEYCLOAK_TOKEN__ENDPOINT
              value: "https://keycloak-dev-v2.eneg.de/realms/eNeG/protocol/openid-connect/token"
            - name: OPENPROJECT_OPENID__CONNECT_KEYCLOAK_USERINFO__ENDPOINT
              value: "https://keycloak-dev-v2.eneg.de/realms/eNeG/protocol/openid-connect/userinfo"
            - name: OPENPROJECT_OPENID__CONNECT_KEYCLOAK_END__SESSION__ENDPOINT
              value: "https://keycloak-dev-v2.eneg.de/realms/eNeG/protocol/openid-connect/logout"
            - name: OPENPROJECT_OPENID__CONNECT_KEYCLOAK_JWKS__URI
              value: "https://keycloak-dev-v2.eneg.de/realms/eNeG/protocol/openid-connect/certs"
            - name: OPENPROJECT_OPENID__CONNECT_KEYCLOAK_SCOPE
              value: "[openid,profile,email]"
            - name: OPENPROJECT_OPENID__CONNECT_KEYCLOAK_ATTRIBUTE__MAP_LOGIN
              value: "preferred_username"
            - name: OPENPROJECT_OPENID__CONNECT_KEYCLOAK_ATTRIBUTE__MAP_EMAIL
              value: "email"
            - name: OPENPROJECT_OPENID__CONNECT_KEYCLOAK_ATTRIBUTE__MAP_FIRST__NAME
              value: "given_name"
            - name: OPENPROJECT_OPENID__CONNECT_KEYCLOAK_ATTRIBUTE__MAP_LAST__NAME
              value: "family_name"
            - name: OPENPROJECT_DEFAULT__LANGUAGE
              value: "de"
            - name: OPENPROJECT_SEED__LOCALE
              value: "de"
            - name: TZ
              value: "Europe/Berlin"
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 200m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 2Gi
          livenessProbe:
            httpGet:
              path: /health_checks/default
              port: http
            initialDelaySeconds: 120
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /health_checks/default
              port: http
            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 10
      volumes:
        - name: tmp
          persistentVolumeClaim:
            claimName: openproject-tmp
