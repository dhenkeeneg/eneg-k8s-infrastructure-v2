---
# OpenProject Seeder Job (DEV)
apiVersion: batch/v1
kind: Job
metadata:
  name: openproject-seeder
  namespace: openproject
  labels:
    app.kubernetes.io/name: openproject
    app.kubernetes.io/component: seeder
    app.kubernetes.io/managed-by: argocd
  annotations:
    # PreSync (nicht PostSync): Die DB-Migration muss VOR dem Rollout der neuen
    # web/worker-Pods laufen, sonst laeuft neuer Code gegen altes Schema.
    # Bei PostSync kann der neue web-Pod nicht ready werden -> Sync bleibt
    # Progressing -> PostSync-Hook feuert nie -> Deadlock.
    # Umgestellt am 17.08.2026 im Rahmen des Updates 17.1.2 -> 17.7.2.
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 3
  # 1800s (statt 600s): Die Schema-Aenderungen in 17.3 (Backlogs-Rework) und
  # 17.7 (Departments, work schedules) brauchen deutlich mehr Zeit.
  activeDeadlineSeconds: 1800
  template:
    metadata:
      labels:
        app.kubernetes.io/name: openproject
        app.kubernetes.io/component: seeder
    spec:
      restartPolicy: OnFailure
      securityContext:
        fsGroup: 1000
        runAsUser: 1000
        runAsGroup: 1000
      containers:
        - name: seeder
          image: openproject/openproject:17.4.1-slim
          command:
            - bash
            - /app/docker/prod/seeder
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: openproject-secrets
                  key: database-url
            - name: SECRET_KEY_BASE
              valueFrom:
                secretKeyRef:
                  name: openproject-secrets
                  key: secret-key-base
            - name: OPENPROJECT_HOST__NAME
              value: "openproject-dev-v2.eneg.de"
            - name: OPENPROJECT_HTTPS
              value: "true"
            - name: OPENPROJECT_DEFAULT__LANGUAGE
              value: "de"
            - name: OPENPROJECT_SEED__LOCALE
              value: "de"
            - name: TZ
              value: "Europe/Berlin"
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
