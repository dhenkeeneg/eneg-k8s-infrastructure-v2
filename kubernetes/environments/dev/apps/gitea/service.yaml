---
# Gitea Service (ClusterIP) - nur HTTP, SSH ist deaktiviert
apiVersion: v1
kind: Service
metadata:
  name: gitea
  namespace: gitea
  labels:
    app.kubernetes.io/name: gitea
    app.kubernetes.io/managed-by: argocd
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: gitea
  ports:
    - name: http
      port: 3000
      targetPort: http
      protocol: TCP
