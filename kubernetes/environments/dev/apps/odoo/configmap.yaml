---
# Odoo Konfigurationsdatei (odoo.conf) (DEV)
apiVersion: v1
kind: ConfigMap
metadata:
  name: odoo-config
  namespace: odoo
  labels:
    app.kubernetes.io/name: odoo
    app.kubernetes.io/managed-by: argocd
data:
  odoo.conf: |
    [options]
    ; Datenbank
    db_host = cnpg-erp-rw.databases.svc.cluster.local
    db_port = 5432
    db_user = odoo
    db_name = odoo
    db_sslmode = disable
    db_maxconn = 64
    dbfilter = ^odoo$
    list_db = False

    ; HTTP
    http_port = 8069
    proxy_mode = True

    ; Multi-Process
    workers = 2
    max_cron_threads = 1
    gevent_port = 8072

    ; Limits (DEV-Werte)
    limit_memory_hard = 2684354560
    limit_memory_soft = 2147483648
    limit_time_cpu = 600
    limit_time_real = 1200
    limit_request = 8192

    ; Filestore
    data_dir = /var/lib/odoo

    ; Logging
    log_level = info
