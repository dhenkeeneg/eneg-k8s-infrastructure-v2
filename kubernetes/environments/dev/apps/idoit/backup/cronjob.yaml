---
# ConfigMap: rclone Konfiguration fuer i-doit Backup (DEV)
apiVersion: v1
kind: ConfigMap
metadata:
  name: idoit-backup-config
  namespace: idoit
  labels:
    app.kubernetes.io/name: idoit-backup
    app.kubernetes.io/part-of: pilot-apps
    app.kubernetes.io/managed-by: argocd
data:
  rclone.conf: |
    [nas10]
    type = s3
    provider = Other
    env_auth = true
    endpoint = http://nas10.eneg.de:8010
    region = us-east-1
    force_path_style = true
    no_check_bucket = true
    list_chunk = 100
    disable_http2 = true

  backup.sh: |
    #!/bin/sh
    set -e

    echo "=== i-doit Backup gestartet: $(date -Iseconds) ==="

    # rclone ENV-Variablen fuer Destination (NAS10)
    export RCLONE_CONFIG_NAS10_ACCESS_KEY_ID="${NAS10_ACCESS_KEY_ID}"
    export RCLONE_CONFIG_NAS10_SECRET_ACCESS_KEY="${NAS10_SECRET_ACCESS_KEY}"

    # Datum fuer Backup-Dir (geloeschte/geaenderte Dateien)
    BACKUP_DATE=$(date +%Y-%m-%d)

    # Wochentag (1=Mo, 7=So) und Force-Override fuer src/-Backup
    DAY_OF_WEEK=$(date +%u)
    FORCE_SRC="${BACKUP_FORCE_SRC:-no}"
    echo "Wochentag: ${DAY_OF_WEEK} (1=Mo..7=So), BACKUP_FORCE_SRC=${FORCE_SRC}"

    echo "--- Sichere i-doit Upload-Verzeichnis ---"
    rclone sync \
      "/data/upload/" \
      "nas10:k8s-dev-idoit/upload" \
      --backup-dir "nas10:k8s-dev-idoit/_backups/${BACKUP_DATE}/upload" \
      --config /config/rclone.conf \
      --checksum \
      --transfers 2 \
      --checkers 2 \
      --retries 10 \
      --retries-sleep 30s \
      --low-level-retries 20 \
      --s3-upload-concurrency 2 \
      --contimeout 10s \
      --timeout 120s \
      --stats 30s \
      --stats-one-line \
      --log-level INFO
    echo "--- Upload-Verzeichnis gesichert ---"

    echo ""
    if [ "$DAY_OF_WEEK" = "7" ] || [ "$FORCE_SRC" = "yes" ]; then
      if [ "$FORCE_SRC" = "yes" ]; then
        echo "--- Sichere i-doit src (Force-Override BACKUP_FORCE_SRC=yes) ---"
      else
        echo "--- Sichere i-doit src (Konfiguration, woechentlich Sonntag) ---"
      fi
      rclone sync \
        "/data/src/" \
        "nas10:k8s-dev-idoit/src" \
        --backup-dir "nas10:k8s-dev-idoit/_backups/${BACKUP_DATE}/src" \
        --config /config/rclone.conf \
        --checksum \
        --transfers 2 \
        --checkers 2 \
        --retries 10 \
        --retries-sleep 30s \
        --low-level-retries 20 \
        --s3-upload-concurrency 2 \
        --contimeout 10s \
        --timeout 120s \
        --stats 30s \
        --stats-one-line \
        --log-level INFO
      echo "--- src gesichert ---"
    else
      echo "--- src/-Backup heute uebersprungen (Wochentag ${DAY_OF_WEEK}, laeuft nur So oder bei BACKUP_FORCE_SRC=yes) ---"
    fi

    # Alte Backup-Dirs aufraemen (aelter als 32 Tage)
    echo ""
    echo "--- Alte Backups aufraemen (>32 Tage) ---"
    CUTOFF_DATE=$(date -d "@$(($(date +%s) - 32*86400))" +%Y-%m-%d)

    if [ -n "$CUTOFF_DATE" ]; then
      rclone lsd "nas10:k8s-dev-idoit/_backups/" --config /config/rclone.conf 2>/dev/null | awk '{print $NF}' | while read DIR; do
        if [ "$DIR" \< "$CUTOFF_DATE" ] || [ "$DIR" = "$CUTOFF_DATE" ]; then
          echo "Loesche altes Backup: _backups/${DIR}"
          rclone purge "nas10:k8s-dev-idoit/_backups/${DIR}" \
            --config /config/rclone.conf
        fi
      done
    else
      echo "WARNUNG: Konnte Cutoff-Datum nicht berechnen, ueberspringe Cleanup"
    fi

    echo ""
    echo "=== i-doit Backup abgeschlossen: $(date -Iseconds) ==="
---
# CronJob: i-doit Backup auf NAS10 (DEV)
# Taegliche Sicherung von Upload + src auf NAS10 QuObject S3
# Retention: 32 Tage via --backup-dir Pattern
apiVersion: batch/v1
kind: CronJob
metadata:
  name: idoit-backup
  namespace: idoit
  labels:
    app.kubernetes.io/name: idoit-backup
    app.kubernetes.io/part-of: pilot-apps
    app.kubernetes.io/managed-by: argocd
spec:
  # TEMP 2026-05-14: suspend=true fuer Cluster-Recovery (siehe docs/incidents/2026-05-11-...)
  # Reaktivierung: Zeile loeschen oder suspend=false.
  suspend: true
  schedule: "30 6 * * *"
  timeZone: "Europe/Berlin"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  startingDeadlineSeconds: 3600
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 7200
      ttlSecondsAfterFinished: 3600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: idoit-backup
        spec:
          restartPolicy: OnFailure
          affinity:
            podAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - labelSelector:
                    matchLabels:
                      app.kubernetes.io/name: idoit
                  topologyKey: kubernetes.io/hostname
          containers:
            - name: rclone
              image: rclone/rclone:1.73.1
              command:
                - /bin/sh
                - /scripts/backup.sh
              env:
                - name: NAS10_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: idoit-backup-credentials
                      key: NAS10_ACCESS_KEY_ID
                - name: NAS10_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: idoit-backup-credentials
                      key: NAS10_SECRET_ACCESS_KEY
                # src/ wird nur Sonntags gesichert. Fuer manuellen Force-Run:
                # kubectl create job idoit-force-src-$(date +%Y%m%d-%H%M) \
                #   --from=cronjob/idoit-backup -n idoit
                # kubectl set env -n idoit job/idoit-force-src-... BACKUP_FORCE_SRC=yes
                # (set env muss BEVOR der Pod startet ausgefuehrt werden -> CronJob suspenden,
                #  patchen, Job triggern, ENV setzen, suspenden ruecknehmen.
                #  Einfacher: cronjob temporaer patchen mit "yes", einmal triggern, zurueck auf "no")
                - name: BACKUP_FORCE_SRC
                  value: "no"
              volumeMounts:
                - name: config
                  mountPath: /config/rclone.conf
                  subPath: rclone.conf
                  readOnly: true
                - name: scripts
                  mountPath: /scripts/backup.sh
                  subPath: backup.sh
                  readOnly: true
                - name: idoit-data
                  mountPath: /data/upload
                  subPath: upload
                  readOnly: true
                - name: idoit-data
                  mountPath: /data/src
                  subPath: src
                  readOnly: true
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  cpu: 500m
                  memory: 256Mi
          volumes:
            - name: config
              configMap:
                name: idoit-backup-config
                items:
                  - key: rclone.conf
                    path: rclone.conf
            - name: scripts
              configMap:
                name: idoit-backup-config
                defaultMode: 0755
                items:
                  - key: backup.sh
                    path: backup.sh
            - name: idoit-data
              persistentVolumeClaim:
                claimName: idoit-data
                readOnly: true
