---
# ArgoCD Application: Garage Secrets (via KSOPS)
# RPC Secret, Admin Token, Metrics Token, WebUI Auth
# Sync-Wave 4: Zusammen mit anderen Infrastructure-Secrets
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: garage-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "4"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    repoURL: git@github.com:dhenkeeneg/eneg-k8s-infrastructure-v2.git
    targetRevision: main
    path: kubernetes/base/garage/secrets
    directory:
      recurse: false

  destination:
    server: https://kubernetes.default.svc
    namespace: garage

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
