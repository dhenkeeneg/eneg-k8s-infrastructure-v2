---
# ArgoCD Application: Keycloak Secrets (via KSOPS)
# DB-Passwort + Bootstrap Admin-Passwort fuer Keycloak
# Sync-Wave 7: Nach Databases (Wave 6), vor App (Wave 8)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: keycloak-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "7"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    repoURL: git@github.com:dhenkeeneg/eneg-k8s-infrastructure-v2.git
    targetRevision: main
    path: kubernetes/environments/dev/apps/keycloak/secrets
    directory:
      recurse: false

  destination:
    server: https://kubernetes.default.svc
    namespace: keycloak

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
