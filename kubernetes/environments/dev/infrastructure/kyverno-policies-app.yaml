---
# ArgoCD Application: Kyverno Policies - Pod Security Standards (DEV)
# Helm Chart kyverno/kyverno-policies v3.7.1
# Multi-Source: Helm Chart + Base Values
# Kubernetes Pod Security Standards im Audit-Modus
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kyverno-policies
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  sources:
    # Source 1: Kyverno Policies Helm Chart
    - repoURL: https://kyverno.github.io/kyverno/
      chart: kyverno-policies
      targetRevision: 3.7.1
      helm:
        releaseName: kyverno-policies
        valueFiles:
          - $values/kubernetes/base/kyverno-policies/values.yaml

    # Source 2: Git Repository Referenz fuer Values
    - repoURL: git@github.com:dhenkeeneg/eneg-k8s-infrastructure-v2.git
      targetRevision: main
      ref: values

  destination:
    server: https://kubernetes.default.svc
    namespace: kyverno

  # Kyverno Admission Controller modifiziert ClusterPolicies nach dem Apply
  # (fuegt Status-Conditions und Webhook-Registrierungen hinzu)
  ignoreDifferences:
    - group: kyverno.io
      kind: ClusterPolicy
      jqPathExpression: .spec.webhookConfiguration

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
