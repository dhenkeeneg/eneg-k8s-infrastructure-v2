---
# ArgoCD Application: Odoo Backup CronJob
# Taegliche Sicherung des Odoo Filestore auf NAS10 QuObject S3
# ConfigMap (rclone.conf + backup.sh) + CronJob
# Sync-Wave 9: Nach App (Wave 8)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: odoo-backup
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "9"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    repoURL: git@github.com:dhenkeeneg/eneg-k8s-infrastructure-v2.git
    targetRevision: main
    path: kubernetes/base/apps/odoo/backup
    directory:
      recurse: false

  destination:
    server: https://kubernetes.default.svc

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
