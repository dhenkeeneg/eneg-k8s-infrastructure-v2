---
# ArgoCD Application: Longhorn DB StorageClass
# Dedizierte StorageClass fuer Datenbank-Workloads
# strict-local + Replica-Count 1 (DBs replizieren selbst)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: longhorn-storageclass
  namespace: argocd
  annotations:
    # Nach Longhorn deployen (Sync-Wave 3 = nach Storage)
    argocd.argoproj.io/sync-wave: "3"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    repoURL: git@github.com:dhenkeeneg/eneg-k8s-infrastructure-v2.git
    targetRevision: main
    path: kubernetes/base/longhorn
      include: 'storageclass-db.yaml'

  destination:
    server: https://kubernetes.default.svc

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
