---
# ArgoCD Application: MariaDB i-doit Databases
# Erstellt Database, User und Grant CRDs fuer i-doit
# Sync-Wave 6: Nach MariaDB Galera (Wave 5), vor Secrets (Wave 7)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mariadb-idoit-databases
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "6"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    repoURL: git@github.com:dhenkeeneg/eneg-k8s-infrastructure-v2.git
    targetRevision: main
    path: kubernetes/base/mariadb-galera/databases
    directory:
      recurse: false

  destination:
    server: https://kubernetes.default.svc
    namespace: databases

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
      - ServerSideApply=true
