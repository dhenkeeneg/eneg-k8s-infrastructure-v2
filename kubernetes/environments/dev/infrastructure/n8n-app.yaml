---
# ArgoCD Application: n8n Workflow-Automation
# Deployed Namespace, Deployment, Service, PVC und Ingress
# Resourcen liegen in n8n + traefik Namespace (cross-namespace Ingress)
# Sync-Wave 8: Nach Secrets (Wave 7)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: n8n
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "8"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    repoURL: git@github.com:dhenkeeneg/eneg-k8s-infrastructure-v2.git
    targetRevision: main
    path: kubernetes/environments/dev/apps/n8n

  destination:
    server: https://kubernetes.default.svc

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
