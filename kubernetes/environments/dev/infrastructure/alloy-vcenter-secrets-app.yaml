---
# ArgoCD Application: Alloy-vCenter Secrets (via KSOPS)
# vCenter-Credentials (svc-otel-vcenter@eneg.de) + CA-Bundle (beide VMCA-Roots)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: alloy-vcenter-secrets
  namespace: argocd
  annotations:
    # Secrets VOR der Alloy-vCenter-Instanz deployen
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    repoURL: git@github.com:dhenkeeneg/eneg-k8s-infrastructure-v2.git
    targetRevision: main
    path: kubernetes/environments/dev/alloy-vcenter-secrets

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
