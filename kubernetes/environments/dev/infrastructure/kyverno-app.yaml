---
# ArgoCD Application: Kyverno Policy Engine (DEV)
# Helm Chart kyverno/kyverno v3.7.1 (App v1.17.1)
# Multi-Source: Helm Chart + Base Values + DEV Override
# Kubernetes-native Policy Engine (Admission Controller)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kyverno
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  sources:
    # Source 1: Kyverno Helm Chart
    - repoURL: https://kyverno.github.io/kyverno/
      chart: kyverno
      targetRevision: 3.7.1
      helm:
        releaseName: kyverno
        valueFiles:
          - $values/kubernetes/base/kyverno/values.yaml
          - $values/kubernetes/environments/dev/kyverno/values-override.yaml

    # Source 2: Git Repository Referenz fuer Values
    - repoURL: git@github.com:dhenkeeneg/eneg-k8s-infrastructure-v2.git
      targetRevision: main
      ref: values

  destination:
    server: https://kubernetes.default.svc
    namespace: kyverno

  # Kyverno modifiziert seine eigenen CRDs nach dem Apply (Webhook-Config, Conversion)
  # ArgoCD sieht diese Aenderungen als Diff → permanentes OutOfSync ohne ignoreDifferences
  ignoreDifferences:
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      jqPathExpression: .spec.conversion

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
