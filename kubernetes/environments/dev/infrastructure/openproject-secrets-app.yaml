---
# ArgoCD Application: OpenProject Secrets (via KSOPS)
# SECRET_KEY_BASE, Hocuspocus Secret, DATABASE_URL, S3-Credentials
# Sync-Wave 7: Nach Databases (Wave 6), vor App (Wave 8)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: openproject-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "7"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    repoURL: git@github.com:dhenkeeneg/eneg-k8s-infrastructure-v2.git
    targetRevision: main
    path: kubernetes/environments/dev/apps/openproject/secrets

  destination:
    server: https://kubernetes.default.svc
    namespace: openproject

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
