---
# ArgoCD Application: Blackbox Exporter (DEV)
# Multi-Source: Helm Chart v11.9.1 + Base Values
# Probes: NAS10 S3 Endpoint Health
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: blackbox-exporter
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  sources:
    # Source 1: Helm Chart
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: prometheus-blackbox-exporter
      targetRevision: 11.9.1
      helm:
        releaseName: blackbox-exporter
        valueFiles:
          - $values/kubernetes/base/monitoring/blackbox-exporter/values.yaml

    # Source 2: Git Repository Referenz fuer Values
    - repoURL: git@github.com:dhenkeeneg/eneg-k8s-infrastructure-v2.git
      targetRevision: main
      ref: values

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
