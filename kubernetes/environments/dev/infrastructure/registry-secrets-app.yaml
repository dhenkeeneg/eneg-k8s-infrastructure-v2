---
# ArgoCD Application: Zot Registry Secrets (via KSOPS)
# DEV S3-Credentials + htpasswd + GHCR-Sync-Credentials
# Sync-Wave 3: Vor registry-Deployment (Wave 4)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: registry-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    repoURL: git@github.com:dhenkeeneg/eneg-k8s-infrastructure-v2.git
    targetRevision: main
    path: kubernetes/environments/dev/registry-secrets

  destination:
    server: https://kubernetes.default.svc
    namespace: registry

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
