---
# ArgoCD Application: IT-Info-Versand
# Deployed Namespace, Deployment, Service und Ingress
# Ressourcen liegen in it-info-versand + traefik Namespace (cross-namespace Ingress)
# Sync-Wave 8: Nach Secrets (Wave 7)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: it-info-versand
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "8"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    repoURL: git@github.com:dhenkeeneg/eneg-k8s-infrastructure-v2.git
    targetRevision: main
    path: kubernetes/environments/dev/apps/it-info-versand
    directory:
      recurse: false

  destination:
    server: https://kubernetes.default.svc

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
