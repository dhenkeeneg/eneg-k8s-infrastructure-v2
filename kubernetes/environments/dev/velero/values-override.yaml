# Velero DEV Override
# Umgebungsspezifisch: S3-Endpoint, Bucket, Backup-Schedule

# -----------------------------------------------------------------------
# TEMP 2026-05-14: Velero Server + nodeAgent aus fuer Cluster-Recovery.
# Verhindert auto-resumed Backups/Restores beim Boot.
# Reaktivierung: replicaCount=1, nodeAgent.enable=true, disabled=false.
# -----------------------------------------------------------------------
replicaCount: 0

# -----------------------------------------------------------------------
# Backup Storage Location: DEV S3 Bucket auf NAS10
# -----------------------------------------------------------------------
configuration:
  backupStorageLocation:
    - name: default
      provider: aws
      default: true
      accessMode: ReadWrite
      bucket: k8s-dev-velero
      config:
        region: us-east-1
        s3ForcePathStyle: "true"
        s3Url: http://nas10.eneg.de:8010
        insecureSkipTLSVerify: "true"

# -----------------------------------------------------------------------
# Backup Schedule: Taeglich 04:30 Europe/Berlin, 14 Tage Retention
# -----------------------------------------------------------------------
schedules:
  daily-backup:
    # TEMP 2026-05-14: disabled=true fuer Recovery (sonst Auto-Backup-Start beim Boot).
    # Reaktivierung: disabled=false setzen.
    disabled: true
    schedule: "45 5 * * *"
    useOwnerReferencesInBackup: false
    template:
      ttl: "336h0m0s"
      storageLocation: default
      defaultVolumesToFsBackup: true
      includedNamespaces:
        - "*"


# -----------------------------------------------------------------------
# Resource Limits: erhoeht wegen OOM-Kills bei ~4000 Items im Cluster
# (Helm-Chart-Default 512Mi war zu klein - Pod wurde beim Backup OOM-killed)
# -----------------------------------------------------------------------
resources:
  requests:
    cpu: 200m
    memory: 512Mi
  limits:
    cpu: 1000m
    memory: 2Gi

nodeAgent:
  # TEMP 2026-05-14: enable=false fuer Recovery (DaemonSet auf jedem Node aus).
  # Reaktivierung: enable=true setzen.
  enable: false
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 1Gi
