# Velero DEV Override
# Umgebungsspezifisch: S3-Endpoint, Bucket, Backup-Schedule

# -----------------------------------------------------------------------
# Backup Storage Location: DEV S3 Bucket auf NAS20
# -----------------------------------------------------------------------
configuration:
  backupStorageLocation:
    - name: default
      provider: aws
      default: true
      accessMode: ReadWrite
      bucket: k8s-dev-velero
      config:
        region: us-east-1
        s3ForcePathStyle: "true"
        s3Url: https://nas20.eneg.de:8010
        # Sauberes TLS gegen NAS20: kein skip-verify. QuObjects (8010) sendet
        # nur das Leaf-Zert -> CA-Bundle (Sectigo R36+R46) clientseitig via
        # AWS_CA_BUNDLE (siehe configuration.extraEnvVars + extraVolumes unten).
        # Secret velero-s3-ca (NS velero), Mount /etc/ca/ca.crt. (14a-cleanup)
        # Workaround fuer NAS10 QuObjects: AWS-SDK-go-v2 sendet seit
        # ~v1.30 Trailing-Checksums (x-amz-sdk-checksum-algorithm), die
        # QNAP QuObjects mit 400 InvalidDigest ablehnt. Leer-String
        # unterdrueckt SDK-side Checksum-Generierung.
        # Ref: docs/phases/velero-aws-sdk-checksum-fix-dev.md
        # Ref: velero-io/velero#8265, #8742
        checksumAlgorithm: ""

  # CA-Bundle dem AWS-SDK bekanntmachen (sauberes TLS gegen NAS20).
  # Gleiches Muster wie pg_dumpall/botocore (AWS_CA_BUNDLE + Volume-Mount).
  extraEnvVars:
    - name: AWS_CA_BUNDLE
      value: /etc/ca/ca.crt

# -----------------------------------------------------------------------
# Backup Schedule: Taeglich 05:45 Europe/Berlin, 5 Tage Retention (NAS20)
# -----------------------------------------------------------------------
schedules:
  daily-backup:
    schedule: "45 5 * * *"
    useOwnerReferencesInBackup: false
    template:
      ttl: "120h0m0s"
      storageLocation: default
      defaultVolumesToFsBackup: true
      includedNamespaces:
        - "*"


# -----------------------------------------------------------------------
# Resource Limits: erhoeht wegen OOM-Kills bei ~4000 Items im Cluster
# (Helm-Chart-Default 512Mi war zu klein - Pod wurde beim Backup OOM-killed)
# -----------------------------------------------------------------------
resources:
  requests:
    cpu: 200m
    memory: 512Mi
  limits:
    cpu: 1000m
    memory: 2Gi

nodeAgent:
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 1Gi

# -----------------------------------------------------------------------
# CA-Bundle Mount fuer sauberes TLS gegen NAS20 (14a-cleanup)
# Top-Level extraVolumes/extraVolumeMounts gelten fuer das velero-Server-
# Deployment (dort laeuft das AWS-SDK -> BSL-Validierung + Backup-Upload).
# Secret velero-s3-ca (NS velero, Sectigo R36+R46), referenziert von
# AWS_CA_BUNDLE=/etc/ca/ca.crt (siehe configuration.extraEnvVars).
# -----------------------------------------------------------------------
extraVolumes:
  - name: s3-ca
    secret:
      secretName: velero-s3-ca
extraVolumeMounts:
  - name: s3-ca
    mountPath: /etc/ca
    readOnly: true
