# Velero DEV Override
# Umgebungsspezifisch: S3-Endpoint, Bucket, Backup-Schedule

# -----------------------------------------------------------------------
# Backup Storage Location: DEV S3 Bucket auf NAS20
# -----------------------------------------------------------------------
configuration:
  backupStorageLocation:
    - name: default
      provider: aws
      default: true
      accessMode: ReadWrite
      bucket: k8s-dev-velero
      config:
        region: us-east-1
        s3ForcePathStyle: "true"
        s3Url: https://nas20.eneg.de:8010
        insecureSkipTLSVerify: "true"
        # Workaround fuer NAS10 QuObjects: AWS-SDK-go-v2 sendet seit
        # ~v1.30 Trailing-Checksums (x-amz-sdk-checksum-algorithm), die
        # QNAP QuObjects mit 400 InvalidDigest ablehnt. Leer-String
        # unterdrueckt SDK-side Checksum-Generierung.
        # Ref: docs/phases/velero-aws-sdk-checksum-fix-dev.md
        # Ref: velero-io/velero#8265, #8742
        checksumAlgorithm: ""

# -----------------------------------------------------------------------
# Backup Schedule: Taeglich 05:45 Europe/Berlin, 5 Tage Retention (NAS20)
# -----------------------------------------------------------------------
schedules:
  daily-backup:
    schedule: "45 5 * * *"
    useOwnerReferencesInBackup: false
    template:
      ttl: "120h0m0s"
      storageLocation: default
      defaultVolumesToFsBackup: true
      includedNamespaces:
        - "*"


# -----------------------------------------------------------------------
# Resource Limits: erhoeht wegen OOM-Kills bei ~4000 Items im Cluster
# (Helm-Chart-Default 512Mi war zu klein - Pod wurde beim Backup OOM-killed)
# -----------------------------------------------------------------------
resources:
  requests:
    cpu: 200m
    memory: 512Mi
  limits:
    cpu: 1000m
    memory: 2Gi

nodeAgent:
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 1Gi
