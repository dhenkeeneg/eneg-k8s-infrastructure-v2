---
# PrometheusRule: Prometheus TSDB Health (DEV)
# Frueherkennung des TSDB-WAL-Deadlocks vom 21.06.2026:
# Eine WAL-Korruption (Folge der Longhorn-I/O-Latenz-Krise) blockierte die
# Kompaktierung -> WAL wuchs ungebremst auf 19,2 GB -> 20Gi-PVC voll ->
# Schreibstopp -> Monitoring-Blindflug. retentionSize greift NICHT auf das WAL.
# Diese Rules alarmieren, BEVOR die Disk volllaeuft.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: prometheus-tsdb-health-dev
  namespace: monitoring
  labels:
    app: kube-prometheus-stack
    release: kube-prometheus-stack
spec:
  groups:
    - name: prometheus-tsdb-health-dev.rules
      rules:
        # (a) Kompaktierung scheitert - direkter Vorbote des WAL-Deadlocks
        - alert: PrometheusTSDBCompactionsFailing
          expr: increase(prometheus_tsdb_compactions_failed_total{job="kube-prometheus-stack-prometheus"}[1h]) > 0
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "Prometheus TSDB-Kompaktierung scheitert ({{ $labels.namespace }})"
            description: "Prometheus {{ $labels.namespace }}/{{ $labels.pod }} meldet fehlgeschlagene TSDB-Kompaktierungen in der letzten Stunde. Bei anhaltendem Fehler waechst das WAL ungebremst und die Disk laeuft voll (Deadlock). Pod-Logs pruefen, ggf. PVC-Platz pruefen."

        # (b) WAL-Korruption - die eigentliche Wurzel (Folge von Storage-I/O-Latenz)
        - alert: PrometheusTSDBWALCorruptions
          expr: increase(prometheus_tsdb_wal_corruptions_total{job="kube-prometheus-stack-prometheus"}[1h]) > 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Prometheus TSDB-WAL-Korruption erkannt ({{ $labels.namespace }})"
            description: "Prometheus {{ $labels.namespace }}/{{ $labels.pod }} meldet eine WAL-Korruption. Haeufige Ursache: Storage-I/O-Latenz/Schreib-Timeouts auf dem Longhorn-Volume. Storage-Gesundheit (Longhorn, Disk-Latenz) pruefen - eine Korruption kann zeitversetzt zum Kompaktierungs-Deadlock fuehren."

        # Frueherkennung: PVC-Fuellstand - letzte Sicherung vor dem Schreibstopp
        - alert: PrometheusStorageFillingUp
          expr: |
            (
              kubelet_volume_stats_used_bytes{namespace="monitoring", persistentvolumeclaim=~"prometheus-.*"}
              /
              kubelet_volume_stats_capacity_bytes{namespace="monitoring", persistentvolumeclaim=~"prometheus-.*"}
            ) > 0.80
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Prometheus-PVC ueber 80% belegt ({{ $labels.persistentvolumeclaim }})"
            description: "Das Prometheus-PVC {{ $labels.persistentvolumeclaim }} ist zu {{ $value | humanizePercentage }} belegt. Vor dem Schreibstopp (100%) eingreifen: retentionSize/retention pruefen, WAL-Groesse pruefen, ggf. Volume erweitern. Siehe Runbook prometheus-wal-deadlock."
