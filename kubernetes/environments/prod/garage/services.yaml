---
# Headless Service fuer StatefulSet DNS-Aufloesung
apiVersion: v1
kind: Service
metadata:
  name: garage-headless
  namespace: garage
  labels:
    app.kubernetes.io/name: garage
    app.kubernetes.io/component: headless
    app.kubernetes.io/managed-by: argocd
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: garage
  ports:
    - name: rpc
      port: 3901
      targetPort: rpc
      protocol: TCP
---
# ClusterIP Service fuer S3 API Zugriff
apiVersion: v1
kind: Service
metadata:
  name: garage-s3
  namespace: garage
  labels:
    app.kubernetes.io/name: garage
    app.kubernetes.io/component: s3-api
    app.kubernetes.io/managed-by: argocd
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: garage
  ports:
    - name: s3
      port: 3900
      targetPort: s3-api
      protocol: TCP
---
# ClusterIP Service fuer Admin API
apiVersion: v1
kind: Service
metadata:
  name: garage-admin
  namespace: garage
  labels:
    app.kubernetes.io/name: garage
    app.kubernetes.io/component: admin-api
    app.kubernetes.io/managed-by: argocd
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: garage
  ports:
    - name: admin
      port: 3903
      targetPort: admin
      protocol: TCP
