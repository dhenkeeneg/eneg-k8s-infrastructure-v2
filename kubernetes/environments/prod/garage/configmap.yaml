---
# Garage Konfiguration (garage.toml) — PROD
# Platzhalter werden durch den Init-Container ersetzt
# Bootstrap-Peers: Node-IDs muessen nach erstem Start ausgelesen werden!
# kubectl exec -n garage garage-0 -- cat /var/lib/garage/meta/node_key.pub
apiVersion: v1
kind: ConfigMap
metadata:
  name: garage-config
  namespace: garage
  labels:
    app.kubernetes.io/name: garage
    app.kubernetes.io/part-of: infrastructure
    app.kubernetes.io/managed-by: argocd
data:
  garage.toml: |
    metadata_dir = "/var/lib/garage/meta"
    data_dir = "/var/lib/garage/data"

    db_engine = "lmdb"
    metadata_auto_snapshot_interval = "6h"

    replication_factor = 2
    compression_level = 1

    rpc_bind_addr = "[::]:3901"
    rpc_public_addr = "__POD_IP__:3901"
    rpc_secret = "__RPC_SECRET__"

    bootstrap_peers = [
      "4b17a0c30796df60a63ba338ccdc5876b505242df468b1aa40389e08a13aa76e@garage-0.garage-headless.garage.svc.cluster.local:3901",
      "5969a75cbfa419856c15d913a32dd0dd45b8d56ca18db799c653107b309f3d3f@garage-1.garage-headless.garage.svc.cluster.local:3901",
      "d0dc02bf1faed9c76434bd28d9f609ce3df19fa88bcad4a477e0de7bc1785eb4@garage-2.garage-headless.garage.svc.cluster.local:3901",
    ]

    [s3_api]
    s3_region = "eu-central-1"
    api_bind_addr = "[::]:3900"

    [admin]
    api_bind_addr = "[::]:3903"
    admin_token = "__ADMIN_TOKEN__"
    metrics_token = "__METRICS_TOKEN__"
