# Thanos PROD Override
# Environment: PROD (VLAN 178)

# Compactor PVC: Vergroessert von 10Gi auf 30Gi (2026-05-06)
# Grund: Wochentliche Re-Compactions von 24h-Bloecken zu 7d-Block
# benoetigen ~14-20 GB lokalen Working-Space (Source-Bloecke + Output).
# 10Gi war zu klein und fuehrte zu KubePersistentVolumeFillingUp Alerts
# und ThanosCompactionFailed (in DEV/TEST bereits aufgetreten).
# Identische Loesung wie DEV (05.05.2026) und TEST (06.05.2026).
#
# CA-Bundle fuer NAS20 TLS (Secret eneg-s3-ca, NS monitoring, bereits durch die
# Loki-Migration 07.07.2026 vorhanden). Gemountet an compactor + storegateway,
# Pfad /etc/ca/ca.crt deckt sich mit http_config.tls_config.ca_file im objstore.yml
# (thanos-objstore-config Secret). P4a Thanos-Migration NAS10->NAS20 (16.07.2026),
# analog DEV/TEST-Muster.
compactor:
  persistence:
    size: 30Gi
  extraVolumes:
    - name: s3-ca
      secret:
        secretName: eneg-s3-ca
  extraVolumeMounts:
    - name: s3-ca
      mountPath: /etc/ca
      readOnly: true

storegateway:
  extraVolumes:
    - name: s3-ca
      secret:
        secretName: eneg-s3-ca
  extraVolumeMounts:
    - name: s3-ca
      mountPath: /etc/ca
      readOnly: true
