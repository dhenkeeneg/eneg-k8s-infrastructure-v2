# Thanos PROD Override
# Environment: PROD (VLAN 178)

# Compactor PVC: Vergroessert von 10Gi auf 30Gi (2026-05-06)
# Grund: Wochentliche Re-Compactions von 24h-Bloecken zu 7d-Block
# benoetigen ~14-20 GB lokalen Working-Space (Source-Bloecke + Output).
# 10Gi war zu klein und fuehrte zu KubePersistentVolumeFillingUp Alerts
# und ThanosCompactionFailed (in DEV/TEST bereits aufgetreten).
# Identische Loesung wie DEV (05.05.2026) und TEST (06.05.2026).
compactor:
  # TEMPORAER (P4a Thanos-Migration NAS10->NAS20, 16.07.2026): Compactor pausiert,
  # damit waehrend der rclone-Datenkopie NAS10->NAS20 keine Kompaktierung laeuft.
  # Wird in Phase (c) wieder aktiviert (enabled:false entfernen), gemeinsam mit
  # Secret-Cutover + CA-Mounts (Split-Brain-sicher in EINEM Sync).
  # HINWEIS: compactor.replicaCount greift beim bitnami-Chart NICHT (Compactor ist
  # Singleton) -> enabled:false ist der wirksame Schalter (Lehre aus TEST 16.07.).
  # Das Compactor-PVC (30Gi) wird durch ArgoCD prune:true mit entfernt und in
  # Phase (c) neu (leer) angelegt - beim Compactor folgenlos.
  enabled: false
  persistence:
    size: 30Gi
