---
# PersistentVolumeClaim fuer OpenProject tmp-Daten (PROD)
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: openproject-tmp
  namespace: openproject
  labels:
    app.kubernetes.io/name: openproject
    app.kubernetes.io/managed-by: argocd
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 5Gi
---
# Memcached Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openproject-memcached
  namespace: openproject
  labels:
    app.kubernetes.io/name: openproject-memcached
    app.kubernetes.io/part-of: openproject
    app.kubernetes.io/managed-by: argocd
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: openproject-memcached
  template:
    metadata:
      labels:
        app.kubernetes.io/name: openproject-memcached
    spec:
      containers:
        - name: memcached
          image: memcached:1.6.45-alpine
          args:
            - --memory-limit=128
            - --conn-limit=1024
            - --threads=2
          ports:
            - name: memcached
              containerPort: 11211
              protocol: TCP
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 192Mi
          livenessProbe:
            tcpSocket:
              port: memcached
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            tcpSocket:
              port: memcached
            initialDelaySeconds: 5
            periodSeconds: 10
---
# Memcached Service
apiVersion: v1
kind: Service
metadata:
  name: openproject-memcached
  namespace: openproject
  labels:
    app.kubernetes.io/name: openproject-memcached
    app.kubernetes.io/part-of: openproject
    app.kubernetes.io/managed-by: argocd
spec:
  type: ClusterIP
  ports:
    - port: 11211
      targetPort: memcached
      protocol: TCP
      name: memcached
  selector:
    app.kubernetes.io/name: openproject-memcached
---
# Hocuspocus Deployment (Collaborative Editing) (PROD)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openproject-hocuspocus
  namespace: openproject
  labels:
    app.kubernetes.io/name: openproject-hocuspocus
    app.kubernetes.io/part-of: openproject
    app.kubernetes.io/managed-by: argocd
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: openproject-hocuspocus
  template:
    metadata:
      labels:
        app.kubernetes.io/name: openproject-hocuspocus
    spec:
      containers:
        - name: hocuspocus
          # Gepinnt auf die Core-Version (frueher: latest).
          # latest wird laufend neu gebaut -> ein Pod-Restart zog einen
          # unbekannten Build, ohne Rollback-Punkt und potenziell
          # inkompatibel zum Core. Wie deutlich das ist: unter demselben
          # latest-Tag lief DEV am 17.08. auf Hocuspocus v3.4.4, TEST am
          # 18.08. auf v4.3.0. Zieht ab jetzt mit dem Core-Tag mit.
          image: openproject/hocuspocus:17.7.2
          env:
            - name: SECRET
              valueFrom:
                secretKeyRef:
                  name: openproject-secrets
                  key: hocuspocus-secret
            - name: OPENPROJECT_URL
              value: "http://openproject-web.openproject.svc.cluster.local:8080"
            - name: OPENPROJECT_HTTPS
              value: "true"
          ports:
            - name: hocuspocus
              containerPort: 1234
              protocol: TCP
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            tcpSocket:
              port: hocuspocus
            initialDelaySeconds: 15
            periodSeconds: 15
          readinessProbe:
            tcpSocket:
              port: hocuspocus
            initialDelaySeconds: 10
            periodSeconds: 10
---
# Hocuspocus Service
apiVersion: v1
kind: Service
metadata:
  name: openproject-hocuspocus
  namespace: openproject
  labels:
    app.kubernetes.io/name: openproject-hocuspocus
    app.kubernetes.io/part-of: openproject
    app.kubernetes.io/managed-by: argocd
spec:
  type: ClusterIP
  ports:
    - port: 1234
      targetPort: hocuspocus
      protocol: TCP
      name: hocuspocus
  selector:
    app.kubernetes.io/name: openproject-hocuspocus
---
# OpenProject Web Deployment (PROD)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openproject-web
  namespace: openproject
  labels:
    app.kubernetes.io/name: openproject
    app.kubernetes.io/version: "17.7.2"
    app.kubernetes.io/part-of: pilot-apps
    app.kubernetes.io/managed-by: argocd
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: openproject
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: openproject
        app.kubernetes.io/component: web
    spec:
      securityContext:
        fsGroup: 1000
        runAsUser: 1000
        runAsGroup: 1000
      initContainers:
        - name: init-tmp
          image: busybox:1.37
          command:
            - sh
            - -c
            - mkdir -p /tmp/openproject && chown 1000:1000 /tmp/openproject
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      containers:
        - name: openproject
          image: openproject/openproject:17.7.2-slim
          command:
            - bash
            - /app/docker/prod/web
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: openproject-secrets
                  key: database-url
            - name: SECRET_KEY_BASE
              valueFrom:
                secretKeyRef:
                  name: openproject-secrets
                  key: secret-key-base
            - name: RAILS_CACHE_STORE
              value: "memcache"
            - name: OPENPROJECT_CACHE__MEMCACHE__SERVER
              value: "openproject-memcached.openproject.svc.cluster.local:11211"
            - name: RAILS_MIN_THREADS
              value: "4"
            - name: RAILS_MAX_THREADS
              value: "16"
            - name: OPENPROJECT_HOST__NAME
              value: "openproject.eneg.de"
            - name: OPENPROJECT_HTTPS
              value: "true"
            - name: OPENPROJECT_HSTS
              value: "true"
            # SSRF-Schutz-Allowlist (ab 17.5.0 zwingend erforderlich)
            # 17.5.0 blockt ausgehende HTTP-Requests in reservierte Netze
            # (10/8, 172.16/12, 192.168/16, 127/8, 169.254/16) - auch wenn
            # ein Hostname eingetragen ist, der dorthin aufloest.
            # Einheitlich ueber alle Umgebungen gepflegt, damit ein
            # verschobener oder geteilter Dienst nicht still blockiert wird:
            #   192.168.178.0/24  PROD-Netz (Traefik LB 192.168.178.100)
            #   192.168.179.0/24  TEST-Netz (Traefik LB 192.168.179.100)
            #   192.168.180.0/24  DEV-Netz (dort laeuft u.a. die Registry,
            #                     die aber containerd zieht, nicht OpenProject)
            #   192.168.161.0/24  eNeG-Servernetz inkl. NAS mit externem S3
            #   10.43.0.0/16      Service-CIDR (Garage S3, Memcached)
            #   10.42.0.0/16      Pod-CIDR (Headless Services)
            - name: OPENPROJECT_SSRF__PROTECTION__IP__ALLOWLIST
              value: "192.168.178.0/24,192.168.179.0/24,192.168.180.0/24,192.168.161.0/24,10.43.0.0/16,10.42.0.0/16"
            - name: OPENPROJECT_COLLABORATIVE__EDITING__HOCUSPOCUS__URL
              value: "wss://openproject.eneg.de/hocuspocus"
            - name: OPENPROJECT_COLLABORATIVE__EDITING__HOCUSPOCUS__SECRET
              valueFrom:
                secretKeyRef:
                  name: openproject-secrets
                  key: hocuspocus-secret
            - name: OPENPROJECT_ADDITIONAL__HOST__NAMES
              value: "openproject-web.openproject.svc.cluster.local"
            - name: OPENPROJECT_ATTACHMENTS__STORAGE
              value: "fog"
            - name: OPENPROJECT_FOG_DIRECTORY
              value: "openproject-assets"
            - name: OPENPROJECT_FOG_CREDENTIALS_PROVIDER
              value: "aws"
            - name: OPENPROJECT_FOG_CREDENTIALS_ENDPOINT
              value: "http://garage-s3.garage.svc.cluster.local:3900"
            - name: OPENPROJECT_FOG_CREDENTIALS_AWS__ACCESS__KEY__ID
              valueFrom:
                secretKeyRef:
                  name: openproject-secrets
                  key: s3-access-key-id
            - name: OPENPROJECT_FOG_CREDENTIALS_AWS__SECRET__ACCESS__KEY
              valueFrom:
                secretKeyRef:
                  name: openproject-secrets
                  key: s3-secret-access-key
            - name: OPENPROJECT_FOG_CREDENTIALS_REGION
              value: "eu-central-1"
            - name: OPENPROJECT_FOG_CREDENTIALS_PATH__STYLE
              value: "true"
            - name: TMPDIR
              value: "/tmp/openproject"
            - name: OPENPROJECT_OPENID__CONNECT_KEYCLOAK_DISPLAY__NAME
              value: "Keycloak"
            - name: OPENPROJECT_OPENID__CONNECT_KEYCLOAK_HOST
              value: "keycloak.eneg.de"
            - name: OPENPROJECT_OPENID__CONNECT_KEYCLOAK_IDENTIFIER
              value: "openproject"
            - name: OPENPROJECT_OPENID__CONNECT_KEYCLOAK_SECRET
              valueFrom:
                secretKeyRef:
                  name: openproject-secrets
                  key: oidc-client-secret
            - name: OPENPROJECT_OPENID__CONNECT_KEYCLOAK_ISSUER
              value: "https://keycloak.eneg.de/realms/eNeG"
            - name: OPENPROJECT_OPENID__CONNECT_KEYCLOAK_AUTHORIZATION__ENDPOINT
              value: "https://keycloak.eneg.de/realms/eNeG/protocol/openid-connect/auth"
            - name: OPENPROJECT_OPENID__CONNECT_KEYCLOAK_TOKEN__ENDPOINT
              value: "https://keycloak.eneg.de/realms/eNeG/protocol/openid-connect/token"
            - name: OPENPROJECT_OPENID__CONNECT_KEYCLOAK_USERINFO__ENDPOINT
              value: "https://keycloak.eneg.de/realms/eNeG/protocol/openid-connect/userinfo"
            - name: OPENPROJECT_OPENID__CONNECT_KEYCLOAK_END__SESSION__ENDPOINT
              value: "https://keycloak.eneg.de/realms/eNeG/protocol/openid-connect/logout"
            - name: OPENPROJECT_OPENID__CONNECT_KEYCLOAK_JWKS__URI
              value: "https://keycloak.eneg.de/realms/eNeG/protocol/openid-connect/certs"
            - name: OPENPROJECT_OPENID__CONNECT_KEYCLOAK_SCOPE
              value: "[openid,profile,email]"
            - name: OPENPROJECT_OPENID__CONNECT_KEYCLOAK_ATTRIBUTE__MAP_LOGIN
              value: "preferred_username"
            - name: OPENPROJECT_OPENID__CONNECT_KEYCLOAK_ATTRIBUTE__MAP_EMAIL
              value: "email"
            - name: OPENPROJECT_OPENID__CONNECT_KEYCLOAK_ATTRIBUTE__MAP_FIRST__NAME
              value: "given_name"
            - name: OPENPROJECT_OPENID__CONNECT_KEYCLOAK_ATTRIBUTE__MAP_LAST__NAME
              value: "family_name"
            - name: OPENPROJECT_DEFAULT__LANGUAGE
              value: "de"
            - name: OPENPROJECT_SEED__LOCALE
              value: "de"
            # SMTP
            - name: OPENPROJECT_EMAIL__DELIVERY__METHOD
              value: "smtp"
            - name: OPENPROJECT_SMTP__ADDRESS
              value: "smtpout1.eneg.customers.hosting.zone"
            - name: OPENPROJECT_SMTP__PORT
              value: "587"
            - name: OPENPROJECT_SMTP__DOMAIN
              value: "eneg.de"
            - name: OPENPROJECT_SMTP__AUTHENTICATION
              value: "login"
            - name: OPENPROJECT_SMTP__ENABLE__STARTTLS__AUTO
              value: "true"
            - name: OPENPROJECT_SMTP__USER__NAME
              valueFrom:
                secretKeyRef:
                  name: openproject-secrets
                  key: smtp-username
            - name: OPENPROJECT_SMTP__PASSWORD
              valueFrom:
                secretKeyRef:
                  name: openproject-secrets
                  key: smtp-password
            - name: OPENPROJECT_MAIL__FROM
              value: "openproject@eneg.de"
            - name: TZ
              value: "Europe/Berlin"
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 2Gi
          livenessProbe:
            httpGet:
              path: /health_checks/default
              port: http
            initialDelaySeconds: 120
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /health_checks/default
              port: http
            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 10
      volumes:
        - name: tmp
          persistentVolumeClaim:
            claimName: openproject-tmp
---
# OpenProject Worker Deployment (PROD)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openproject-worker
  namespace: openproject
  labels:
    app.kubernetes.io/name: openproject
    app.kubernetes.io/component: worker
    app.kubernetes.io/version: "17.7.2"
    app.kubernetes.io/part-of: pilot-apps
    app.kubernetes.io/managed-by: argocd
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: openproject
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: openproject
        app.kubernetes.io/component: worker
    spec:
      securityContext:
        fsGroup: 1000
        runAsUser: 1000
        runAsGroup: 1000
      containers:
        - name: worker
          image: openproject/openproject:17.7.2-slim
          command:
            - bash
            - /app/docker/prod/worker
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: openproject-secrets
                  key: database-url
            - name: SECRET_KEY_BASE
              valueFrom:
                secretKeyRef:
                  name: openproject-secrets
                  key: secret-key-base
            - name: RAILS_CACHE_STORE
              value: "memcache"
            - name: OPENPROJECT_CACHE__MEMCACHE__SERVER
              value: "openproject-memcached.openproject.svc.cluster.local:11211"
            - name: OPENPROJECT_HOST__NAME
              value: "openproject.eneg.de"
            - name: OPENPROJECT_HTTPS
              value: "true"
            # SSRF-Schutz-Allowlist (ab 17.5.0) - identisch zu Web.
            # Der Worker laedt Attachments nach Garage S3 hoch, verschickt
            # Mails und liefert Webhooks aus, braucht die Allowlist also auch.
            - name: OPENPROJECT_SSRF__PROTECTION__IP__ALLOWLIST
              value: "192.168.178.0/24,192.168.179.0/24,192.168.180.0/24,192.168.161.0/24,10.43.0.0/16,10.42.0.0/16"
            - name: OPENPROJECT_ATTACHMENTS__STORAGE
              value: "fog"
            - name: OPENPROJECT_FOG_DIRECTORY
              value: "openproject-assets"
            - name: OPENPROJECT_FOG_CREDENTIALS_PROVIDER
              value: "aws"
            - name: OPENPROJECT_FOG_CREDENTIALS_ENDPOINT
              value: "http://garage-s3.garage.svc.cluster.local:3900"
            - name: OPENPROJECT_FOG_CREDENTIALS_AWS__ACCESS__KEY__ID
              valueFrom:
                secretKeyRef:
                  name: openproject-secrets
                  key: s3-access-key-id
            - name: OPENPROJECT_FOG_CREDENTIALS_AWS__SECRET__ACCESS__KEY
              valueFrom:
                secretKeyRef:
                  name: openproject-secrets
                  key: s3-secret-access-key
            - name: OPENPROJECT_FOG_CREDENTIALS_REGION
              value: "eu-central-1"
            - name: OPENPROJECT_FOG_CREDENTIALS_PATH__STYLE
              value: "true"
            # SMTP
            - name: OPENPROJECT_EMAIL__DELIVERY__METHOD
              value: "smtp"
            - name: OPENPROJECT_SMTP__ADDRESS
              value: "smtpout1.eneg.customers.hosting.zone"
            - name: OPENPROJECT_SMTP__PORT
              value: "587"
            - name: OPENPROJECT_SMTP__DOMAIN
              value: "eneg.de"
            - name: OPENPROJECT_SMTP__AUTHENTICATION
              value: "login"
            - name: OPENPROJECT_SMTP__ENABLE__STARTTLS__AUTO
              value: "true"
            - name: OPENPROJECT_SMTP__USER__NAME
              valueFrom:
                secretKeyRef:
                  name: openproject-secrets
                  key: smtp-username
            - name: OPENPROJECT_SMTP__PASSWORD
              valueFrom:
                secretKeyRef:
                  name: openproject-secrets
                  key: smtp-password
            - name: OPENPROJECT_MAIL__FROM
              value: "openproject@eneg.de"
            - name: TZ
              value: "Europe/Berlin"
          resources:
            requests:
              cpu: 250m
              memory: 768Mi
            # Speicher am 18.08.2026 von 1Gi auf 2Gi erhoeht.
            # Anlass: Beim Nachziehen eines Backfill-Jobs per
            # "kubectl exec ... rails runner" wurde der Container OOMKilled
            # (Exit 137) - ein zweiter vollstaendiger Rails-Prozess passt
            # neben dem laufenden Worker nicht in 1Gi. Fuer den
            # Normalbetrieb reichte 1Gi erwiesen aus, aber ab 17.7 laeuft
            # Rails 8.1 mit GoodJob 4.19 und 20 Threads, und speicher-
            # intensive Jobs (PDF/XLS-Exporte, Attachment-Verarbeitung)
            # hatten damit kaum Reserve.
            # Hinweis: einmalige rails-runner-Laeufe gehoeren trotzdem in
            # einen eigenen Job, nicht per exec in den Worker.
            limits:
              cpu: "1"
              memory: 2Gi
---
# OpenProject Seeder Job (PROD)
apiVersion: batch/v1
kind: Job
metadata:
  name: openproject-seeder
  namespace: openproject
  labels:
    app.kubernetes.io/name: openproject
    app.kubernetes.io/component: seeder
    app.kubernetes.io/managed-by: argocd
  annotations:
    # PreSync (nicht PostSync): Die DB-Migration muss VOR dem Rollout der
    # neuen web/worker-Pods laufen, sonst laeuft neuer Code gegen altes
    # Schema. Bei PostSync kann der neue web-Pod nicht ready werden -> Sync
    # bleibt Progressing -> PostSync-Hook feuert nie -> Deadlock.
    # Schlaegt der Hook fehl, bricht der Sync ab und die alten Pods laufen
    # unangetastet weiter - das ist in PROD die entscheidende Eigenschaft.
    # Auf DEV am 17.08.2026 eingefuehrt (sechs Etappen), auf TEST am
    # 18.08.2026 bestaetigt (107 Migrationen in einem Lauf).
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 3
  # 3600s: PROD springt in einem Lauf von 17.1.2 auf 17.7.2. Auf TEST
  # brauchten die 107 Migrationen dafuer 100 Sekunden. Grosszuegig
  # bemessen, damit die Deadline nie die Ursache eines Abbruchs ist.
  activeDeadlineSeconds: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: openproject
        app.kubernetes.io/component: seeder
    spec:
      restartPolicy: OnFailure
      securityContext:
        fsGroup: 1000
        runAsUser: 1000
        runAsGroup: 1000
      containers:
        - name: seeder
          image: openproject/openproject:17.7.2-slim
          command:
            - bash
            - /app/docker/prod/seeder
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: openproject-secrets
                  key: database-url
            - name: SECRET_KEY_BASE
              valueFrom:
                secretKeyRef:
                  name: openproject-secrets
                  key: secret-key-base
            - name: OPENPROJECT_HOST__NAME
              value: "openproject.eneg.de"
            - name: OPENPROJECT_HTTPS
              value: "true"
            - name: OPENPROJECT_DEFAULT__LANGUAGE
              value: "de"
            - name: OPENPROJECT_SEED__LOCALE
              value: "de"
            - name: TZ
              value: "Europe/Berlin"
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
