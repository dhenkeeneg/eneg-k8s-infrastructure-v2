---
# CA-Bundle (Sectigo Intermediate DV R36 + Root R46) fuer NAS20 S3 TLS-Verifikation
# OEFFENTLICHE CA-Zertifikate - kein Geheimnis, daher KEIN SOPS.
# Grund: QuObjects-Webserver (8010) sendet nur das Leaf-Zert, nicht die Kette
#        (bekanntes QuObjects-Limit, serverseitig nicht loesbar -> clientseitig CA-Bundle)
# Genutzt von: garage-backup CronJob (rclone, RCLONE_CA_CERT + Volume-Mount /etc/ca/ca.crt)
# RCLONE_CA_CERT ist additiv zum System-Trust -> reines Sectigo-Bundle genuegt.
# Quelle: crt.sectigo.com (SectigoPublicServerAuthenticationCADVR36 + RootR46)
# Verifiziert: openssl s_client -CAfile -> Verify return code 0 (ok)
# P4b NAS10->NAS20 Migration PROD (analog DEV/TEST)
apiVersion: v1
kind: Secret
metadata:
  name: garage-s3-ca
  namespace: garage
  labels:
    app.kubernetes.io/name: garage-backup
    app.kubernetes.io/part-of: infrastructure
    app.kubernetes.io/managed-by: argocd
type: Opaque
data:
  ca.crt: 
