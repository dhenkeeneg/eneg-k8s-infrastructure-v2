# kube-prometheus-stack PROD Override
# Environment: PROD (VLAN 178)
# PVC-Groessen, AlertManager-Config (SMTP + Teams)

# --- CoreDNS-Monitoring deaktivieren (Phase 12) ---
# PROD betreibt CoreDNS via eigenem Helm-Chart (coredns/coredns) mit
# eigenem Service "coredns-metrics" und ServiceMonitor "coredns".
# Der vom kube-prometheus-stack mitgelieferte Service+SM ist hier
# nicht passend (Selector matcht unsere Pod-Labels nicht).
coreDns:
  enabled: false

# --- Default Rules: PROD-spezifische Anpassungen ---
# KubeJobFailed Default deaktiviert, Custom-Version excludiert Velero
# Kopia-Maintain-Jobs (transient bei NAS10-Mikroausfaellen) und alarmiert
# nur bei persistenten Failures (>=3 fuer 2h) - siehe kube-job-failed-prod.yaml
defaultRules:
  disabled:
    KubeJobFailed: true

# --- Prometheus PROD (groessere PVCs) ---
prometheus:
  prometheusSpec:
    # PROD-Retention: 15d (Zeit, env-spezifisch belassen) / max. 38 GB (Groessendeckel).
    # retentionSize ergaenzt den fehlenden groessenbasierten Deckel (P3, Drift-Angleich
    # 15.07.2026): retention 15d allein kann die 50Gi-PVC volllaufen lassen. 38GB ~= 76%
    # der 50Gi-PVC, laesst ~12GB Puffer fuer WAL + chunks_head + Kompaktierungs-Spitzen.
    # Was zuerst greift (Zeit ODER Groesse), begrenzt. Thanos haelt die Langzeit-Historie
    # auf S3, lokal reicht kurze Vorhaltung. Hinweis: retentionSize schuetzt nur
    # persistierte Bloecke, NICHT das WAL - gegen WAL-Deadlock 21.06. wirken die
    # TSDB-Health-Alerts (prometheus-tsdb-health-prod.yaml).
    retention: 15d
    retentionSize: 38GB
    # Memory-Limit 3Gi (Angleich an DEV, P3 15.07.2026): PROD-Normalverbrauch ~1,7GB,
    # altes 2Gi-Limit liess nur ~0,3GB Puffer und war riskant beim WAL-Replay nach
    # Pod-Neustart (OOMKill genau im Recovery-Moment). 3Gi/1Gi gibt Replay-Puffer -
    # alle drei Cluster nun einheitlich.
    resources:
      requests:
        cpu: 100m
        memory: 1Gi
      limits:
        memory: 3Gi
    storageSpec:
      volumeClaimTemplate:
        spec:
          resources:
            requests:
              storage: 50Gi

    # CA-Bundle fuer NAS20 TLS im Thanos-Sidecar (schreibt Bloecke nach S3).
    # Sidecar nutzt thanos-objstore-config (objstore.yml mit ca_file:/etc/ca/ca.crt).
    # volumes = Pod-Ebene, thanos.volumeMounts = nur Sidecar-Container.
    # Secret eneg-s3-ca durch Loki-Migration (07.07.2026) bereits vorhanden.
    # P4a Thanos-Migration NAS10->NAS20 (16.07.2026), analog DEV/TEST-Muster.
    volumes:
      - name: s3-ca
        secret:
          secretName: eneg-s3-ca
    thanos:
      volumeMounts:
        - name: s3-ca
          mountPath: /etc/ca
          readOnly: true

# --- AlertManager Config ---
alertmanager:
  config:
    global:
      resolve_timeout: 5m
      smtp_from: "alertmanager-prod@eneg.de"
      smtp_smarthost: "smtpout1.eneg.customers.hosting.zone:587"
      smtp_auth_username: "smtpenge1"
      smtp_auth_password_file: "/etc/alertmanager/secrets/alertmanager-credentials/smtp-password"
      smtp_require_tls: true

    route:
      group_by: ['namespace', 'alertname']
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      receiver: 'email-and-teams'
      routes:
        # InfoInhibitor: Meta-Alert an null-Receiver (kein Alarm)
        - match:
            alertname: InfoInhibitor
          receiver: 'null'
        # Watchdog: Nur 1x taeglich um 07:00 MESZ (DeadMansSwitch)
        - match:
            alertname: Watchdog
          receiver: 'email-and-teams'
          repeat_interval: 24h
          active_time_intervals:
            - morning-report
        # Critical Alerts: kuerzeres Repeat-Intervall
        - match:
            severity: critical
          receiver: 'email-and-teams'
          repeat_interval: 1h

    # Zeitfenster: 07:00-07:10 Uhr deutscher Zeit
    time_intervals:
      - name: morning-report
        time_intervals:
          - times:
              - start_time: '07:00'
                end_time: '07:10'
            location: 'Europe/Berlin'

    receivers:
      - name: 'null'
      - name: 'email-and-teams'
        email_configs:
          - to: 'd.henke@eneg.de'
            send_resolved: true
        webhook_configs:
          - url: "http://prometheus-msteams.monitoring.svc.cluster.local:2000/alertmanager"
            send_resolved: true

    inhibit_rules:
      - source_matchers:
          - severity = critical
        target_matchers:
          - severity = warning
        equal: ['namespace', 'alertname']
      - source_matchers:
          - alertname = InfoInhibitor
        target_matchers:
          - severity = info
        equal: ['namespace']
