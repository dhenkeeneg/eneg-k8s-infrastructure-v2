---
# CloudNativePG Cluster: cnpg-shared (PROD)
# PostgreSQL 17.9 HA-Cluster fuer leichtgewichtige Apps
# Apps: n8n, Keycloak, Gitea, Papermerge
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: cnpg-shared
  namespace: databases
  labels:
    app.kubernetes.io/part-of: cloudnative-pg
    app.kubernetes.io/managed-by: argocd
spec:
  description: "Shared PostgreSQL Cluster fuer leichtgewichtige Apps"
  imageName: ghcr.io/cloudnative-pg/postgresql:17.9-standard-bookworm
  instances: 3
  primaryUpdateStrategy: unsupervised

  # Superuser-Zugang fuer pg_dumpall Backups
  enableSuperuserAccess: true

  # Monitoring: PodMonitor fuer Prometheus Metriken
  monitoring:
    enablePodMonitor: true

  # PostgreSQL Konfiguration (PROD-Dimensionierung)
  postgresql:
    parameters:
      shared_buffers: "256MB"
      effective_cache_size: "768MB"
      work_mem: "4MB"
      maintenance_work_mem: "64MB"
      max_connections: "200"
      wal_buffers: "8MB"
      min_wal_size: "256MB"
      max_wal_size: "1GB"
      checkpoint_completion_target: "0.9"
      log_statement: "ddl"
      log_min_duration_statement: "1000"
      lc_messages: "C"
      # Timezone
      timezone: "Europe/Berlin"

  # Storage
  storage:
    size: 20Gi
    storageClass: longhorn-db

  # WAL Storage (separates Volume fuer bessere I/O-Performance)
  walStorage:
    size: 5Gi
    storageClass: longhorn-db

  # Resources (PROD-Dimensionierung)
  resources:
    requests:
      memory: "512Mi"
      cpu: "250m"
    limits:
      memory: "1Gi"
      cpu: "1"

  # Backup via Barman Cloud Plugin (ersetzt in-tree barmanObjectStore)
  plugins:
    - enabled: true
      isWALArchiver: true
      name: barman-cloud.cloudnative-pg.io
      parameters:
        barmanObjectName: cnpg-shared-objectstore
        # serverName v2: frischer Backup-Pfad nach Neu-Init (System-ID 7660117729400840211,
        # Timeline 1) - vermeidet Kollision mit stale Alt-Archiv unter serverName cnpg-shared.
        # Recovery-Incident 2026-07-08. Alt-Historie bleibt als Netz erhalten.
        serverName: cnpg-shared-v2

  # Managed Roles (deklarativ, Passwoerter aus SOPS Secrets)
  managed:
    roles:
      - name: n8n
        login: true
        createdb: false
        superuser: false
        inherit: true
        connectionLimit: -1
        ensure: present
        passwordSecret:
          name: n8n-db-credentials
      - name: keycloak
        login: true
        createdb: false
        superuser: false
        inherit: true
        connectionLimit: -1
        ensure: present
        passwordSecret:
          name: keycloak-db-credentials
      - name: it_info_versand
        login: true
        createdb: false
        superuser: false
        inherit: true
        connectionLimit: -1
        ensure: present
        passwordSecret:
          name: it-info-versand-db-credentials

  # Monitoring (vorbereitet fuer Phase 7)
  monitoring:
    enablePodMonitor: false
