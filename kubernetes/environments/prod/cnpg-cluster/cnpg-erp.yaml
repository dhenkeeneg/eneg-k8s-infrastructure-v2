---
# CloudNativePG Cluster: cnpg-erp (PROD)
# PostgreSQL 17.9 HA-Cluster fuer schwergewichtige ERP-Apps
# Apps: Odoo, OpenProject
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: cnpg-erp
  namespace: databases
  labels:
    app.kubernetes.io/part-of: cloudnative-pg
    app.kubernetes.io/managed-by: argocd
spec:
  description: "ERP PostgreSQL Cluster fuer Odoo und OpenProject"
  imageName: ghcr.io/cloudnative-pg/postgresql:17.9-standard-bookworm
  instances: 3
  primaryUpdateStrategy: unsupervised

  # PriorityClass: schuetzt die DB-Pods im Node-Pressure-Fall vor Verdraengung
  # (2026-06-29 Resilienz-Haertung, P2.4 nach PROD 15.07.2026). Definition:
  # kubernetes/base/priorityclasses/eneg-stateful-critical.yaml (value 900000000,
  # knapp unter longhorn-critical). Loest Rolling-Restart aus.
  priorityClassName: eneg-stateful-critical

  # Superuser-Zugang fuer pg_dumpall Backups
  enableSuperuserAccess: true

  # Managed Roles (Passwort aus Secret, Login erlaubt)
  managed:
    roles:
      - name: openproject
        ensure: present
        login: true
        createdb: false
        connectionLimit: -1
        inherit: true
        passwordSecret:
          name: openproject-db-credentials
      - name: odoo
        ensure: present
        login: true
        createdb: false
        connectionLimit: -1
        inherit: true
        passwordSecret:
          name: odoo-db-credentials

  # PostgreSQL Konfiguration (PROD-Dimensionierung)
  postgresql:
    parameters:
      shared_buffers: "512MB"
      effective_cache_size: "1536MB"
      work_mem: "8MB"
      maintenance_work_mem: "128MB"
      max_connections: "100"
      wal_buffers: "16MB"
      min_wal_size: "512MB"
      max_wal_size: "2GB"
      # WAL-Slot-Deckel (2026-07-08): begrenzt, wieviel WAL ein (auch inaktiver)
      # Replication-Slot zurueckhalten darf. Verhindert, dass ein haengender Slot
      # das WAL-Volume volllaufen laesst (Ursache des cnpg-erp-Ausfalls 08.07.).
      # sighup-Parameter (Reload). Bei Ueberschreitung faellt die Replica auf
      # S3-Archive-Restore zurueck (Archiving laeuft durchgehend).
      max_slot_wal_keep_size: "6GB"
      checkpoint_completion_target: "0.9"
      log_statement: "ddl"
      log_min_duration_statement: "1000"
      lc_messages: "C"
      # Timezone
      timezone: "Europe/Berlin"

  # Storage
  storage:
    size: 20Gi
    storageClass: longhorn-db

  # WAL Storage (separates Volume)
  # 2026-07-08: 5Gi -> 8Gi. Das 5Gi-WAL-Volume des Primary lief zu 99% voll
  # -> PANIC "No space left on device" -> Cluster down. Mehr Puffer + der
  # max_slot_wal_keep_size-Deckel oben verhindern eine Wiederholung.
  # Verkleinern spaeter nur per Instanz-Recreate moeglich.
  walStorage:
    size: 8Gi
    storageClass: longhorn-db

  # Resources (PROD-Dimensionierung)
  resources:
    requests:
      memory: "1Gi"
      cpu: "500m"
    limits:
      memory: "2Gi"
      cpu: "2"

  # Backup via Barman Cloud Plugin (ersetzt in-tree barmanObjectStore)
  plugins:
    - enabled: true
      isWALArchiver: true
      name: barman-cloud.cloudnative-pg.io
      parameters:
        barmanObjectName: cnpg-erp-objectstore

  # Monitoring (vorbereitet fuer Phase 7)
  monitoring:
    enablePodMonitor: false
