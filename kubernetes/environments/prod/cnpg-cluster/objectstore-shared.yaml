---
# ObjectStore: cnpg-shared Backup-Konfiguration (Barman Cloud Plugin)
# Ersetzt die in-tree barmanObjectStore-Konfiguration im Cluster-Manifest
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: cnpg-shared-objectstore
  namespace: databases
  labels:
    app.kubernetes.io/part-of: cloudnative-pg
    app.kubernetes.io/managed-by: argocd
spec:
  configuration:
    destinationPath: s3://k8s-prod-postgres-wal/cnpg-shared/
    endpointURL: https://nas20.eneg.de:8010
    # NAS20 QuObjects sendet nur das Leaf-Zert (nicht die Sectigo-Kette).
    # Barman braucht daher das CA-Bundle clientseitig (Intermediate R36 + Root R46).
    # Secret cnpg-s3-ca (unverschluesselt, oeffentliche CA) im Namespace databases.
    endpointCA:
      name: cnpg-s3-ca
      key: ca.crt
    s3Credentials:
      accessKeyId:
        name: cnpg-s3-credentials
        key: ACCESS_KEY_ID
      secretAccessKey:
        name: cnpg-s3-credentials
        key: SECRET_ACCESS_KEY
  retentionPolicy: "7d"
  # WORKAROUND: NAS20 (QNAP QuObjects) ist nicht kompatibel mit boto3 >= 1.36
  # Default "request_checksum_calculation=when_supported". boto3 sendet seit Jan 2025
  # standardmaessig CRC32 Trailing-Checksums bei jedem PutObject. QuObjects validiert
  # den Header falsch -> InvalidDigest -> barman-cloud-wal-archive scheitert (exit 4).
  # Fix: AWS_REQUEST_CHECKSUM_CALCULATION=when_required (Checksum nur wenn erforderlich).
  # In DEV verifiziert (WAL-Archive ~300-650ms/WAL). P4b: identisch fuer PROD NAS20.
  # Quelle: https://aws.amazon.com/blogs/developer/new-default-checksum-behavior-in-aws-sdks/
  instanceSidecarConfiguration:
    env:
      - name: AWS_REQUEST_CHECKSUM_CALCULATION
        value: when_required
      - name: AWS_RESPONSE_CHECKSUM_VALIDATION
        value: when_required
