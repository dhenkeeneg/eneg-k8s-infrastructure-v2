---
# ArgoCD Application: Grafana Alloy (PROD)
# Multi-Source: Helm Chart v1.7.0 + Base Values
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: alloy
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "4"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: https://grafana.github.io/helm-charts
      chart: alloy
      targetRevision: 1.7.0
      helm:
        releaseName: alloy
        valueFiles:
          - $values/kubernetes/base/monitoring/alloy/values.yaml
    - repoURL: git@github.com:dhenkeeneg/eneg-k8s-infrastructure-v2.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
