---
# ArgoCD Application: IT-Info-Versand Secrets (PROD, via KSOPS)
# Sync-Wave 7: Nach Databases (Wave 6), vor App (Wave 8)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: it-info-versand-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "7"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    repoURL: git@github.com:dhenkeeneg/eneg-k8s-infrastructure-v2.git
    targetRevision: main
    path: kubernetes/environments/prod/apps/it-info-versand/secrets

  destination:
    server: https://kubernetes.default.svc
    namespace: it-info-versand

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
